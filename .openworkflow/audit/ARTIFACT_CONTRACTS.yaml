      updated_at: null
    conditional_packets:
      - artifactType: tech_spec
        path: .openworkflow/design/<id>/TECH_SPEC.yaml
        requiredByDefault: false
        when: Use when implementation constraints, architecture, integrations, or non-functional
          requirements must be clarified before /ow:spec.
      - artifactType: frontend_spec
        path: .openworkflow/design/<id>/FRONTEND_SPEC.yaml
        requiredByDefault: false
        when: Use when UI structure, component behavior, visual states, or accessibility details need a
          dedicated packet.
      - artifactType: backend_spec
        path: .openworkflow/design/<id>/BACKEND_SPEC.yaml
        requiredByDefault: false
        when: Use when server behavior, jobs, services, permissions, or operational boundaries need a
          dedicated packet.
      - artifactType: api_contract
        path: .openworkflow/design/<id>/API_CONTRACT.yaml
        requiredByDefault: false
        when: Use when external or internal API request, response, error, or compatibility contracts are
          needed.
      - artifactType: db_schema_model
        path: .openworkflow/design/<id>/DB_SCHEMA_MODEL.yaml
        requiredByDefault: false
        when: Use when persistent entities, relationships, migrations, or retention rules need explicit
          modeling.
