schema_version: 0.1.0
contract_id: audit:artifact-contracts
contract_type: workflow
title: OpenWorkflow artifact contracts
status: active
source_of_truth: .openworkflow
artifacts:
  - artifact_type: vision_session
    contract_type: vision
    command: /ow:vision
    title: Vision session
    source_of_truth_path: .openworkflow/vision/sessions/<id>/VISION_SESSION.yaml
    template_path: .openworkflow/vision/_templates/VISION_SESSION.yaml
    index_path: .openworkflow/vision/VISION_CONTRACT.yaml
    index_collection_key: sessions
    note_path: .openworkflow/vision/sessions/<id>/NOTE.md
    review_path: null
    disclosure_level: 2
    required_keys:
      - artifact_type
      - current_question
      - stable_answers
      - unresolved_questions
      - vision_delta
      - handoff
    read_policy:
      load_by_default: true
      agent_read_order: 20
      max_yaml_lines: 90
      max_note_lines: 40
      raw_evidence: never_by_default
    active_pointer:
      index_path: .openworkflow/vision/VISION_CONTRACT.yaml
      pointer_key: current_session
      collection_key: sessions
      id_key: session_id
      path_key: path
    evidence_policy: Reference human notes when intent needs explanation; do not embed long
      brainstorming transcript.
    handoff_key: handoff.next_command
    summary_policy:
      strategy: current_slice
      path: vision_delta
      load_before_full: true
      refresh_when: Update the current slice when stable_answers or unresolved_questions change.
    lazy_create: true
    template:
      schema_version: 0.1.0
      contract_id: vision:<id>
      contract_type: vision
      artifact_type: vision_session
      title: <short vision session title>
      status: draft
      current_question: ""
      stable_answers:
        []
      unresolved_questions:
        []
      vision_delta:
        one_sentence: ""
        problem: ""
        goals:
          []
        non_goals:
          []
        users:
          []
        quality_bar:
          []
        ai_native_role: ""
        success_signals:
          []
        failure_signals:
          []
      strategic_core:
        target_user: ""
        context: ""
        current_alternative: ""
        pain: ""
        desired_behavior_change: ""
        core_mechanism: ""
        core_differentiator: ""
        strongest_success_signal: ""
        failure_signals:
          []
      product_system_seed:
        product_thesis: ""
        primary_loop:
          []
        interaction_model: ""
        feature_system:
          []
        emotional_value: ""
        functional_value: ""
        trust_boundary: ""
        privacy_boundary: ""
        anti_goals:
          []
        future_opportunities:
          []
      proto_readiness:
        status: missing
        missing_for_proto:
          []
        prototype_direction_seeds:
          []
        prompt_constraints:
          []
        validation_target: ""
        downstream_notes:
          []
      coverage:
        target_user:
          status: missing
          evidence:
            []
          follow_up_question: ""
        differentiator:
          status: missing
          evidence:
            []
          follow_up_question: ""
        success_signal:
          status: missing
          evidence:
            []
          follow_up_question: ""
        trust_boundary:
          status: missing
          evidence:
            []
          follow_up_question: ""
        proto_readiness:
          status: missing
          evidence:
            []
          follow_up_question: ""
      handoff:
        ready: false
        next_command: null
        blockers:
          []
        readiness_notes:
          []
      updated_at: null
    conditional_packets:
      []
  - artifact_type: validation_target
    contract_type: validation
    command: /ow:validation
    title: Validation target
    source_of_truth_path: .openworkflow/validation/<id>/VALIDATION.yaml
    template_path: .openworkflow/validation/_templates/VALIDATION.yaml
    index_path: .openworkflow/validation/VALIDATION_INDEX.yaml
    index_collection_key: validations
    note_path: .openworkflow/validation/<id>/NOTE.md
    review_path: null
    disclosure_level: 2
    required_keys:
      - artifact_type
      - trigger
      - core_question
      - central_uncertainty
      - hypothesis
      - target_behavior
      - feature_classification
      - critical_assumptions
      - prototype_scope
      - prototype_experiment
      - observable_signals
      - acceptance
      - decision_rules
      - decision_options
      - vision_gaps
      - agent_readiness_gate
    read_policy:
      load_by_default: true
      agent_read_order: 30
      max_yaml_lines: 120
      max_note_lines: 40
      raw_evidence: never_by_default
    active_pointer:
      index_path: .openworkflow/validation/VALIDATION_INDEX.yaml
      pointer_key: current_validation
      collection_key: validations
      id_key: validation_id
      path_key: path
    evidence_policy: Compile one prototype validation target in YAML; keep rationale compact and defer
      examples to NOTE.md.
    handoff_key: prototype_scope
    summary_policy:
      strategy: current_slice
      path: core_question + central_uncertainty + target_behavior + prototype_experiment +
        observable_signals + decision_rules + agent_readiness_gate
      load_before_full: true
      refresh_when: Update the current slice when the experiment target, evidence signals, decision rules,
        or readiness gate changes.
    lazy_create: true
    template:
      schema_version: 0.1.0
      contract_id: validation:<id>
      contract_type: validation
      artifact_type: validation_target
      title: <short validation target title>
      status: draft
      trigger:
        mode: user_explicit
        requested_command: /ow:validation
        reason: user_invoked_validation
      core_question: ""
      central_uncertainty: ""
      hypothesis: ""
      target_behavior: ""
      feature_classification:
        existential:
          []
        supporting:
          []
        later:
          []
        out_of_scope:
          []
      critical_assumptions:
        []
      prototype_scope:
        include:
          []
        exclude:
          []
      prototype_experiment:
        scenario: ""
        must_show:
          []
        must_not_show:
          []
      observable_signals:
        pass:
          []
        fail:
          []
        ambiguous:
          []
      acceptance:
        []
      decision_rules:
        continue:
          []
        revise:
          []
        pivot:
          []
        stop:
          []
        needs_more_evidence:
          []
      decision_options:
        - continue
        - revise
        - pivot
        - stop
        - needs_more_evidence
      vision_gaps:
        []
      agent_readiness_gate:
        status: thin_validation
        blockers:
          []
        warnings:
          []
        write_authority: /ow:validation
      updated_at: null
    conditional_packets:
      []
  - artifact_type: prototype_evidence
    contract_type: prototype
    command: /ow:proto
    title: Prototype evidence
    source_of_truth_path: .openworkflow/prototypes/<id>/EVIDENCE.yaml
    template_path: .openworkflow/prototypes/_templates/EVIDENCE.yaml
    index_path: .openworkflow/prototypes/PROTOTYPE_INDEX.yaml
    index_collection_key: prototypes
    note_path: .openworkflow/prototypes/<id>/NOTE.md
    review_path: null
    disclosure_level: 2
    required_keys:
      - artifact_type
      - validation_target
      - core_question
      - prototype_mode
      - prompt_pack_type
      - validation_input
      - source
      - preflight_quality_gate
      - direction_count_policy
      - normalized_input
      - strategic_core
      - directions
      - build_recommendation
      - prompt_text_manifest
      - image_generation
      - negative_constraints
      - review_plan
      - result
      - handoff
    read_policy:
      load_by_default: true
      agent_read_order: 40
      max_yaml_lines: 190
      max_note_lines: 50
      raw_evidence: only_when_referenced
    active_pointer:
      index_path: .openworkflow/prototypes/PROTOTYPE_INDEX.yaml
      pointer_key: current_prototype
      collection_key: prototypes
      id_key: prototype_id
      path_key: path
    evidence_policy: Reference strategic prompt packs, refined prompt packs, generated images, review
      notes, and decision evidence by path; keep image binaries out of YAML and do not turn prompt
      packs into production tasks.
    handoff_key: handoff.next_command
    summary_policy:
      strategy: summary_file
      path: .openworkflow/prototypes/<id>/SUMMARY.yaml
      load_before_full: true
      refresh_when: Refresh after prompt pack, review evidence, result, or handoff changes.
    lazy_create: true
    template:
      schema_version: 0.1.0
      contract_id: prototype:<id>
      contract_type: prototype
      artifact_type: prototype_evidence
      title: <short prototype evidence title>
      status: draft
      validation_target: null
      core_question: ""
      prototype_mode: image_prompt_pack
      prompt_pack_type: strategic_proto_prompt_pack
      validation_input:
        mode: validation_present|agent_auto_generated
        refs:
          []
        notes:
          []
      source:
        refs:
          []
        target_tool: image_generation
        output_language: ""
      preflight_quality_gate:
        vision_status: missing|thin|ready
        validation_status: missing|thin|ready
        can_proceed: false
        blockers:
          []
        next_command_when_blocked: /ow:vision
        required_followup_questions:
          []
      direction_count_policy:
        requested_count: null
        resolved_count: 3
        source: user_input|agent_default_after_user_delegation
        ask_user_question_required: true
        ask_user_question: How many strategically different prototype directions should /ow:proto generate?
      normalized_input:
        product_domain: ""
        primary_user: ""
        usage_context: ""
        current_alternative: ""
        core_pain: ""
        desired_behavior_change: ""
        strongest_success_signal: ""
        core_differentiator: ""
        emotional_value: ""
        functional_value: ""
        trust_requirements:
          []
        privacy_requirements:
          []
        non_goals:
          []
        future_opportunities:
          []
        validation_target: ""
      strategic_core:
        target_user: ""
        behavior_change: ""
        mechanism: ""
        differentiator: ""
        boundary_conditions:
          []
        central_uncertainty: ""
      directions:
        - direction_id: ""
          name: ""
          strategic_hypothesis: ""
          validates: ""
          main_risk: ""
          distinctness_rationale: ""
          prototype_prompt: ""
          screen_prompts:
            []
          pm_judgment: ""
      build_recommendation:
        first_direction_id: ""
        why_first: ""
        success_signals:
          []
        failure_signals:
          []
        next_test_if_it_works: ""
      baseline_audit:
        []
      product_system:
        {}
      delta_rules:
        must_inherit:
          []
        must_add:
          []
        must_remove:
          []
        flexible_change:
          []
      screen_manifest:
        []
      global_design_prompt: ""
      screen_prompts:
        - prompt_id: ""
          screen_name: ""
          image_role: ""
          prompt: ""
          acceptance_criteria:
            []
      prompt_text_manifest:
        status: draft
        directions_ready: false
        direction_count: 0
        prompt_text_refs:
          []
      image_generation:
        status: not_started
        batch_strategy: Generate each selected direction as a coherent multi-image screen group after
          prompt_text_manifest.status is ready_for_image_generation.
        generated_images:
          []
        collection_notes:
          []
      negative_constraints:
        []
      review_plan:
        {}
      observations:
        []
      evidence:
        []
      generated_images:
        []
      known_limits:
        []
      result: not_reviewed
      handoff:
        next_command: /ow:tune
      updated_at: null
    conditional_packets:
      []
  - artifact_type: decision_record
    contract_type: decision
    command: /ow:decision
    title: Decision record
    source_of_truth_path: .openworkflow/decisions/<id>/DECISION.yaml
    template_path: .openworkflow/decisions/_templates/DECISION.yaml
    index_path: .openworkflow/decisions/DECISION_INDEX.yaml
    index_collection_key: decisions
    note_path: .openworkflow/decisions/<id>/NOTE.md
    review_path: .openworkflow/decisions/<id>/review.html
    disclosure_level: 2
    required_keys:
      - artifact_type
      - reviewed_evidence
      - outcome
      - rationale
      - accepted_scope
      - rejected_scope
      - revision_scope
      - next_command
      - follow_up_questions
    read_policy:
      load_by_default: true
      agent_read_order: 50
      max_yaml_lines: 120
      max_note_lines: 50
      raw_evidence: human_review_only
    active_pointer:
      index_path: .openworkflow/decisions/DECISION_INDEX.yaml
      pointer_key: current_decision
      collection_key: decisions
      id_key: decision_id
      path_key: path
    evidence_policy: Reference reviewed evidence and user feedback; summarize rationale without copying
      full review transcripts.
    handoff_key: next_command
    summary_policy:
      strategy: current_slice
      path: outcome + rationale + next_command + follow_up_questions
      load_before_full: true
      refresh_when: Update whenever the decision outcome or next command changes.
    lazy_create: true
    template:
      schema_version: 0.1.0
      contract_id: decision:<id>
      contract_type: decision
      artifact_type: decision_record
      title: <short decision title>
      status: draft
      reviewed_evidence:
        []
      outcome: needs_more_evidence
      rationale: ""
      accepted_scope:
        []
      rejected_scope:
        []
      revision_scope:
        []
      next_command: null
      follow_up_questions:
        []
      updated_at: null
    conditional_packets:
      []
