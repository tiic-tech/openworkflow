summary: >
  Dogfood the image-first prototype source flow on OpenWorkflow's own vision by
  producing a strategic proto prompt pack, selecting the first generation
  direction, and recording review/tune evidence.
problem: >
  The redesigned proto and tune source skills need first-consumer evidence
  before runtime exposure. The dogfood run should prove that `build-prototype`
  can turn OpenWorkflow's own vision into actionable visual prototype prompts
  while keeping tuning and production implementation out of scope.
goals:
  - Produce a strategic prototype prompt pack from OpenWorkflow vision-only input.
  - Choose one first generation direction based on risk reduction and flow
    relevance.
  - Record evidence for what to accept, tune, or avoid in the next pass.
  - Keep runtime command exposure and HTML conversion out of scope.
non_goals:
  - Do not expose runtime command or adapter surfaces.
  - Do not generate HTML, CSS, or production implementation tasks.
  - Do not create real image assets in this change.
  - Do not change proto prompt pack schema.
affected_paths:
  - changes/M66-proto-redesign-source-dogfood/
  - changes/M59-proto-redesign-planning-dogfood/
acceptance:
  - The redesigned proto flow produces actionable image-generation prompt artifacts.
  - Evidence records what should be accepted or tuned.
  - Follow-up production work remains selectable by stable id.
validation:
  - npm run validate
  - node dist/cli/src/index.js handoff --root . --json
