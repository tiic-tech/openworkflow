schema_version: 0.1.0
contract_id: change:M13-codex-skill-adapter-alignment
contract_type: change
title: M13 Codex skill adapter alignment
status: active
source_artifacts:
  - changes/M12-runtime-command-surface/CHANGE.yaml
  - references/runtime-command-surface.md
depends_on:
  - change:M12-runtime-command-surface
produces:
  - work_items:M13-codex-skill-adapter-alignment
summary: >
  Align the Codex adapter with Codex's official repo-local Skill registration
  surface by generating .agents/skills/ow-* skill folders instead of treating
  global prompt files or .codex command files as the primary command surface.
problem: >
  M12 corrected the earlier .codex/commands assumption by moving command prompts
  to $CODEX_HOME/prompts, but Codex's official custom workflow surface is
  repo-local Skills under .agents/skills. OpenWorkflow should install semantic
  ow-* skills with SKILL.md frontmatter and agents/openai.yaml display metadata,
  while keeping .openworkflow as the runtime source of truth.
goals:
  - Make init --tools codex generate .agents/skills/ow-* skill folders.
  - Put each command protocol in the matching SKILL.md.
  - Generate agents/openai.yaml for Codex App display metadata.
  - Update config, manifest, doctor, and runtime surface verification to treat Skills as the primary surface.
  - Rename code-level M12 verification identifiers to semantic runtime-surface names.
  - Clean up generated legacy .codex command, .codex skill, and global prompt artifacts when safe.
non_goals:
  - Do not migrate Python scripts to TypeScript in this change.
  - Do not implement /ow:tune.
  - Do not publish the npm package.
  - Do not remove historical M12 artifacts.
decisions:
  - OpenWorkflow semantic command names stay /ow:<command>.
  - Codex explicit invocation uses $ow-<command>.
  - The Codex slash menu may expose enabled skills, but OpenWorkflow treats skill registration as the durable mechanism.
  - Repo-local adapter manifest remains generated under .agents/openworkflow-adapter.yaml.
  - No production code file or npm script should include milestone labels such as M12 or M13.
affected_paths:
  - packages/adapters/codex/src/
  - packages/core/src/workflow/initOpenWorkflow.ts
  - packages/cli/src/commands/
  - package.json
  - scripts/
  - references/runtime-command-surface.md
  - changes/M13-codex-skill-adapter-alignment/
acceptance:
  - init --tools codex generates .agents/skills/ow-*/SKILL.md and agents/openai.yaml.
  - .openworkflow stays minimal with only config, workflow, and audit files.
  - No $CODEX_HOME/prompts/ow-*.md files are generated by default.
  - No .codex/commands/ow or .codex/skills adapter files are generated by default.
  - Config and manifest identify .agents/skills as the Codex primary adapter surface.
  - Doctor validates skill files and reports stale or missing generated skill artifacts.
  - Runtime surface verification passes with semantic script naming.
validation:
  - npm run build
  - npm run validate
  - npm run verify:runtime-surface
  - npm run smoke:init
  - node dist/cli/src/index.js sync --root /tmp/openworkflow-m04-smoke --tools codex
  - node dist/cli/src/index.js doctor --root /tmp/openworkflow-m04-smoke --tools codex
  - npm run validate:cli
updated_at: null
