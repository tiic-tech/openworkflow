contract_id: work_items:M17-tune-orchestration-internal-decision
contract_type: work_items
title: M17 Tune orchestration with internal decision audit work items
status: proposed
change_contract: changes/M17-tune-orchestration-internal-decision/CHANGE.yaml
items:
  - task_id: M17-T001
    title: Define tune command model and target routing
    status: pending
    depends_on: []
    owned_paths:
      - changes/M17-tune-orchestration-internal-decision/
      - packages/core/src/commands/
      - references/
    acceptance:
      - /ow:tune defaults to current prototype.
      - /ow:tune:proto explicitly targets the current prototype path.
      - /ow:tune:<target> routing semantics are documented for future artifact targets.
      - Tune does not create specs, changes, runtime work, auth, or persistence unless already in prototype validation scope.
  - task_id: M17-T002
    title: Convert decision to internal audit behavior
    status: pending
    depends_on:
      - M17-T001
    owned_paths:
      - packages/core/src/commands/
      - packages/core/src/artifacts/
      - packages/adapters/codex/src/
      - references/
    acceptance:
      - /ow:decision remains in internal command and artifact registries.
      - Normal user-facing proto/tune handoffs do not ask the user to invoke /ow:decision.
      - Decision audit recording is required after proto and tune evidence changes.
      - Internal decision guidance stays XML-wrapped and output-isolated.
  - task_id: M17-T003
    title: Extend decision artifact outcomes for tune loops
    status: pending
    depends_on:
      - M17-T002
    owned_paths:
      - packages/core/src/artifacts/
      - packages/core/src/validators/
      - schemas/
    acceptance:
      - decision_record outcome supports revise.
      - Validators accept revise and still reject unknown outcomes.
      - Decision templates explain when revise differs from needs_more_evidence.
  - task_id: M17-T004
    title: Generate Codex ow-tune skill
    status: pending
    depends_on:
      - M17-T001
      - M17-T002
    owned_paths:
      - packages/adapters/codex/src/
      - packages/core/src/commands/
      - packages/cli/src/dev/
    acceptance:
      - .agents/skills/ow-tune/SKILL.md is generated on init/sync.
      - ow-tune skill includes target resolution, proto orchestration, revision behavior, decision audit recording, and handoff guidance.
      - ow-tune skill includes <user_behavior>, <agent_protocol>, <inner_thinking>, and tune-specific XML sections.
  - task_id: M17-T005
    title: Update runtime verification and E2E coverage
    status: pending
    depends_on:
      - M17-T003
      - M17-T004
    owned_paths:
      - packages/cli/src/dev/
      - changes/M17-tune-orchestration-internal-decision/
    acceptance:
      - Runtime surface verification checks ow-tune exists.
      - Runtime surface verification checks ow-decision is audit/internal in normal handoffs.
      - Runtime surface verification checks proto/tune do not expose manual decision as the main next step.
      - Validation command list passes.
