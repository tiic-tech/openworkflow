    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - makes /ow:vision2prompt infer a product experience model before prompt directions
    - prevents artifact-valid but human-invalid prototype prompt packs
    - preserves the dailin pattern of strategy hypothesis plus product-system concreteness
    - forces target-category reality checks before /ow:prompt2proto starts image generation
    - keeps product quality gates deterministic and inspectable inside OW artifacts
  avoid:
    - reference-image copying or requiring external benchmark screenshots
    - provider-specific image generation changes
    - proto2html, html2spec, or production implementation work
    - broad UI design-system libraries unrelated to prototype discovery
    - replacing human prototype review with an overclaiming automated visual judge
scope_control:
  current_boundary: >
    Upgrade the first-pass /ow:proto internal prompt compiler so VISION-only
    discovery derives a product-category-aware experience model and blocks
    generic prompt packs before image generation.
  boundary_type: workflow_slice
  in_scope_rule: >
    Include only source contracts, generated command protocols, validators, and
    deterministic fixtures needed for /ow:vision2prompt to infer product
    archetype, experience topology, domain objects, task loop, state model,
    data realism, visual language, and anti-generic constraints before
    /ow:prompt2proto.
  out_of_scope_rule: >
    Record visual reference ingestion, external image-quality classifiers,
    provider-backed image generation, proto2html, tune inheritance, and full
    end-to-end dogfood reruns as deferred refs unless a later DTC queue selects
    them explicitly.
  deferred_features:
    - title: Reference image or demo pattern ingestion
      reason: >
        The approved M93 goal is VISION-only autonomous prototype quality, not
        copying or analyzing supplied benchmark images.
      suggested_plan_id: M94-reference-pattern-input-gate
    - title: Provider-backed image generation quality benchmark
      reason: >
        M93 should improve prompt thinking and gates before changing image
        generation providers or runtime execution.
      suggested_plan_id: M95-provider-image-generation-benchmark
    - title: Visual inspection or screenshot classifier gate
      reason: >
        Automated visual judgment is higher risk and should follow deterministic
        product-experience contracts.
      suggested_plan_id: M96-prototype-visual-quality-review-gate
    - title: Re-run smart city full E2E after M93
      reason: >
        A new dogfood run should happen after the contract, protocol, and
        validator candidates land.
      suggested_plan_id: M97-smart-city-product-reality-dogfood
next_recommended_candidate_id: C001
