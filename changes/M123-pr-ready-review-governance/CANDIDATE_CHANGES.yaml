changes:
  - id: C001
    status: ready
    title: Refresh draft PR readiness preflight
    purpose: >
      Produce a current read-only preflight packet for PR #5 and PR #4, including draft state,
      head/base refs, mergeability, status checks, branch heads, and recommended ready-review order.
    scope:
      includes:
        - verify PR #5 and PR #4 are still open draft PRs
        - verify head/base refs and head OIDs
        - inspect mergeability, review decision, and status check rollup
        - verify corresponding remote branch heads
        - recommend whether PR #5 or PR #4 should be considered first
      excludes:
        - ready-for-review transition
        - PR edit, close, merge, or Issue mutation
        - push, force-push, branch deletion, rebase, reset, or source edits
    owned_paths:
      - changes/M123-pr-ready-review-governance/
    dependencies: []
    unlocks:
      - C002
      - C004
      - C005
    risk: medium
    size: small
    validation:
      - git status --short --branch
      - gh pr view 5 --repo tiic-tech/openworkflow --json number,url,state,isDraft,title,headRefName,baseRefName,headRefOid,baseRefOid,mergeable,reviewDecision,statusCheckRollup
      - gh pr view 4 --repo tiic-tech/openworkflow --json number,url,state,isDraft,title,headRefName,baseRefName,headRefOid,baseRefOid,mergeable,reviewDecision,statusCheckRollup
      - git ls-remote --heads origin codex/m117-git-automation-remote-readiness codex/m102-selected-change-commit-gate
      - git diff --check
    acceptance:
      - A durable preflight packet names current PR state and readiness facts for PR #5 and PR #4.
      - The packet recommends the first ready-for-review target or explains why neither is ready.
      - No remote or destructive git mutation occurs.
  - id: C002
    status: candidate
    title: Prepare exact PR #5 ready-for-review decision
    purpose: >
      Convert C001 facts into an exact high-risk approval packet for marking PR #5 ready for review.
    scope:
      includes:
        - state exact ready command for PR #5
        - record current draft state, head/base refs, mergeability, status checks, and rollback guidance
        - require exact user approval before any PR mutation
      excludes:
        - executing ready-for-review
        - changing PR #4
        - merge, PR edit, PR close, or Issue mutation
    owned_paths:
      - changes/M123-pr-ready-review-governance/
      - changes/M123-pr-ready-review-governance/HIGH_RISK_DECISION_REPORT.md
    dependencies:
      - C001
    unlocks:
      - C003
      - C005
    risk: high
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The decision packet names exactly one PR #5 ready-for-review command.
      - The packet states that it is evidence, not approval.
      - The packet blocks execution until exact user approval is received.
  - id: C003
    status: candidate
    title: Execute approved PR #5 ready-for-review transition
    purpose: >
      After C002 exists and the user approves the exact command, mark PR #5 ready for review and
      record local audit evidence.
    scope:
      includes:
        - verify exact approval text for PR #5
        - verify PR #5 is still open and draft immediately before mutation
        - execute one approved ready-for-review transition for PR #5
        - record resulting PR state and rollback guidance
      excludes:
        - PR #4 transition
        - merge, PR edit, PR close, or Issue mutation
    owned_paths:
      - changes/M123-pr-ready-review-governance/
    dependencies:
      - C002
    unlocks:
      - C005
    risk: high
    size: small
    validation:
      - gh pr view 5 --repo tiic-tech/openworkflow --json number,url,state,isDraft,title,headRefName,baseRefName,headRefOid,baseRefOid
      - git diff --check
    acceptance:
      - PR #5 is no longer draft and remains open.
      - Local audit evidence records approval, command, result, and rollback guidance.
      - No merge, PR edit, PR close, Issue mutation, or unrelated remote mutation occurs.
  - id: C004
    status: candidate
    title: Prepare PR #4 ready-for-review decision
    purpose: >
      Decide whether PR #4 should be handled in this queue after PR #5, or deferred to a separate
      M102-specific readiness queue.
    scope:
      includes:
        - inspect current PR #4 state and readiness facts
        - prepare or update a high-risk stop packet for PR #4 if it should proceed here
        - record deferral if PR #4 needs separate governance
      excludes:
        - executing ready-for-review for PR #4 without exact approval
        - merge, PR edit, PR close, or Issue mutation
    owned_paths:
      - changes/M123-pr-ready-review-governance/
    dependencies:
      - C001
    unlocks:
      - C005
    risk: high
    size: small
    validation:
      - gh pr view 4 --repo tiic-tech/openworkflow --json number,url,state,isDraft,title,headRefName,baseRefName,headRefOid,baseRefOid,mergeable,reviewDecision,statusCheckRollup
      - git diff --check
    acceptance:
      - PR #4 is either prepared for an exact approval gate or explicitly deferred.
      - No PR #4 mutation occurs without separate exact approval.
  - id: C005
    status: candidate
    title: Record PR readiness governance audit and handoff
    purpose: >
      Close M123 with local audit evidence naming which PRs were transitioned, which remained draft,
      and which later queue owns remaining publication governance.
    scope:
      includes:
        - summarize completed ready-for-review transitions or stop reasons
        - update M123 summary and readable view
        - record deferred next queues for M71 and shared M101-derived branches
        - confirm no unauthorized PR, Issue, merge, or destructive git operations occurred
      excludes:
        - merge
        - Issue mutation
        - publishing M71 or shared M101-derived branches
        - changing product source
    owned_paths:
      - changes/M123-pr-ready-review-governance/
    dependencies:
      - C001
    unlocks:
      - M122-m71-historical-stack-publication
      - M124-shared-branch-publication-strategy
    risk: medium
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - A local audit names each authorized and unauthorized operation boundary.
      - Remaining draft PRs and next governance queues are explicit.
      - M123 can be handed off without raw session context.
