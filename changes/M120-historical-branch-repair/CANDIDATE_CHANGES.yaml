queue_policy:
  branch_boundary: codex/m120-historical-branch-repair
  branch_note: >
    Proposed by DTC while the repository was on codex/m119-approved-remote-pr-publication after
    local commit 27a267a. The local branch was later created with git-automation before selecting
    C001.
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  selected_change_commit_gate: strict
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select C001 first. M120 must produce a read-only branch ownership inventory before any local
    branch repair, PR-ready summary regeneration, or high-risk history operation can be considered.
  high_risk_rule: >
    Any rebase, reset, cherry-pick sequence that rewrites branch meaning, force-push, remote branch
    deletion, PR edit, merge, or ready-for-review transition is high risk and requires a dedicated
    HIGH_RISK_DECISION_REPORT.md plus exact operation-level user approval before execution.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Historical local branch and PR-ready evidence repair after the M102 remote publication pilot.
  boundary_type: git_branch_governance_workflow_slice
  in_scope_rule: >
    Include read-only branch ownership inventory, repair policy, branch-local PR-ready summary
    restoration, publication ordering, and high-risk decision gates for branch pointer changes.
  out_of_scope_rule: >
    Do not push, create or edit PRs, mutate Issues, merge, release, force-push, delete remote
    branches, or rewrite historical commits during DTC queue creation. Product feature work remains
    outside this queue unless needed solely to repair branch/PR evidence.
  deferred_features:
    - title: Publish the repaired M117 branch
      reason: >
        M117 is the best next publication candidate after repair, but push and draft PR creation are
        remote mutations that need a fresh approval-gated publication queue.
      suggested_plan_id: M121-m117-remote-publication
    - title: Mark PR #4 ready for review
      reason: >
        Ready-for-review is a GitHub PR state mutation and should only happen after branch-stack
        review and exact approval.
      suggested_plan_id: M122-pr4-ready-review-governance
