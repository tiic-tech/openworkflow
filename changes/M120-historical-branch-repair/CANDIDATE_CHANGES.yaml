next_recommended_candidate_id: C002
changes:
  - id: C001
    status: done
    title: Inventory historical branch ownership and PR-ready evidence
    purpose: >
      Build a read-only inventory that maps local branches, remote branches, queue branch boundaries,
      PR-ready summaries, existing PRs, and known blockers into one repair baseline.
    scope:
      includes:
        - list local codex branches and remote codex branches
        - map PR_READY_SUMMARY.md artifacts to their recorded branch boundaries
        - identify queues whose summaries are not present on their owning branches
        - identify queues that share a historical branch boundary
        - record existing PRs and their head/base relationships
      excludes:
        - branch creation or deletion
        - checkout-based repair
        - cherry-pick, rebase, reset, force-push, or remote mutation
        - PR creation, edit, close, merge, or ready-for-review transition
    owned_paths:
      - changes/M120-historical-branch-repair/
    dependencies:
      []
    unlocks:
      - C002
      - C003
      - C004
    risk: medium
    size: small
    validation:
      - git status --short --branch
      - git branch --list 'codex/m*' --format='%(refname:short)'
      - git ls-remote --heads origin 'codex/*'
      - gh pr list --repo tiic-tech/openworkflow --state all --json number,url,state,isDraft,title,headRefName,baseRefName --limit 50
      - find changes -maxdepth 2 -name PR_READY_SUMMARY.md
      - git diff --check
    acceptance:
      - A durable inventory names every currently known publication candidate and blocker.
      - Shared or mismatched branch boundaries are called out explicitly.
      - No branch pointer, remote, PR, or Issue state is mutated.
    selection:
      selected_change_id: M120-C001-inventory-historical-branch-ownership
      selected_at: 2026-05-23
      reason: >
        Selected first because M120 needs a read-only branch ownership and PR-ready evidence
        baseline before repair policy, evidence restoration, or high-risk history surgery.
      artifacts:
        selected_change: changes/M120-historical-branch-repair/C001-inventory-historical-branch-ownership/SELECTED_CHANGE.yaml
        atom_tasks: changes/M120-historical-branch-repair/C001-inventory-historical-branch-ownership/ATOM_TASKS.yaml
        implementation_brief: changes/M120-historical-branch-repair/C001-inventory-historical-branch-ownership/IMPLEMENTATION_BRIEF.md
    completion:
      completed_at: 2026-05-23
      implementation_changed_files: false
      commit_not_required_reason: >
        C001 produced local planning inventory evidence only. It did not change product source,
        generated surfaces, runtime behavior, branch pointers, remote refs, PR state, or Issues.
      evidence:
        - changes/M120-historical-branch-repair/C001-inventory-historical-branch-ownership/INVENTORY.md
      validation:
        - git status --short --branch
        - git branch --list 'codex/m*' --format='%(refname:short)'
        - git ls-remote --heads origin 'codex/*'
        - gh pr list --repo tiic-tech/openworkflow --state all --json number,url,state,isDraft,title,headRefName,baseRefName --limit 50
        - find changes -maxdepth 2 -name PR_READY_SUMMARY.md
        - branch-local PR_READY_SUMMARY.md presence checks with git cat-file -e
        - git diff --check
  - id: C002
    status: candidate
    title: Decide historical branch repair policy and stop boundaries
    purpose: >
      Convert the C001 inventory into a repair policy that distinguishes acceptable stacked review
      branches from branches that need local evidence restoration or high-risk history surgery.
    scope:
      includes:
        - define criteria for accepting a stacked branch as intentional
        - define criteria for requiring a new independent branch boundary
        - define when branch-local PR-ready summaries are sufficient repair
        - define when a high-risk decision report is required before branch pointer changes
      excludes:
        - executing branch repair
        - moving commits between branches
        - remote mutation
    owned_paths:
      - changes/M120-historical-branch-repair/
      - references/git-version-control-governance.md
      - references/gh-operation-governance.md
    dependencies:
      - C001
    unlocks:
      - C003
      - C004
      - C005
    risk: medium
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The repair policy separates low-risk evidence repair from high-risk history rewriting.
      - The policy states when stacked branches may remain coupled.
      - Remote publication remains approval-gated and out of scope.
  - id: C003
    status: candidate
    title: Restore branch-local PR-ready evidence for low-risk candidates
    purpose: >
      For candidates that do not require history rewriting, ensure the owning local branch contains
      the matching PR_READY_SUMMARY.md and enough queue evidence for future remote-plan checks.
    scope:
      includes:
        - identify low-risk branch-local summary restoration targets
        - regenerate or copy PR_READY_SUMMARY.md through git-automation summary when appropriate
        - record before/after branch and file evidence
        - keep each restoration scoped to its owning branch
      excludes:
        - publishing restored branches
        - creating PRs
        - rewriting commit history
        - repairing branches classified as high risk by C002
    owned_paths:
      - changes/*/PR_READY_SUMMARY.md
      - changes/M120-historical-branch-repair/
    dependencies:
      - C001
      - C002
    unlocks:
      - C005
      - C006
    risk: medium
    size: medium
    validation:
      - node dist/cli/src/index.js git-automation summary --root . --queue <queue> --json
      - node dist/cli/src/index.js git-automation remote-plan --root . --queue <queue> --base origin/main --remote origin --target-base main --json
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Each repaired branch has a branch-local PR_READY_SUMMARY.md or a recorded blocker.
      - No branch pointer rewrite or remote mutation occurs.
      - Future publication candidates have explicit remaining blockers.
  - id: C004
    status: candidate
    title: Prepare high-risk decision report for history surgery if needed
    purpose: >
      If C001/C002 show that branch pointer changes are required, create the high-risk report that
      names exact options, risks, commands, rollback limits, and approval text before any surgery.
    scope:
      includes:
        - identify candidate branches that would require cherry-pick, rebase, reset, or deletion
        - record decision options such as defer, evidence-only repair, new branch from main, or
          explicit history surgery
        - name exact commands that remain unapproved
        - define stop criteria and validation expectations
      excludes:
        - executing cherry-pick, rebase, reset, force-push, branch deletion, or remote mutation
        - selecting a surgery option without user approval
    owned_paths:
      - changes/M120-historical-branch-repair/HIGH_RISK_DECISION_REPORT.md
      - changes/M120-historical-branch-repair/
    dependencies:
      - C001
      - C002
    unlocks:
      - C005
    risk: high
    size: small
    approval_required: true
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The report exists if any branch repair requires history surgery.
      - The report does not execute or approve destructive or remote commands.
      - Exact operation-level approval remains required for any high-risk command.
  - id: C005
    status: candidate
    title: Produce repaired publication order and remote readiness plan
    purpose: >
      Turn the repaired branch inventory into a publication order that separates ready candidates,
      candidates needing fresh summaries, and candidates needing high-risk repair.
    scope:
      includes:
        - rank M117, M71, and any repaired M101-derived queues for publication readiness
        - record remote-plan blockers for each candidate
        - recommend the next approval-gated publication queue
        - define stop conditions for PR #4 ready-for-review and merge decisions
      excludes:
        - pushing branches
        - creating, editing, closing, marking ready, or merging PRs
        - mutating Issues
    owned_paths:
      - changes/M120-historical-branch-repair/
    dependencies:
      - C001
      - C002
      - C003
    unlocks:
      - M121-m117-remote-publication
    risk: medium
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
      - gh pr view https://github.com/tiic-tech/openworkflow/pull/4 --json url,state,isDraft,baseRefName,headRefName,title,number
    acceptance:
      - The next publication recommendation is explicit and evidence-backed.
      - Remaining blockers are separated by candidate branch.
      - No remote mutation is implied as approved.
