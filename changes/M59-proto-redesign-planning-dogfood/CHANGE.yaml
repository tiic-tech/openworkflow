summary: >
  Use the new decompose-to-changes and select-change source skills to create
  the formal /ow:proto redesign implementation queue and select the first
  bounded change without implementing it.
problem: >
  The proto redesign has enough strategic material to proceed, but it needs a
  durable candidate queue and one selected implementation entry so future work
  stays focused and does not mix image-first prompt contracts, validation
  semantics, source skill behavior, tuning behavior, and runtime exposure.
goals:
  - Generate a formal `/ow:proto` redesign candidate queue.
  - Select the first proto redesign implementation change.
  - Create atom tasks and an implementation brief for the selected change.
  - Keep the work as planning dogfood, not implementation.
non_goals:
  - Do not implement the proto redesign.
  - Do not add `/ow:proto2html`.
  - Do not remove or internalize validation command behavior.
  - Do not expose runtime command or adapter surfaces.
affected_paths:
