      Define the artifact vocabulary for image-first `/ow:proto`: strategic
      prototype prompt packs, screen-bound tune prompt packs, validation input
      policy, review evidence, and explicit boundaries before source behavior
      changes begin.
    scope:
      includes:
        - vision-to-strategic-prototype prompt pack contract
        - prototype tune/refined prompt pack contract
        - optional validation artifact consumption rules
        - review evidence and decision handoff rules
        - explicit non-goals for HTML generation and runtime exposure
      excludes:
        - source skill implementation
        - command registry exposure
        - generated Codex adapter surfaces
        - removing ow:validation
        - implementing /ow:proto2html
    owned_paths:
      - references/proto-redesign-artifact-contracts.md
      - schemas/proto-prompt-pack.schema.json
      - changes/M60-proto-redesign-artifact-contracts/
    dependencies: []
    unlocks:
      - P002
      - P003
      - P004
    risk: medium
    size: medium
    validation:
      - npm run validate
    acceptance:
      - Image-first proto artifacts define required and optional inputs.
      - Validation artifact consumption is explicit when present or absent.
      - Tune/refinement prompt packs preserve baseline prototype intent.
      - HTML conversion and runtime exposure are excluded.
    selection:
      selected_change_id: M60-proto-redesign-artifact-contracts
