  id_policy: Stable P-prefixed ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - clarifies artifact contracts before source behavior
    - keeps validation consumption explicit
    - separates first-pass prototype generation from tuning
    - avoids runtime exposure before source behavior is proven
    - focused owned paths
  avoid:
    - implementing generated adapter surfaces directly
    - mixing prompt contract design with CLI runtime changes
    - treating validation removal as an implicit side effect
    - adding HTML conversion to the proto redesign scope
next_recommended_candidate_id: null
