queue_policy:
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable S-prefixed ids are assigned once and referenced by select-change.
  feat_boundary: This CANDIDATE_CHANGES queue is the top-level feat; each candidate is a commit-sized change inside this folder.
  selected_artifact_location: changes/M69-skill-system-lifecycle-planning/<candidate-id>-<slug>/
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - source contracts before runtime generation changes
    - static skill format contract before platform adapter expansion
    - validator and drift evidence for every generated-surface change
    - repo-local reproducibility over global prompt installation
    - agent-readable XML-like protocol blocks for OpenWorkflow trust boundaries
  avoid:
    - copying OpenSpec's lightweight Markdown-only skill format wholesale
    - moving Codex command exposure to global prompts
    - editing generated .agents or .openworkflow surfaces directly
    - mixing skill lifecycle architecture with proto2html runtime exposure
    - broad multi-platform adapter work before the format contract is stable
next_recommended_candidate_id: S006
changes:
  - id: S001
    status: done
    title: Document native skill format and lifecycle contract
    purpose: >
      Define OpenWorkflow's first-class skill system contract after the
      OpenSpec research, including source-of-truth ownership, static skill
      file shape, XML-like protocol block semantics, generated-surface rules,
      and non-goals.
    scope:
      includes:
        - native skill format reference
        - frontmatter field policy including generated metadata
        - XML-like block taxonomy for user behavior, agent protocol, context, outputs, audit, and handoff
        - source registry to generated skill lifecycle narrative
        - explicit divergence from OpenSpec global Codex prompt installation
      excludes:
        - runtime generator implementation changes
        - new platform adapters
        - proto2html command exposure
        - changing existing generated skill files
    owned_paths:
      - references/skill-system-lifecycle.md
      - references/planning-artifact-contracts.md
      - changes/M69-skill-system-lifecycle-planning/S001-skill-lifecycle-contract/
    dependencies: []
    unlocks:
      - S002
      - S003
      - S004
      - S006
    risk: medium
    size: small
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - The reference states that OW skills are YAML frontmatter plus Markdown plus XML-like protocol blocks, not full XML documents.
      - The reference names source registries and generated surfaces and forbids direct generated-surface edits.
      - The reference explains what OW borrows from OpenSpec and what it rejects.
      - The contract is usable as read-first context for later generator and validator work.
    selection:
      selected_change_id: S001-skill-lifecycle-contract
      reason: >
        Cross-queue selection compared M68/H003 and M69/S001. S001 is the
        safer next step because it creates the native skill lifecycle contract
        needed before more high-risk runtime and generated-surface changes.
      selected_at: 2026-05-21
    completion:
      completed_by_change_id: S001-skill-lifecycle-contract
      completed_at: 2026-05-21
      evidence:
        - references/skill-system-lifecycle.md
        - references/planning-artifact-contracts.md
        - changes/M69-skill-system-lifecycle-planning/S001-skill-lifecycle-contract/SELECTED_CHANGE.yaml
        - changes/M69-skill-system-lifecycle-planning/S001-skill-lifecycle-contract/ATOM_TASKS.yaml
        - "validation: npm run validate"
        - "validation: git diff --check"
  - id: S002
    status: done
    title: Add structured generated metadata to Codex skill output
    purpose: >
      Make generated skill files self-identifying through structured
      frontmatter metadata so doctor, sync, and tests can detect stale or
      mismatched skill surfaces without relying only on comments.
    scope:
      includes:
        - generatedBy or generated_by metadata in runtime skill frontmatter
        - template id and adapter version metadata policy
        - source command id and semantic trigger metadata
        - generated skill fixture or snapshot expectations
      excludes:
        - multi-platform adapter support
        - changing command semantics
        - manual edits to existing generated files outside sync
    owned_paths:
      - packages/adapters/codex/src/constants.ts
      - packages/adapters/codex/src/generateSkills.ts
      - packages/adapters/codex/src/generatedFiles.ts
      - packages/adapters/codex/src/manifest.ts
      - packages/adapters/codex/src/templates.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - .agents/skills/
      - changes/M69-skill-system-lifecycle-planning/S002-generated-skill-metadata/
    dependencies:
      - S001
    unlocks:
      - S004
      - S005
    risk: medium
    size: medium
    validation:
      - npm run validate
      - npm run verify:runtime-surface
      - git diff --check
    acceptance:
      - Generated Codex skills include structured metadata that identifies generator, adapter, template, and command.
      - Runtime verification checks the metadata on generated skill surfaces.
      - Generated files are refreshed through sync rather than direct edits.
      - Existing semantic command invocation remains unchanged.
    selection:
      selected_change_id: S002-generated-skill-metadata
      reason: S001 completed the skill lifecycle contract, so generated metadata can be added before validation hardening.
      selected_at: 2026-05-21
    completion:
      completed_by_change_id: S002-generated-skill-metadata
      completed_at: 2026-05-21
      evidence:
        - packages/adapters/codex/src/constants.ts
        - packages/adapters/codex/src/generateSkills.ts
        - packages/adapters/codex/src/manifest.ts
        - packages/adapters/codex/src/generatedFiles.ts
        - packages/adapters/codex/src/templates.ts
        - packages/cli/src/dev/verifyRuntimeSurface.ts
        - .agents/skills/ow-proto/SKILL.md
        - .agents/openworkflow-adapter.yaml
        - "validation: npm run validate"
        - "validation: npm run verify:runtime-surface"
        - "validation: git diff --check"
  - id: S003
    status: candidate
    title: Introduce skill registry and adapter delivery model
    purpose: >
      Separate "which OW workflows exist" from "how they are delivered" so
      future tools can install skills, commands, or both without baking Codex
      assumptions into the core workflow registry.
    scope:
      includes:
        - skill registry or delivery metadata layer
        - adapter capability model for skills versus commands
        - repo-local delivery policy
        - compatibility mapping for existing Codex generated surfaces
      excludes:
        - implementing non-Codex adapters
        - changing artifact contracts
        - global user-home prompt installation
        - selecting profile subsets
    owned_paths:
      - packages/core/src/commands/registry.ts
      - packages/adapters/codex/src/
      - packages/core/src/workflow/syncOpenWorkflow.ts
      - packages/core/src/workflow/initOpenWorkflow.ts
      - references/skill-system-lifecycle.md
      - changes/M69-skill-system-lifecycle-planning/S003-skill-registry-delivery-model/
    dependencies:
      - S001
    unlocks:
      - S007
    risk: high
    size: large
    validation:
      - npm run validate
      - npm run verify:runtime-surface
      - npm run verify:e2e-workflow
      - git diff --check
    acceptance:
      - Core workflow definitions remain semantic and do not hardcode one agent platform's path rules.
      - Codex remains repo-local and backward compatible.
      - Delivery metadata can express skill-only, command-only, or both without changing individual workflow semantics.
      - The change does not create non-Codex generated surfaces yet.
  - id: S004
    status: done
    title: Validate generated skill format and protocol blocks
    purpose: >
      Add automated checks that generated OW skills conform to the native skill
      format contract, including frontmatter, generated metadata, required
      XML-like protocol blocks, and forbidden malformed top-level XML wrappers.
    scope:
      includes:
        - generated SKILL.md frontmatter validation
        - required protocol block presence checks
        - block ordering or uniqueness checks where useful
        - malformed wrapper and missing metadata diagnostics
      excludes:
        - artifact schema validation changes unrelated to skill files
        - source skill quick validation for root skills/
        - new adapter delivery model
    owned_paths:
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/adapters/codex/src/generateSkills.ts
      - changes/M69-skill-system-lifecycle-planning/S004-skill-format-validation/
    dependencies:
      - S001
      - S002
    unlocks:
      - S005
    risk: medium
    size: medium
    validation:
      - npm run validate
      - npm run verify:runtime-surface
      - git diff --check
    acceptance:
      - Validation fails when a generated OW skill lacks required frontmatter or protocol blocks.
      - Validation keeps generated skill files as Markdown skill files, not full XML documents.
      - Diagnostics explain whether to update source registry or run sync.
      - Existing generated skills pass after sync.
    selection:
      selected_change_id: S004-skill-format-validation
      reason: >
        S001 defined the native skill format contract and S002 added generated
        metadata, so validation can now enforce the generated Codex skill
        surface without changing command semantics.
      selected_at: 2026-05-21
    completion:
