        - "validation: npm run verify:runtime-surface"
        - "validation: git diff --check"
  - id: S005
    status: done
    title: Add generated-surface drift and parity tests
    purpose: >
      Detect when command registry, artifact contracts, generated skill files,
      audit indexes, and adapter manifests drift apart, using an OpenSpec-style
      generatedBy and parity testing approach adapted to OW.
    scope:
      includes:
        - generated skill parity checks
        - audit index parity checks
        - stale generated-surface diagnostics
        - clean sync verification coverage
      excludes:
        - adding new workflow commands
        - changing skill protocol contents
        - multi-platform adapter expansion
    owned_paths:
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/cli/src/dev/verifyAgentE2E.ts
      - packages/adapters/codex/src/manifest.ts
      - packages/adapters/codex/src/generatedFiles.ts
      - .openworkflow/audit/
      - .agents/skills/
      - changes/M69-skill-system-lifecycle-planning/S005-generated-surface-drift-tests/
    dependencies:
      - S002
      - S004
    unlocks: []
    risk: medium
    size: medium
    validation:
      - npm run validate
      - npm run verify:runtime-surface
      - npm run verify:agent-e2e
      - git diff --check
    acceptance:
      - Verification catches stale generated skill metadata or missing generated skill files.
      - Verification catches registry entries missing from adapter manifest or audit indexes.
      - The checks tell agents to update source and run sync, not hand-edit generated files.
      - Current generated surfaces pass after regeneration.
    selection:
      selected_change_id: S005-generated-surface-drift-tests
      reason: >
        S004 made generated skill shape a repository contract; S005 should now
        enforce parity across registry, audit indexes, Codex manifest, and
        generated file lists before higher-risk delivery model work.
      selected_at: 2026-05-21
    completion:
      completed_by_change_id: S005-generated-surface-drift-tests
      completed_at: 2026-05-21
      evidence:
        - packages/core/src/validators/validateRepositoryContracts.ts
        - packages/cli/src/dev/verifyRuntimeSurface.ts
        - changes/M69-skill-system-lifecycle-planning/S005-generated-surface-drift-tests/SELECTED_CHANGE.yaml
        - changes/M69-skill-system-lifecycle-planning/S005-generated-surface-drift-tests/ATOM_TASKS.yaml
        - "validation: npm run validate"
        - "validation: npm run verify:runtime-surface"
        - "validation: git diff --check"
  - id: S006
    status: ready
    title: Design dynamic instruction envelope model
    purpose: >
      Decide whether OW should add an OpenSpec-like dynamic instruction output
      layer for selected artifacts while keeping static runtime skills focused
      on command protocol and context boundaries.
    scope:
      includes:
        - comparison between static skill protocol blocks and dynamic artifact instruction envelopes
        - candidate envelope tags such as task, context, rules, dependencies, output, template, and success criteria
        - boundaries for avoiding protocol leakage into produced artifacts
        - decision on whether this belongs in CLI commands, summaries, or skills
      excludes:
        - implementing a new CLI instruction command
        - changing existing runtime skill generation
        - changing artifact schemas
    owned_paths:
      - references/skill-system-lifecycle.md
      - references/artifact-instruction-envelope.md
      - changes/M69-skill-system-lifecycle-planning/S006-dynamic-instruction-envelope/
    dependencies:
      - S001
    unlocks:
      - S007
    risk: medium
    size: small
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - The design clearly separates static skill protocol from dynamic per-artifact instruction output.
      - The design states when XML-like envelope tags are useful and when Markdown or YAML is better.
      - The design includes leakage prevention rules for generated artifacts.
      - The design does not implement a new runtime command.
  - id: S007
    status: candidate
    title: Prototype multi-adapter skill delivery without changing runtime semantics
    purpose: >
      Spike a narrow adapter abstraction that can render the same OW skill
      contract for another local agent skill directory while preserving the
      current Codex behavior and avoiding global installation.
    scope:
      includes:
        - one experimental adapter boundary
        - path and frontmatter policy for a second local skill target
        - dry-run or verification-only output plan
        - risk report for platform-specific behavior
      excludes:
        - publishing non-Codex generated files by default
        - changing user-facing `/ow:*` command semantics
        - global prompt installation
        - broad profile UI
    owned_paths:
      - packages/adapters/
      - packages/cli/src/dev/
      - references/skill-system-lifecycle.md
      - changes/M69-skill-system-lifecycle-planning/S007-multi-adapter-skill-delivery-spike/
    dependencies:
      - S003
      - S006
    unlocks: []
    risk: high
    size: large
    validation:
      - npm run validate
      - npm run verify:runtime-surface
      - git diff --check
    acceptance:
      - The spike proves adapter boundaries without changing Codex output semantics.
      - No new generated platform surface is committed unless explicitly accepted.
      - The result identifies what must be formalized before multi-platform support becomes product behavior.
