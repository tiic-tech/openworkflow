        - packages/cli/src/dev/verifyRuntimeSurface.ts
        - changes/M69-skill-system-lifecycle-planning/S004-skill-format-validation/SELECTED_CHANGE.yaml
        - changes/M69-skill-system-lifecycle-planning/S004-skill-format-validation/ATOM_TASKS.yaml
