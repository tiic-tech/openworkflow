    level: medium
    description: Renaming too early could disrupt active dogfood work and resume trust gates.
    mitigation: Start with a compatibility contract and defer source/package rename until M106 reaches a stable checkpoint.
  - id: R002
    level: high
    description: npm, CLI, generated adapter, or repository rename could break existing users and generated surfaces.
    mitigation: Keep OpenWorkflow aliases, run sync/doctor/runtime verification, and gate public publication separately.
  - id: R003
    level: high
    description: Future R backend architecture could blur the current coding kit scope.
    mitigation: Keep R backend design deferred to a dedicated product/runtime queue.
