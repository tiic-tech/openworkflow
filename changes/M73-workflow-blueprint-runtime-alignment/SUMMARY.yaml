scope_boundary:
  current_boundary: Workflow command taxonomy and stage graph only.
  boundary_type: workflow_slice
  note: >
    M73 remains one workflow-slice queue. C001 was split into C011-C014 so the
    taxonomy work can proceed in focused implementation-sized steps.
