key_dependencies:
  - M54 completed DTC/AC/SC as Codex-delivered planning commands.
  - C013 clarified that DTC/AC/SC belong inside /ow:change, not as the full OW workflow.
  - OW_DEVELOP_PLAN defines the intended chain from vision through archive plus advanced build-agent, build-skill, and async review surfaces.
  - C011 should happen first because command family taxonomy unlocks the stage graph and change-loop placement.
  - After M73, the next DTC queue should re-review vision, validation, proto, and tune command quality before proto2html or downstream implementation stages.
risks:
  - id: R001
    level: medium
    description: A taxonomy queue could drift into a full workflow roadmap if deferred features are treated as active candidates.
    mitigation: Keep M73 limited to C011-C014 and require separate DTC passes for deferred feature refs.
  - id: R002
    level: medium
    description: Historical C001 selection artifacts could be mistaken for the next implementation boundary after the split.
    mitigation: Treat C001 as superseded and run AC/SC against C011-C014 before implementation.
  - id: R003
    level: high
    description: Implementing proto2html, html2spec, build, review, archive, build-agent, or build-skill before command taxonomy is stable could recreate runtime authority drift.
    mitigation: Keep those surfaces as deferred feature refs until later DTC queues and high-risk approval where needed.
  - id: R004
    level: medium
    description: Downstream implementation quality can degrade if existing vision, validation, proto, and tune commands are assumed complete without reassessment under the expanded workflow.
    mitigation: Make front-chain command quality review the first deferred feature after M73.
unresolved_questions:
  - Should /ow:archive be user-facing, internal, or both depending on loop mode?
  - Should /ow:review be represented as a command surface, a runtime service, or both?
validation:
  commands_run:
    - git status --short --branch
  notes:
    - OP001 created the initial broad M73 workflow blueprint runtime alignment candidate queue.
    - OP002 selected C001 from the queue after AC recommended it as the safest first step.
    - OP003 narrowed M73 to C001 and converted C002-C010 into deferred feature refs.
    - OP004 split C001 into C011-C014 and marked C001 superseded.
    - OP005 updated C014 so front-chain command quality review precedes proto2html in the deferred handoff map.
    - OP006 selected C011 after AC recommended it as the next low-risk candidate.
    - OP007 completed C011 with local commit evidence.
    - OP008 selected C012 after AC recommended it as the next low-risk candidate.
    - OP009 completed C012 with local commit evidence.
    - OP010 selected C013 directly with SC because M73 is the single active queue.
