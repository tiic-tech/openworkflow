title: Align summarize output shape with validate expectations
status: done
selected_at: 2026-05-23
selection_reason: >
  C001 is the dependency-free, smallest direct M104 bugfix. The target-repo
  audit proved summarize --write can generate a SUMMARY.yaml shape that the
  same CLI's validate command rejects, so writer output and validator
  expectations must be aligned before broader trust-gate work.
risk_decision:
  risk: medium
  selected_option: Fix writer output to match existing validation-compatible summary shape.
scope:
  includes:
    - locate the artifact summary writer
    - emit validation-compatible contract keys for SUMMARY.yaml files
    - add regression coverage for summarize --write followed by validate
    - preserve summary freshness and strict source-artifact validation
  excludes:
    - broad summary schema redesign
    - weakening validation for real source artifacts
    - prompt2proto image evidence strategy changes
    - current vision pointer fixes
    - commit evidence auto-backfill
owned_paths:
  - packages/core/src/
  - packages/cli/src/
  - packages/cli/src/dev/verifyRuntimeSurface.ts
