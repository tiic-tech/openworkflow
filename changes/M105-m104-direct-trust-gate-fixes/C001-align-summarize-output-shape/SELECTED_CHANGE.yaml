  - changes/M102-selected-change-commit-gate/**
acceptance:
  - summarize --write emits summary files with validation-compatible contract keys.
  - validate no longer rejects summary files produced by summarize --write.
  - Regression coverage captures the M104 summarize/validate failure mode.
  - Existing source-artifact validation remains strict.
validation:
