acceptance:
  - git-automation commit with --commit-evidence links the evidence path into existing queue and selected-change completion evidence arrays when all Option A preconditions hold.
  - Backfill is skipped with precise warnings when required completion/status/path preconditions are not met.
  - The command does not create completion sections or change candidate status.
  - Runtime coverage captures the M104 missing-evidence repair loop.
validation:
