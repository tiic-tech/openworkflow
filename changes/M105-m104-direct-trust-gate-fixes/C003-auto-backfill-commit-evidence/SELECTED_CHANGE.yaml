selection_reason: >
  Selected after user approval of the high-risk Option A. M104 exposed a
  manual repair loop where LOCAL_COMMIT_EVIDENCE had to be pre-linked into
  completion records before strict summaries and handoff would pass, even
  though git-automation creates that evidence during the commit flow.
