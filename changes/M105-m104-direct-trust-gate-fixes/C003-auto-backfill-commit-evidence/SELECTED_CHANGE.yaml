  risk: high
  approved_option: Option A - Narrow Safe Backfill
  approval_source: user approval on 2026-05-23
  decision_report: changes/M105-m104-direct-trust-gate-fixes/HIGH_RISK_DECISION_REPORT.md
scope:
  includes:
    - add conservative completion evidence backfill to git-automation commit
    - require existing done/completion state before any queue mutation
    - emit explicit skip warnings for unmet backfill preconditions
    - cover the M104-style missing-evidence repair loop in runtime verification
  excludes:
    - creating completion sections automatically
    - changing candidate status automatically
    - weakening selected-change strict commit gate
