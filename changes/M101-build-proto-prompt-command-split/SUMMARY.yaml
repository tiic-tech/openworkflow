  kind: planning_discussion
  summary: >
    User proposed splitting build-prototype into build-proto-prompt and
    build-prototype so vision2prompt prompt-pack compilation and prototype
    artifact consumption have clearer responsibilities and more focused agents.
    The queue was expanded after the user clarified that build-prototype needs
    a new prompt2proto skill comparable to vision2prompt before it can become a
    narrowed consumer.
