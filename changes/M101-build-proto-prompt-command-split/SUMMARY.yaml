key_dependencies:
  - M100 C007 should complete first so the senior PM perspective engine is stable before command boundaries move.
  - M100 C003 should complete first so current generated vision2prompt guidance is strong before it is split into a new command surface.
  - M101 C001 is high risk and should not be selected without explicit approval of a concrete split option.
risks:
  - id: R001
    level: high
    description: >
      Splitting commands can break generated skill triggers, handoff ordering,
      context packets, runtime-surface assertions, and compatibility for
      existing /ow:proto usage.
    mitigation: Start with a high-risk decision report and migrate in bounded candidates after M100 completes.
  - id: R002
    level: medium
    description: >
      The split could distract from M100 prompt paragraph quality work.
    mitigation: Keep M101 unselected until M100 C007 and C003 are done.
unresolved_questions:
  - Should /ow:vision2prompt remain an internal command, become an alias of build-proto-prompt, or be replaced by /ow:build-proto-prompt?
  - Should user-facing /ow:proto orchestrate both commands, or should users explicitly run build-proto-prompt before build-prototype?
