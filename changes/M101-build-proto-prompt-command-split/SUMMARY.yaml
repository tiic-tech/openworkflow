key_dependencies:
  - M100 is complete.
  - C001 is complete; option 1 is approved as the internal split direction preserving /ow:proto as the user-facing orchestration surface.
  - C002 is complete; prompt2proto role engine, input contract, reference architecture, output evidence shape, and no-go boundaries are designed.
  - C004 is complete; source prompt2proto skill foundation exists under skills/prompt2proto using the user-requested skill_generator method.
  - C003 is complete; /ow:build-proto-prompt exists as an internal command while /ow:vision2prompt remains compatible for later migration.
  - C005 is complete; ready strategic prompt packs now require prototype_system_contract for technical multi-screen coherence.
  - C007 is complete; M101 has completed the approved internal split.
risks:
  - id: R001
    level: high
    description: >
      Splitting commands can break generated skill triggers, handoff ordering,
      context packets, runtime-surface assertions, and compatibility for
      existing /ow:proto usage.
    mitigation: Start with a high-risk decision report and migrate in bounded candidates.
  - id: R002
    level: high
    description: >
      build-prototype could become an empty consumer if prompt2proto is not
      designed and implemented with skill quality comparable to vision2prompt.
    mitigation: Add C002 and C004 before narrowing build-prototype.
  - id: R003
    level: medium
    description: >
      Multi-screen consistency and density calibration could be conflated.
    mitigation: Treat coherence as a build-proto-prompt technical contract and density calibration as a build-prototype design philosophy responsibility.
unresolved_questions:
  - Should /ow:vision2prompt remain an internal command, become an alias of build-proto-prompt, or be replaced by /ow:build-proto-prompt?
  - Should user-facing /ow:proto orchestrate both commands, or should users explicitly run build-proto-prompt before build-prototype?
  - What exact artifact names should prompt2proto emit before provider-backed generation or visual review exists?
