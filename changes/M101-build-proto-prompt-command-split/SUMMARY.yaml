    - changes/M100-dailin-grade-image-prompt-paragraphs/SUMMARY.yaml
scope_boundary: >
  One command-surface and skill-architecture split: build-proto-prompt owns
  vision/validation to prompt-pack compilation; build-prototype owns
  prompt2proto, consuming ready prompt-pack artifacts and translating them into
  visual prototype instructions, evidence, and review-ready outputs.
