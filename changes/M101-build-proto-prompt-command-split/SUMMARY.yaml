    - ruby -e 'require "yaml"; YAML.load_file("changes/M101-build-proto-prompt-command-split/CANDIDATE_CHANGES.yaml"); YAML.load_file("changes/M101-build-proto-prompt-command-split/SUMMARY.yaml")'
    - node dist/cli/src/index.js validate --root . --json
    - node dist/cli/src/index.js summaries --root . --strict --json
    - git diff --check
    - ruby -e 'require "yaml"; %w[changes/M101-build-proto-prompt-command-split/CANDIDATE_CHANGES.yaml changes/M101-build-proto-prompt-command-split/C001-decide-command-split-prompt2proto-skill-architecture-and-migration-guardrails/SELECTED_CHANGE.yaml changes/M101-build-proto-prompt-command-split/C001-decide-command-split-prompt2proto-skill-architecture-and-migration-guardrails/ATOM_TASKS.yaml].each { |p| YAML.load_file(p); puts "ok #{p}" }'
    - rg -n "prompt2proto|Chief PM|Principal UI|visual hierarchy|density|coherence" skills/prompt2proto skills/build-prototype
    - npm run build
    - node dist/cli/src/index.js sync --root . --json
    - npm run verify:runtime-surface
    - node dist/cli/src/index.js validate --root . --json
    - node dist/cli/src/index.js summaries --root . --strict --json
    - git diff --check
  notes:
    - Created originally on codex/m100-dailin-grade-image-prompt-paragraphs while M100 C007 work was in progress, per user request to record M101 before returning to M100.
    - Current implementation branch is codex/m101-build-proto-prompt-command-split.
    - M101 planning now treats prompt2proto skill design as a prerequisite for command split implementation.
    - C001 selected the design-only high-risk gate and approved option 1: preserve /ow:proto as the user-facing orchestration surface, introduce build-proto-prompt as the prompt-pack compiler stage, and narrow build-prototype only after prompt2proto is designed and founded.
    - C002 completed prompt2proto contract design before C004 source skill creation.
    - C004 created skills/prompt2proto with a lean SKILL.md, UI metadata, role engine, input contract, readiness checks, visual translation workflow, output contract, and quality rubric.
    - The user-requested skill_generator path /Users/archy/Documents/Codex/2026-05-22/files-mentioned-by-the-user-skill/skill_generator was used as the role-engine and reference-architecture method for C002/C004.
    - No command registry, generated adapter, .agents/**, or .openworkflow/** surface was changed by C004.
    - C003 added /ow:build-proto-prompt as an internal compiler command and generated ow-build-proto-prompt while preserving /ow:vision2prompt compatibility.
    - C003 deliberately did not narrow build-prototype or remove the legacy internal vision2prompt command; that remains for later migration candidates.
    - C005 added prototype_system_contract as a required ready prompt-pack coherence field and regenerated affected generated skills and audit packets from source.
    - C006 added the Chief PM plus Principal UI/UX philosophy engine, density calibration guidance, generated prompt2proto guidance, and runtime-surface assertions.
    - C007 completed the approved Option 1 split by preserving /ow:proto while narrowing build-prototype to prompt2proto consumption.
