schema_version: 0.1.0
contract_id: candidate_changes:M101-build-proto-prompt-command-split
contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M101-build-proto-prompt-command-split
title: Candidate changes for build-proto-prompt command split
status: active
source:
  kind: planning_discussion
  refs:
    - user_direction:2026-05-23-split-build-prototype-into-build-proto-prompt-and-build-prototype
    - user_direction:2026-05-23-prompt2proto-skill-must-be-designed-before-command-split
    - changes/M100-dailin-grade-image-prompt-paragraphs/SUMMARY.yaml
    - changes/M100-dailin-grade-image-prompt-paragraphs/CANDIDATE_CHANGES.yaml
    - changes/M100-dailin-grade-image-prompt-paragraphs/C006-record-no-go-criteria-for-future-visual-parity-work/HANDOFF_REPORT.md
  summary: >
    User proposed splitting the current build-prototype responsibility into
    build-proto-prompt, which executes the vision2prompt prompt-pack compiler,
    and build-prototype, which consumes ready build-proto-prompt artifacts. The
    follow-up clarification is that build-prototype cannot be an empty
    consumer: the current build-prototype skill embeds vision2prompt depth, but
    an equivalent prompt2proto skill does not yet exist. M101 must therefore
    design and build a prompt2proto skill with its own Chief PM plus Principal
    UI/UX philosophy engine before narrowing build-prototype.
queue_policy:
  branch_boundary: codex/m101-build-proto-prompt-command-split
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    M100 is complete, so select C001 first. C001 must approve the split option,
    prompt2proto skill architecture, migration guardrails, and stop criteria
    before any source skill or generated command surface changes.
  high_risk_rule: >
    Command boundary changes affect registry, generated skills, handoff order,
    managed audit packets, runtime verification, and existing /ow:proto
    semantics. Treat M101 as high risk and keep implementation split into
    design, prompt compiler, prompt2proto skill, and final migration candidates.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Split the prototype prompt compiler from the prototype consumer command
    surface: build-proto-prompt owns vision/validation to PROTO_PROMPT_PACK,
    while build-prototype owns prompt2proto: consuming ready prompt-pack
    artifacts and translating them into visual prototype instructions,
    evidence, and review-ready outputs.
  boundary_type: command_surface_plus_skill_architecture
  in_scope_rule: >
    Include command taxonomy, source skill split, prompt2proto skill design,
    generated adapter sync, managed context packets, artifact handoff
    contracts, runtime-surface verification, migration/deprecation behavior,
    multi-screen coherence contracts, and design-density philosophy needed for
    the split.
  out_of_scope_rule: >
    Do not change M100 prompt paragraph quality content, provider image
    generation implementation, human visual review, proto2html, or
    storyboard/motion modeling in this queue.
  deferred_features:
    - title: Provider-backed image quality benchmark
      reason: >
        Belongs after prompt text quality, prompt2proto skill design, and
        command split have stable boundaries.
      suggested_plan_id: M102-provider-image-generation-benchmark
    - title: Visual reference parity gate
      reason: >
        Visual parity requires generated images or rendered prototypes and a
        separate review method.
      suggested_plan_id: M103-prototype-visual-reference-parity-gate
next_recommended_candidate_id: C006
