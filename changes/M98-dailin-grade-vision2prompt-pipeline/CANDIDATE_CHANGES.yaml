schema_version: 0.1.0
contract_id: candidate_changes:M98-dailin-grade-vision2prompt-pipeline
contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M98-dailin-grade-vision2prompt-pipeline
title: Candidate changes for dailin-grade vision2prompt pipeline
status: active
source:
  kind: mixed
  refs:
    - user_direction:2026-05-22-approve-dailin-grade-vision2prompt-execution
    - latest_session_discussion:vision2prompt-vs-dailin-prompt-quality-gap
    - docs/M97_PRODUCT_REALITY_E2E_SYNTHESIS_REPORT.md
    - changes/M97-smart-city-product-reality-dogfood/SUMMARY.yaml
    - changes/M93-proto-product-archetype-reality-gate/SUMMARY.yaml
    - /Users/archy/Projects/StartUp/dailin/docs/DISTILLED_SKILLS/vision_to_strategic_prototype_prompt/SKILL.md
    - /Users/archy/Projects/StartUp/dailin/docs/OUTPUT_PROMPT.md
  summary: >
    M97 proved that the repaired chain can preserve smart city product topology,
    but the formal PROTO_PROMPT_PACK remains too thin and incomplete compared
    with the dailin reference prompt. This queue turns dailin's reference
    pipeline into an OW-native, schema-backed, validator-enforced
    /ow:vision2prompt prompt-pack system.
queue_policy:
  branch_boundary: codex/m98-dailin-grade-vision2prompt-pipeline
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select the first dependency-free candidate that most reduces downstream
    prompt-pack ambiguity. Do not select implementation work until the queue
    source files are validated.
  high_risk_rule: >
    If a candidate would change remote behavior, release publishing, generated
    adapter deletion, or broad workflow semantics beyond /ow:vision2prompt,
    stop and write HIGH_RISK_DECISION_REPORT.md before selection.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Upgrade /ow:vision2prompt prompt-pack generation from thin image prompts to
    dailin-grade, screen-bound product prototype prompt packs with deterministic
    source integrity and executability gates.
  boundary_type: workflow_slice
  in_scope_rule: >
    Include only strategic prompt-pack source contract, reference pipeline,
    generated /ow:vision2prompt protocol guidance, validators, fixtures, and a
    smart city replay needed to prove prompt-pack source quality.
  out_of_scope_rule: >
    Do not implement provider-backed image generation, automated visual review,
    proto2html, production GIS integration, or broad workflow redesign in this
    queue. Record those as deferred follow-up queues.
  deferred_features:
    - title: Visual quality and reference parity review gate
      reason: >
        M97 showed prototype images are product-structure evidence, not visual
        reference parity evidence. This needs a separate visual review artifact
        and likely browser/image inspection workflow.
      suggested_plan_id: M99-prototype-visual-reference-parity-gate
    - title: Storyboard and motion modeling for dashboard/video prototypes
      reason: >
        The dashboard reference is a state progression, not just a static
        screen set. This queue can add screen-bound prompt depth but should not
        own full storyboard or motion contracts.
      suggested_plan_id: M100-prototype-storyboard-motion-model
    - title: Reference-pattern ingestion from videos or image sets
      reason: >
        Pattern extraction from benchmark media should become a separate
        upstream artifact feeding validation and prompt generation.
      suggested_plan_id: M101-reference-pattern-ingestion
    - title: Provider-backed image generation benchmark
      reason: >
        Local deterministic SVG/PNG evidence is useful for contract testing but
        does not prove provider-backed generation quality.
      suggested_plan_id: M95-provider-image-generation-benchmark
    - title: Proto2html benchmark consumption
      reason: >
        Proto2html should consume an accepted benchmark after prompt-pack and
        visual-quality gates are trustworthy.
      suggested_plan_id: M91-proto2html-benchmark-input
next_recommended_candidate_id: C005
changes:
  - id: C001
    status: done
    title: Add prompt-pack integrity gate
    purpose: >
      Make PROTO_PROMPT_PACK.yaml the single trusted source for downstream
      generation by rejecting direction-count drift, missing prompt refs, and
      evidence that references absent or incomplete directions.
    scope:
      includes:
        - prompt_pack_integrity_gate contract fields for strategic prompt packs
        - JSON schema coverage for integrity gate status, dimensions, failures, and repair route
        - validator checks for direction_count_policy.resolved_count versus directions length
        - validator checks that prompt_text_manifest refs resolve to existing direction and screen prompt ids
        - validator checks that image_generation generated_images source refs point to existing prompts when generation has started
        - summary or handoff health exposure for integrity failures when current prototype artifacts are invalid
      excludes:
        - dailin reference pipeline migration
        - broad screen manifest schema expansion
        - provider image generation
        - visual quality scoring
    owned_paths:
      - schemas/proto-prompt-pack.schema.json
      - schemas/prototype-evidence.schema.json
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/workflow/summaryHealth.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - changes/M98-dailin-grade-vision2prompt-pipeline/
    dependencies: []
    unlocks:
      - C003
      - C005
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js validate --root . --json
    acceptance:
      - Validator fails when prompt_text_manifest.direction_count advertises more directions than PROTO_PROMPT_PACK.directions contains.
      - Validator fails when generated image metadata references a missing direction_id or prompt_id.
      - Validator fails when a generation-ready strategic prompt pack omits prompt_pack_integrity_gate or records a failing gate while image_generation has started.
      - Existing valid M93/M97 strategic prompt-pack fixtures can be updated to pass without weakening the new gate.
    selection:
      selected_change_id: C001-prompt-pack-integrity-gate
      selected_at: 2026-05-22
      reason: >
        C001 is the recommended dependency-free candidate and closes the
        highest-risk ambiguity from M97: downstream agents can currently proceed
        from internally inconsistent prompt-pack source refs. Integrity must
        fail closed before richer dailin-grade screen contracts can be trusted.
    completion:
      completed_at: 2026-05-22
      evidence:
        - changes/M98-dailin-grade-vision2prompt-pipeline/C001-prompt-pack-integrity-gate/LOCAL_CHANGE_EVIDENCE.yaml
      notes:
        - >
          C001 added prompt_pack_integrity_gate schema and validator coverage,
          runtime stress fixtures, and summary health surface fields.
        - >
          npm run validate still fails on pre-existing M97 planning artifact
          issues unrelated to C001; dist CLI validation and runtime surface
          verification pass.
  - id: C002
    status: done
    title: Migrate dailin reference pipeline into OW vision2prompt references
    purpose: >
      Bring the proven dailin vision_to_strategic_prototype_prompt method into
      OpenWorkflow as OW-owned references that agents must execute before
      writing strategic prompt packs.
    scope:
      includes:
        - OW-native reference files for input contract, vision decomposition, strategic hypothesis generation, product system extraction, prototype prompt schema, output templates, and quality rubric
        - preservation of dailin's emphasis on strategy before UI, distinct hypotheses, complete journeys, concrete copy/data, AI behavior, trust controls, anti-goals, and PM recommendation
        - removal of English Friend-specific assumptions from the generic protocol
        - source refs back to dailin artifacts for audit
      excludes:
        - schema or validator enforcement beyond what later candidates own
        - generated .agents surfaces until protocol wiring is selected
        - smart city replay
    owned_paths:
      - skills/build-prototype/references/vision2prompt/
      - skills/build-prototype/references/strategic-prompt-pack-protocol.md
      - changes/M98-dailin-grade-vision2prompt-pipeline/
    dependencies: []
    unlocks:
      - C003
      - C004
      - C005
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - rg -n "vision2prompt|dailin-grade|screen_manifest|quality_rubric" skills/build-prototype/references
    acceptance:
      - OW references expose the same pipeline density as dailin's 01-06 reference set without binding to Pocket English Friend.
      - The strategic prompt-pack protocol tells agents to run the reference pipeline in order before prompt text is marked ready.
      - The protocol explicitly forbids collapsing vision into a single image prompt when a product prototype prompt pack is required.
    selection:
      selected_change_id: C002-dailin-reference-pipeline
      selected_at: 2026-05-22
      reason: >
        C002 is the next ready candidate after C001. It migrates the proven
        dailin method into OW-owned reference files so C003 can extend the
        schema against a concrete execution pipeline rather than loose prose.
    completion:
      completed_at: 2026-05-22
      evidence:
        - changes/M98-dailin-grade-vision2prompt-pipeline/C002-dailin-reference-pipeline/LOCAL_CHANGE_EVIDENCE.yaml
      notes:
