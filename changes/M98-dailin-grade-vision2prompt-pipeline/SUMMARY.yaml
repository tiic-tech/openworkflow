    level: medium
    description: >
      The queue could expand into visual quality, provider benchmarking, or
      proto2html before prompt-pack source quality is solved.
    mitigation: Keep visual parity, provider images, and proto2html as deferred refs.
  - id: R002
    level: medium
    description: >
      The dailin migration could become prose-only guidance and still allow
      agents to write thin prompt packs.
    mitigation: Pair references with schema fields, validators, and negative fixtures.
  - id: R003
    level: medium
    description: >
      Schema expansion could break existing refined prompt-pack behavior used by
      /ow:tune.
    mitigation: Keep refined pack compatibility in C003 acceptance and runtime verification.
  - id: R004
    level: medium
    description: >
      Smart city replay could overfit the generic prompt-pack contract to one
      dashboard domain.
    mitigation: Use dailin as the positive cross-domain fixture and smart city as a replay/regression, not the only success case.
