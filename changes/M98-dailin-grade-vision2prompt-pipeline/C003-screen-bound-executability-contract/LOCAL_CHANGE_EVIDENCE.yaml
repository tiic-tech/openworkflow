behavior_changes:
  - Added schema fields for prototype_brief, direction_map, richer screen_manifest entries, global_design_system_prompt, top-level quality_rubric, and richer screen prompt metadata.
  - Added strategic prompt-pack validator checks that require screen-bound executability only when prompt text is ready for image generation or image generation has started.
  - Enforced that generation-ready screen prompts resolve to screen_manifest.target_screen_id and include negative prompts, example copy, acceptance criteria, and executable prompt text.
  - Enforced that each generation-ready screen_manifest entry includes components, data/state, actions, AI behavior or explicit non-AI rationale, trust controls, example copy, and acceptance criteria.
  - Added summary-health handoff fields for prototype_brief, screen_manifest, global_design_system_prompt, and quality_rubric.
  - Updated strategic prompt-pack protocol guidance to name the screen-bound executability contract before prompt_text_manifest can become ready_for_image_generation.
  - Extended runtime stress fixtures with positive dailin-grade and smart-city screen-bound prompt packs plus negative missing-manifest and orphan-screen-prompt regressions.
