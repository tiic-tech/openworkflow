scope:
  includes:
    - direction_map or equivalent direction-level strategic overview
    - prototype_brief fields for product name, positioning, target user, current alternative, core idea, primary loop, trust boundaries, non-goals, and desired feeling
    - screen_manifest fields for journey_stage, user_goal, system_state, selected_object, required_components, required_data_fields, primary_actions, ai_behavior, trust_controls, example_copy, and acceptance_criteria
    - global_design_system_prompt fields for visual language, layout system, component vocabulary, information density, copy tone, responsive/canvas rules, and negative visual patterns
    - screen_prompts fields for standalone prompt, negative_prompt, example_copy, and acceptance criteria tied to screen_manifest ids
    - quality_rubric fields for prompt executability, strategic distinctness, product specificity, state coverage, and trust boundary coverage
  excludes:
    - refined tune prompt-pack redesign unless a field must stay compatible
    - provider-backed generation
    - visual parity scoring
    - generated skill protocol rewrites owned by C004
forbidden_paths:
  - .openworkflow/**
  - .agents/**
  - provider-backed image generation code
  - visual quality review artifacts
  - proto2html artifacts
acceptance:
  - Generation-ready strategic prompt packs require screen-bound manifest and prompt fields rather than only freeform prototype_prompt text.
  - Every screen prompt resolves to a screen_manifest entry.
  - Every screen_manifest entry includes components, states/data, actions, system behavior or explicit non-AI rationale, and acceptance criteria.
  - The schema still supports refined prompt-pack fields used by /ow:tune.
validation:
  - npm run build
  - npm run validate
  - npm run verify:runtime-surface
  - node dist/cli/src/index.js validate --root . --json
  - node dist/cli/src/index.js summaries --root . --strict --json
  - git diff --check
high_risk:
  approval_required: false
  reason: >
    C003 is a local schema, validator, summary-health, reference, and fixture
    change. It does not call external services, publish releases, mutate remote
    repositories, generate provider images, delete generated adapters, or broaden
    workflow semantics beyond strategic prompt-pack executability.
expected_commit_boundary: >
  Complete C003 as one coherent commit after updating the strategic prompt-pack
  contract, validators, protocol reference text, queue status, and local
  evidence.
completion:
