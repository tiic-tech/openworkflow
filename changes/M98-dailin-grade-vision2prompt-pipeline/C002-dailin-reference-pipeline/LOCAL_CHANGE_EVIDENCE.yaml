behavior_changes:
  - Added OW-native input normalization guidance for durable vision, validation, direction count policy, target tool, and missing-input handling.
  - Added vision decomposition guidance for target user, behavior change, success signal, differentiator, trust/privacy requirements, non-goals, and central uncertainty.
  - Added strategic hypothesis generation guidance that rejects visual-skin directions and scenario-only splits.
  - Added product system extraction guidance for product_experience_model, screen_manifest, domain object model, state model, data fields, trust controls, and anti-generic constraints.
  - Added prototype prompt schema guidance for screen groups, states, actions, system behavior, example content, negative prompts, and acceptance criteria.
  - Added output template guidance that keeps PROTO_PROMPT_PACK.yaml as source of truth and Markdown as readable view.
  - Added quality rubric guidance for strategic differentiation, prompt executability, product specificity, trust/safety, and integrity readiness.
  - Updated strategic-prompt-pack-protocol.md to require the vision2prompt reference pipeline before prompt_text_manifest.status becomes ready_for_image_generation.
