behavior_changes:
  - Generated /ow:vision2prompt now tells agents to load strategic-prompt-pack-protocol.md and run references/vision2prompt/01_input_contract.md through 07_quality_rubric.md before writing PROTO_PROMPT_PACK.
  - Generated /ow:vision2prompt now requires compact intermediate outputs for normalized input, vision decomposition, candidate hypotheses, product experience model, screen_manifest, prompt schema, output manifest, and quality rubric.
  - Generated /ow:vision2prompt now blocks prompt_text_manifest.status ready_for_image_generation until prompt_pack_integrity_gate, prototype_reality_gate, quality_rubric.prompt_executability, and screen_manifest linkage pass.
  - Generated /ow:prompt2proto now refuses prompt packs whose integrity, reality, prompt executability, or screen linkage gates fail or are missing.
  - Generated /ow:proto now repeats the same internal handoff gate before triggering /ow:prompt2proto.
  - skills/build-prototype/SKILL.md now points strategic mode at the numbered vision2prompt reference pipeline and the same gate requirements.
  - verifyAgentE2E's temporary validation fixture now satisfies current /ow:proto readiness fields while preserving the strict thin-summary handoff regression.
