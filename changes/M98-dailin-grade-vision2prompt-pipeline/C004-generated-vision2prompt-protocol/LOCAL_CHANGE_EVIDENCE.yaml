  Wired the dailin-grade vision2prompt reference pipeline into the generated
  /ow:vision2prompt protocol and tightened the generated /ow:proto and
  /ow:prompt2proto handoff rules so prompt packs cannot proceed to image
  generation while integrity, reality, screen linkage, prompt executability, or
  post-validation gates are missing or failing.
