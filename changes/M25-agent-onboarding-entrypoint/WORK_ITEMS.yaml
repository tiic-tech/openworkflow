schema_version: 0.1.0
contract_id: work_items:M25-agent-onboarding-entrypoint
contract_type: work_items
title: M25 Agent onboarding entrypoint work items
status: accepted
change_contract: changes/M25-agent-onboarding-entrypoint/CHANGE.yaml
items:
  - task_id: M25-T001
    title: Add maintained AGENTS.md template
    status: completed
    owned_paths:
      - templates/
      - packages/core/src/
    acceptance:
      - The OpenWorkflow AGENTS.md content lives in one maintained template with a template version.
      - The template tells agents to start with CURRENT_STATE.yaml and then follow read_this_first.
      - The template explains /ow:* command boundaries, lazy-create stage artifacts, and openworkflow --help.
  - task_id: M25-T002
    title: Implement safe AGENTS.md insert/update behavior
    status: completed
    owned_paths:
      - packages/cli/src/commands/init.ts
      - packages/cli/src/commands/sync.ts
      - packages/core/src/
    acceptance:
      - Missing AGENTS.md is created from the template.
      - Existing AGENTS.md receives a single OpenWorkflow-managed block without losing user content.
      - Existing managed blocks are replaced from the template instead of duplicated.
  - task_id: M25-T003
    title: Extend doctor and clean for AGENTS.md
    status: completed
    owned_paths:
      - packages/cli/src/commands/doctor.ts
      - packages/cli/src/commands/clean.ts
      - packages/adapters/codex/src/
    acceptance:
      - doctor detects missing or stale OpenWorkflow AGENTS.md block and reports clear guidance.
      - clean removes only the managed block and preserves unrelated AGENTS.md content.
      - clean removes the file only when it was entirely generated by OpenWorkflow or becomes empty after removing the managed block.
  - task_id: M25-T004
    title: Improve openworkflow --help for agents
    status: completed
    owned_paths:
      - packages/cli/src/index.ts
    acceptance:
      - Help includes Agent quick start and first-read files.
      - Help distinguishes CLI maintenance commands from repo-local /ow:* workflow commands.
      - Help explains minimal init and lazy-created stage artifacts.
  - task_id: M25-T005
    title: Add regression coverage
    status: completed
    owned_paths:
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/cli/src/dev/verifyCleanCommand.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
    acceptance:
      - Tests cover AGENTS.md create, append, idempotent update, and clean behavior.
      - Tests cover help text content quality.
      - Repository validation includes M25 change contracts.
