summary: >
  Add the repo-local select-change source skill so a candidate queue can be
  converted into one focused implementation change with atom tasks and a brief.
problem: >
  Candidate queues are useful only if an Agent can reliably choose one next
  change, preserve the reason for that choice, and hand off a bounded set of
  atom tasks without widening scope or starting implementation prematurely.
goals:
  - Add `skills/select-change/SKILL.md`.
  - Add selection reference guidance for candidate filtering, rationale,
    queue updates, atom tasks, and implementation briefs.
  - Dogfood selection against the M56 proto redesign candidate queue.
  - Update M54 candidate status with completion evidence.
non_goals:
  - Do not execute the selected change implementation.
  - Do not expose new `/ow:*` runtime commands.
  - Do not add autonomous loop or archive completion behavior.
  - Do not edit generated `.agents` or `.openworkflow` surfaces.
affected_paths:
  - skills/select-change/
  - changes/M57-select-change-skill/
  - changes/M54-decompose-select-change-planning/CANDIDATE_CHANGES.yaml
acceptance:
  - Skill selects one candidate by stable id with explicit rationale.
  - Skill marks selection state without deleting other candidates.
  - Skill emits atom tasks with owned paths and done_when criteria.
  - Skill creates an implementation brief that lets an Agent start with low context.
validation:
  - npm run validate
  - python3 /Users/archy/.codex/skills/.system/skill-creator/scripts/quick_validate.py skills/select-change
  - manual dogfood selection from a sample CANDIDATE_CHANGES.yaml
