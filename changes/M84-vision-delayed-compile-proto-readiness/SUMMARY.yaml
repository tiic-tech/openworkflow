risks:
  - id: R001
    level: medium
    description: Delayed persistence can reduce audit evidence if a long interview is interrupted.
    mitigation: Define checkpoint mode and pause/resume snapshots before implementation.
  - id: R002
    level: medium
    description: Proto-readiness gates can become too strict and block useful exploratory discovery.
    mitigation: Distinguish draft/interview state from final compile readiness.
  - id: R003
    level: medium
    description: Vision artifact expansion can create noisy read models.
    mitigation: Keep detailed coverage structured and expose compact summary-first readiness.
  - id: R004
    level: high
    description: Rebuilding vision, validation, proto, and tune together would exceed a reasonable DTC queue boundary.
    mitigation: Keep this queue limited to /ow:vision and defer downstream command changes.
  - id: R005
    level: medium
    description: A generated ow-vision adapter without a native build-vision source skill creates source-behavior drift.
    mitigation: Add skills/build-vision in C001 and require repository validation to keep it present.
