queue_policy:
  branch_boundary: codex/m73-workflow-blueprint-runtime-alignment
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - fixes /ow:vision interaction flow before downstream command changes
    - makes VISION.md acceptance depend on proto prompt readiness
    - preserves auditability without per-answer durable writes
    - creates verifiable contracts before generated adapter changes
    - keeps one selected change implementation-sized
  avoid:
    - rebuilding vision, validation, proto, and tune in one change
    - adding downstream proto2html or html2spec behavior
    - treating artifact completeness as vision quality
    - creating eager-persistence behavior during interview mode
scope_control:
  current_boundary: >
    Upgrade /ow:vision to use delayed compile and proto-readiness quality gates.
    This queue owns the first discovery-loop correction: vision should remain
    conversational during interview, then compile only when it can feed
    high-quality /ow:proto prompt generation.
  boundary_type: command_surface
  in_scope_rule: >
    Include only candidates needed to define and implement the /ow:vision
    delayed-compile interaction model, proto-readiness contract, artifact shape,
    and focused verification.
  out_of_scope_rule: >
    Record validation, proto, tune, cross-loop read models, and end-to-end
    benchmark prototype work as deferred features. Do not include them as
    current candidates until the vision source contract is stable.
  deferred_features:
    - title: Reposition /ow:validation around prototype validation targets
      reason: >
        Validation should consume proto-ready vision and sharpen the prototype
        target; it depends on the new vision contract.
      suggested_plan_id: M85-validation-proto-target-contract
    - title: Align /ow:proto as strategy-to-prompt compiler
      reason: >
        Proto should consume the new vision and validation contracts to produce
        strategic prompt packs and absorb the
        vision_to_strategic_prototype_prompt reference skill; it should be
        decomposed after vision readiness is stable.
      suggested_plan_id: M86-proto-strategy-prompt-compiler
    - title: Align /ow:tune with product-system inheritance
      reason: >
        Tune should preserve product system continuity using inheritance and
        delta rules and absorb the prototype_tune_to_refined_prompt reference
        skill; it depends on prototype prompt and benchmark evidence contracts.
      suggested_plan_id: M87-tune-product-system-inheritance
    - title: Define discovery-loop read model
      reason: >
        Agents need one compact view across vision, validation, proto, and tune
        readiness after the command-specific contracts are stable.
      suggested_plan_id: M88-discovery-loop-read-model
    - title: Create discovery-loop E2E dogfood fixture
      reason: >
        The upgraded loop should be pressure-tested from long vision interview
        through benchmark prototype selection after component commands are
        upgraded.
      suggested_plan_id: M89-discovery-loop-e2e-dogfood
next_recommended_candidate_id: C003
changes:
  - id: C001
    status: done
    title: Define /ow:vision delayed-compile contract and native build-vision skill
    purpose: >
      Replace eager per-answer persistence with an explicit interview,
      checkpoint, and compile mode contract for /ow:vision while preserving
      auditability and pause/resume expectations. Add the missing native
      skills/build-vision source behavior so vision has the same source-skill
      foundation as validation, proto, and tune.
    scope:
      includes:
        - /ow:vision interaction mode definitions
        - interview mode no-durable-write rule
        - checkpoint mode trigger rules
        - compile mode readiness requirements
        - auditability and interruption risk guardrails
        - native skills/build-vision source skill
        - build-vision references for interview protocol and proto-readiness
      excludes:
        - implementing schema or generated skill changes
        - validation, proto, or tune behavior
        - runtime command exposure
    owned_paths:
      - docs/DISCOVER_LOOP_UPGRATE_PLAN.md
      - skills/build-vision/
      - packages/core/src/validators/validateRepositoryContracts.ts
      - references/
      - changes/M84-vision-delayed-compile-proto-readiness/
    dependencies: []
    unlocks:
      - C002
      - C003
      - C004
    risk: medium
    size: medium
    validation:
      - npm run validate
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The delayed-compile modes are explicitly defined.
      - The contract says normal interview mode must not write durable vision files after every answer.
      - Checkpoint and compile mode preserve audit evidence without breaking conversation flow.
      - Compile mode requires user confirmation and proto-readiness.
      - skills/build-vision/SKILL.md exists as the native source skill for vision discovery.
      - Repository validation treats build-vision as a required native source skill.
    selection:
      selected_change_id: C001-build-vision-delayed-compile-contract
      reason: >
        Single-queue SC selected C001 because it establishes the delayed-compile
        contract and fills the missing native build-vision source skill before
        schema, generated adapter, or downstream command changes.
      selected_at: 2026-05-22
    completion:
      completed_change_id: C001-build-vision-delayed-compile-contract
      completed_at: 2026-05-22
      primary_commit: 0140a0109ff9da718952a37a422cfcf527264b51
      evidence:
        - changes/M84-vision-delayed-compile-proto-readiness/C001-build-vision-delayed-compile-contract/LOCAL_COMMIT_EVIDENCE.yaml
        - skills/build-vision/SKILL.md
