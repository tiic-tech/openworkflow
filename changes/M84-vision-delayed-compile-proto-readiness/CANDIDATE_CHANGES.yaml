      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - .agents/skills/ow-vision/SKILL.md
      - .openworkflow/audit/COMMAND_AUDIT_INDEX.yaml
      - .openworkflow/audit/CONTEXT_PACKETS.yaml
    dependencies:
      - C001
      - C002
    unlocks:
      - C004
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - node dist/cli/src/index.js sync --root . --json
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - /ow:vision generated skill names the three roles explicitly.
      - The skill requires deep interview before compile and forbids eager durable writes in interview mode.
      - The skill uses proto-readiness as a compile gate.
      - Verification proves generated skill and context packets preserve the new protocol.
  - id: C004
    status: candidate
    title: Add /ow:vision delayed-compile stress tests and fixtures
    purpose: >
      Verify that /ow:vision remains low-latency for humans while still
      producing trustworthy artifacts when compile mode is reached.
    scope:
      includes:
        - fixture or verification coverage for interview mode
        - fixture or verification coverage for thin proto-readiness
        - fixture or verification coverage for compile-ready vision
        - generated surface drift checks after sync
      excludes:
        - full validation/proto/tune E2E dogfood
        - browser UI automation
        - prototype image generation
    owned_paths:
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/core/src/workflow/summaryHealth.ts
      - changes/M84-vision-delayed-compile-proto-readiness/
    dependencies:
      - C001
      - C002
      - C003
    unlocks:
      - M85-validation-proto-target-contract
      - M86-proto-strategy-prompt-compiler
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Tests cover a vision session that is not compile-ready and must remain thin/blocked.
      - Tests cover a compile-ready vision artifact with proto-readiness fields.
      - Tests protect the no eager durable write rule at the protocol or generated skill level.
      - Verification fails clearly if generated vision guidance drops the delayed-compile contract.
