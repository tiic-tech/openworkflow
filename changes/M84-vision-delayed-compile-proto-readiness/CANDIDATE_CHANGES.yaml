  - id: C003
    status: ready
    title: Upgrade /ow:vision skill protocol for product partner interrogation
    purpose: >
      Encode the product partner, requirements interrogator, and intent compiler
      role into /ow:vision so it keeps asking until proto-readiness is strong
      instead of compiling after a shallow question count.
    scope:
      includes:
        - command registry protocol updates for /ow:vision
        - generated ow-vision skill guidance through sync
        - anti-patterns against fixed question-count compile
        - proto-readiness audit before durable artifact generation
      excludes:
        - validation, proto, or tune source skill changes
        - UI or app-level interaction implementation
        - new command registration
    owned_paths:
