title: Internal coder quality governance
summary: >
  M115 captures the user decision to make coder quality governance a native OW
  internal protocol. `/ow:coder` should be Agent-only and cross-cutting: it
  constrains code-changing Agents with trust recovery, owner/file/dependency
  maps, RED/GREEN evidence, post-write self-check, validation ladder selection,
  evidence binding, and promotion of repeated quality lessons into source
  policy. It must not become a normal user-facing command or replace
  `/ow:change` or `/ow:team`.
