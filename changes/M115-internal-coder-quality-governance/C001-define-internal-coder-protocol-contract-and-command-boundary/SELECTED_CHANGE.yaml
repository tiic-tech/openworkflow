candidate_id: C001
change_id: C001-define-internal-coder-protocol-contract-and-command-boundary
title: Define internal coder protocol contract and command boundary
status: completed
selected_at: 2026-05-23
selected_by: agent
risk: medium
size: small
selection_source:
  queue: changes/M115-internal-coder-quality-governance/CANDIDATE_CHANGES.yaml
selection_reason: >
  Select C001 because it is dependency-free, is the queue's recommended first
  candidate, and establishes the internal-only `/ow:coder` semantic contract
  before source skill migration, registry work, generated surfaces, read-model
  integration, or evidence schema work begins.
rejected_alternatives:
  - id: C002
    reason: Depends on C001's source ownership and command-boundary contract.
  - id: C003
    reason: Depends on C001 and C002 before command registry changes.
  - id: C004
    reason: Depends on the source skill and registry boundary from C002/C003.
  - id: C005
    reason: Depends on command/protocol integration and is high risk.
  - id: C006
    reason: Depends on proven read-model integration and is high risk.
  - id: C007
    reason: Depends on source skill migration from C002.
owned_paths:
  - changes/M115-internal-coder-quality-governance/
  - references/
forbidden_paths:
  - .openworkflow/**
  - .agents/**
  - packages/core/src/commands/registry.ts
  - packages/core/src/adapters/**
  - packages/cli/src/**
  - packages/core/src/**
  - schemas/**
  - skills/**
dependencies: []
scope:
  includes:
    - define the semantic contract for `/ow:coder`
    - specify `visibility: internal` and Agent-only consumption
    - define preflight owner/file/dependency map expectations
    - define RED evidence, GREEN evidence, post-write self-check, validation ladder, and evidence binding rules
    - define why `/ow:coder` must not replace `/ow:change` or `/ow:team`
    - identify future integration points for change, team, git-automation, resume, context, handoff, summaries, and inspect
  excludes:
    - modifying command registry
    - creating generated `.agents/**` or `.openworkflow/**` surfaces
    - migrating the system skill into repo source
    - creating CODER_EVIDENCE.yaml
    - changing CLI JSON output
acceptance:
  - The contract states that `/ow:coder` is internal, Agent-only, and not a user-facing coding entrypoint.
  - The contract defines preflight, RED/GREEN, self-check, validation ladder, and evidence binding responsibilities.
  - The contract names integration points without implementing them.
  - No runtime behavior, generated surfaces, or public JSON shape changes.
validation:
  - node dist/cli/src/index.js handoff --root . --json
  - node dist/cli/src/index.js inspect --root . --strict --json
  - node dist/cli/src/index.js resume --root . --json
  - git diff --check
high_risk:
  approval_required: false
  reason: >
    C001 is a planning and reference contract only. It does not change command
    registry behavior, generated surfaces, source skill delivery, evidence
    schemas, public JSON output, or runtime enforcement.
expected_commit_boundary: >
  Complete C001 as one coherent commit after adding the internal coder protocol
  reference, refreshing M115 planning artifacts, and running the selected
  validation ladder.
completion:
  completed_at: 2026-05-23
  evidence:
    - references/internal-coder-protocol.md
    - changes/M115-internal-coder-quality-governance/C001-define-internal-coder-protocol-contract-and-command-boundary/LOCAL_COMMIT_EVIDENCE.yaml
  validation:
    - ruby -ryaml -e "ARGV.each { |f| YAML.load_file(f); puts \"ok #{f}\" }" changes/M115-internal-coder-quality-governance/CANDIDATE_CHANGES.yaml changes/M115-internal-coder-quality-governance/SUMMARY.yaml changes/M115-internal-coder-quality-governance/C001-define-internal-coder-protocol-contract-and-command-boundary/SELECTED_CHANGE.yaml changes/M115-internal-coder-quality-governance/C001-define-internal-coder-protocol-contract-and-command-boundary/ATOM_TASKS.yaml
    - node dist/cli/src/index.js handoff --root . --json
    - node dist/cli/src/index.js inspect --root . --strict --json
    - node dist/cli/src/index.js resume --root . --json
    - git diff --check
