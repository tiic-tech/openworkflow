schema_version: 0.1.0
contract_id: candidate_changes:M115-internal-coder-quality-governance
contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M115-internal-coder-quality-governance
title: Candidate changes for internal coder quality governance
status: active
source:
  kind: planning_discussion
  refs:
    - user_input:2026-05-23-internal-coder-quality-governance
    - /Users/archy/.codex/skills/ow-code-quality-governor/SKILL.md
    - changes/M114-engineering-quality-foundation/SUMMARY.yaml
    - changes/M114-engineering-quality-foundation/CANDIDATE_CHANGES.yaml
    - references/internal-coder-protocol.md
    - skills/coder/SKILL.md
  summary: >
    The user wants OW to absorb the current code-quality governor as an
    internal, Agent-only coder governance protocol rather than a normal
    user-facing command. The intended `/ow:coder` role is not "write code"; it
    is a cross-cutting engineering immune system that constrains all source
    edits with trust recovery, owner/file/dependency maps, RED evidence before
    production changes, GREEN evidence after fixes, self-checks, validation
    ladder selection, evidence binding, and long-term promotion of repeated
    quality lessons back into OW source skills and policy.
priority:
  priority_rank: above_M114
  preempts:
    - M114-engineering-quality-foundation
  reason: >
    M114 started broad repository-quality foundation work, but coder governance
    is the missing execution protocol that should constrain M114 and future
    implementation queues before they continue. This queue should be selected
    before returning to M114 C002.
queue_policy:
  branch_boundary: codex/m101-build-proto-prompt-command-split
  branch_note: >
    Created on the current continuation branch because the user explicitly
    promoted internal coder governance above M114. A later git-automation
    branch action may move this queue if branch governance requires it.
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  selected_change_commit_gate: strict
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select C001 first. The internal coder protocol contract must define
    command visibility, source skill ownership, non-user-facing boundaries,
    required gates, and non-goals before any registry, generated surface,
    change/team/git integration, or evidence artifact is implemented.
  high_risk_rule: >
    Any candidate that changes public CLI JSON semantics, user-facing command
    listings, generated adapter delivery, enforced commit gates, or persistent
    evidence schemas is high risk unless it is explicitly scoped as
    internal-only and behavior-compatible.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Internal, Agent-only coder quality governance protocol for code execution
    preflight, RED/GREEN evidence, self-check, validation selection, and
    evidence binding.
  boundary_type: internal_command_and_cross_cutting_quality_protocol
  in_scope_rule: >
    Include only the source skill, internal command registry contract, protocol
    references, read-model exposure, and evidence hooks needed to make code
    execution quality governance native to OW.
  out_of_scope_rule: >
    Do not expose `/ow:coder` as a normal user workflow entry, do not replace
    `/ow:change` or `/ow:team`, do not implement a broad auto-coding agent, do
    not force new evidence schemas before the protocol proves useful, and do
    not continue unrelated M114 refactors inside this queue.
  deferred_features:
    - title: User-facing code review or quality command
      reason: >
        The desired primitive is internal and Agent-only. A user-facing
        `/ow:coder-review` or `/ow:quality` should be considered only after
        internal adoption proves a stable need.
      suggested_plan_id: M116-user-facing-quality-review
    - title: Project SOUL and MEMORY promotion from coder lessons
      reason: >
        Coder governance can produce high-value lessons, but durable
        project-local SOUL/MEMORY requires its own persistence, privacy,
        pruning, and promotion rules.
      suggested_plan_id: M112-project-soul-memory
    - title: Full enforcement of mandatory coder evidence
      reason: >
        Initial integration should report and guide missing gates. Hard failure
        policies should wait until CODER_EVIDENCE or commit evidence binding is
        proven on real queues.
      suggested_plan_id: M117-coder-evidence-enforcement
next_recommended_candidate_id: C006
