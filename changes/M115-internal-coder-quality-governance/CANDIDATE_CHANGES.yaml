      Establish `/ow:coder` as an internal, Agent-only code execution
      governance protocol and define its source skill boundary, required gates,
      non-goals, and integration points without changing runtime behavior.
    scope:
      includes:
        - define the semantic contract for `/ow:coder`
        - specify `visibility: internal` and Agent-only consumption
        - define preflight owner/file/dependency map expectations
        - define RED evidence, GREEN evidence, post-write self-check, validation ladder, and evidence binding rules
        - define why `/ow:coder` must not replace `/ow:change` or `/ow:team`
        - identify future integration points for change, team, git-automation, resume, context, handoff, summaries, and inspect
      excludes:
        - modifying command registry
