risks:
  - id: R001
    level: medium
    description: Proto can regress into visual-style variants instead of strategic directions.
    mitigation: Require distinctness across product form, trigger, interaction model, emotional driver, retention mechanism, metric, or main risk.
  - id: R002
    level: medium
    description: Proto can silently invent missing strategy when validation or vision is thin.
    mitigation: Preserve M85 validation gate and tighten prompt-pack strategy fields.
  - id: R003
    level: medium
    description: Prompt-pack artifacts can drift into production backlog or HTML generation.
    mitigation: Keep image-only boundaries and explicit anti-goals in source, generated protocol, and tests.
