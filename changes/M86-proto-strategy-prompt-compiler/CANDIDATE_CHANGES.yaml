    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js sync --root . --json
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Generated /ow:proto says it compiles validated strategy into prompt packs.
      - Generated /ow:proto checks vision and validation quality and routes back to /ow:vision when either is insufficient.
      - Generated /ow:proto asks for strategic direction count when absent and uses 3 only when the user delegates that decision.
      - Generated /ow:proto writes multi-direction prompt text before starting image generation.
      - Generated /ow:proto batch-generates prototype images and records collected outputs.
      - Generated /ow:proto preserves M85 durable validation behavior.
      - Context packets include the strategic prompt-pack quality gates.
      - Verification catches generated-surface drift.
    selection:
      selected_change_id: C003-proto-generated-protocol
      reason: >
        Select C003 directly inside M86 because C001 and C002 are complete and
        the generated /ow:proto protocol now needs to execute the artifact
        behavior encoded by C002.
      selected_at: 2026-05-22
    completion:
      completed_change_id: C003-proto-generated-protocol
      completed_at: 2026-05-22
      commit: d67d05a
      evidence:
        - changes/M86-proto-strategy-prompt-compiler/C003-proto-generated-protocol/LOCAL_COMMIT_EVIDENCE.yaml
  - id: C004
    status: candidate
    title: Add strategic prompt-pack stress fixtures
    purpose: >
      Pressure-test /ow:proto against weak, style-only, and high-quality
      strategic prompt-pack outputs before handing off to tune work.
    scope:
      includes:
        - thin prompt-pack fixture
        - style-only direction fixture
        - proto-ready strategic prompt-pack fixture
        - runtime or E2E assertions for prompt quality gates
      excludes:
        - generated prototype images
        - browser or visual inspection
        - tune refined prompt pack fixtures
    owned_paths:
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - changes/M86-proto-strategy-prompt-compiler/
    dependencies:
      - C001
      - C002
      - C003
      - C005
    unlocks:
      - M87-tune-product-system-inheritance
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Tests cover prompt packs that are too thin for downstream generation.
      - Tests reject directions that only differ by visual style.
      - Tests cover a high-quality prompt pack with concrete screens, interactions, AI/system behavior, trust controls, and sample content.
      - Runtime verification fails clearly if strategic fields or direction quality gates are dropped.
  - id: C005
    status: selected
    title: Define internal proto pipeline and image metadata
    purpose: >
      Split /ow:proto into internal command-sized stages so agents can execute
      preflight, vision-to-prompt compilation, and prompt-to-prototype
      generation without one oversized command drifting in intent.
    scope:
      includes:
        - internal /ow:vision2prompt command registration
        - internal /ow:prompt2proto command registration
        - /ow:proto orchestration guidance
        - prototype internal_pipeline artifact fields
        - per-image metadata requirements
        - generated internal skills and context packets through sync
        - verification for internal command visibility and image metadata
      excludes:
        - user-facing exposure of the internal commands
        - /ow:tune internal pipeline implementation
        - external image API integration
        - proto2html or HTML generation
    owned_paths:
      - packages/core/src/commands/registry.ts
      - packages/core/src/artifacts/registry.ts
      - schemas/proto-prompt-pack.schema.json
      - schemas/prototype-evidence.schema.json
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - .agents/skills/ow-vision2prompt/SKILL.md
      - .agents/skills/ow-prompt2proto/SKILL.md
      - .openworkflow/audit/COMMAND_AUDIT_INDEX.yaml
      - .openworkflow/audit/CONTEXT_PACKETS.yaml
      - .openworkflow/audit/ARTIFACT_CONTRACTS.yaml
      - changes/M86-proto-strategy-prompt-compiler/
    dependencies:
      - C001
      - C002
      - C003
    unlocks:
      - C004
      - M87-tune-product-system-inheritance
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js sync --root . --json
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - /ow:vision2prompt and /ow:prompt2proto are registered as internal commands, not user-facing handoffs.
      - /ow:proto remains the user-facing orchestrator for preflight, vision2prompt, and prompt2proto.
      - Prototype artifacts record internal_pipeline stage ownership and outputs.
      - Every generated image entry requires image_id, direction_id, prompt_id, path, and metadata.
      - Generated skills and context packets include the internal pipeline boundary.
      - Verification catches accidental user-facing exposure of internal proto commands.
    selection:
      selected_change_id: C005-internal-proto-pipeline-image-metadata
      reason: >
        User and agent agreed that internal command decomposition will reduce
        per-command output pressure and drift. C005 must precede C004 because
        stress fixtures should target the decomposed pipeline shape.
      selected_at: 2026-05-22
