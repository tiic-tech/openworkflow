schema_version: 0.1.0
contract_id: candidate_changes:M86-proto-strategy-prompt-compiler
contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M86-proto-strategy-prompt-compiler
title: Candidate changes for proto strategy prompt compiler
status: active
source:
  kind: mixed
  refs:
    - docs/DISCOVER_LOOP_UPGRATE_PLAN.md
    - changes/M85-validation-proto-target-contract/SUMMARY.yaml
    - skills/build-prototype/SKILL.md
    - skills/build-prototype/references/strategic-prompt-pack-protocol.md
    - user_direction:2026-05-22-continue-after-validation
queue_policy:
  branch_boundary: codex/m73-workflow-blueprint-runtime-alignment
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - makes /ow:proto a strategy-to-prompt compiler that consumes durable validation artifacts
    - absorbs the vision-to-strategic-prototype reference skill into native OW source behavior
    - preserves M85 validation as source truth instead of re-inventing the experiment target
    - produces prompt packs that are specific enough for high-quality image prototype generation
    - keeps /ow:proto image-first and out of HTML, design, spec, change, team, or production work
  avoid:
    - adding /ow:tune inheritance behavior to this queue
    - creating generated prototype images or HTML in this queue
    - allowing vision_only or ephemeral validation paths after M85
    - broadening into discovery-loop E2E dogfood
    - turning prompt packs into implementation backlogs
scope_control:
  current_boundary: >
    Upgrade /ow:proto as a strategy-to-prompt compiler: consume durable
    validation targets and proto-ready vision, extract strategic product
    structure, generate distinct prototype directions, and emit high-quality
    image-first prompt packs for downstream generation and review.
  boundary_type: command_surface
  in_scope_rule: >
    Include only candidates needed to define, encode, generate, and verify the
    /ow:proto command and prototype prompt-pack artifact as the next stage after
    /ow:validation.
  out_of_scope_rule: >
    Record tune inheritance, proto2html, html2spec, full discovery-loop read
    model, and E2E dogfood as deferred refs. Do not include them in M86.
  deferred_features:
    - title: Align /ow:tune with product-system inheritance
      reason: >
        Tune depends on accepted prototype prompt packs or baseline image groups.
      suggested_plan_id: M87-tune-product-system-inheritance
    - title: Define discovery-loop read model
      reason: >
        Cross-command read models should wait until vision, validation, proto,
        and tune command contracts are stable.
      suggested_plan_id: M88-discovery-loop-read-model
    - title: Create discovery-loop E2E dogfood fixture
      reason: >
        End-to-end pressure testing belongs after command-specific contracts land.
      suggested_plan_id: M89-discovery-loop-e2e-dogfood
    - title: Rebuild proto2html around benchmark prototype input
      reason: >
        Proto2html should consume the selected benchmark prototype after prompt
        generation and tuning stabilize.
      suggested_plan_id: M90-proto2html-benchmark-input
next_recommended_candidate_id: C005
changes:
  - id: C001
    status: done
    title: Align native build-prototype strategy compiler contract
    purpose: >
      Absorb the vision-to-strategic-prototype reference skill into OW's native
      build-prototype behavior and remove stale vision_only validation guidance.
    scope:
      includes:
        - build-prototype role and input policy updates
        - durable validation consumption after M85
        - strategic input normalization dimensions
        - strategic hypothesis and prompt-pack quality bar
        - image-only and no-production boundaries
      excludes:
        - changing artifact schemas
        - changing generated /ow:proto skill output
        - adding tune inheritance behavior
        - generating prototype images
    owned_paths:
      - skills/build-prototype/SKILL.md
      - skills/build-prototype/references/strategic-prompt-pack-protocol.md
      - changes/M86-proto-strategy-prompt-compiler/
    dependencies: []
    unlocks:
      - C002
      - C003
      - C004
    risk: medium
    size: medium
    validation:
      - npm run validate
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - build-prototype defines /ow:proto as a strategy-to-prompt compiler.
      - build-prototype forbids ephemeral vision_only validation after M85.
      - The reference protocol names the normalized strategy fields needed by prototype prompts.
      - The protocol requires strategically distinct directions and concrete prompt contents.
    selection:
      selected_change_id: C001-build-prototype-strategy-compiler
      reason: >
        AC recommended M86 C001 as the current discovery-loop continuation
        because it is dependency-free, medium risk, and aligns native proto
        behavior before schema or generated protocol changes.
      selected_at: 2026-05-22
    completion:
      completed_change_id: C001-build-prototype-strategy-compiler
      completed_at: 2026-05-22
      commit: d277697
      evidence:
        - changes/M86-proto-strategy-prompt-compiler/C001-build-prototype-strategy-compiler/LOCAL_COMMIT_EVIDENCE.yaml
  - id: C002
    status: done
    title: Strengthen strategic prototype prompt-pack artifacts
    purpose: >
      Make the prototype evidence and prompt-pack schemas/templates enforce the
      fields /ow:proto needs for agent-grade prompt generation.
    scope:
      includes:
        - preflight quality gate for vision and validation artifact existence and quality
        - direction count policy with askUserQuestion and default 3 behavior
        - validation_input mode values aligned to durable validation
        - normalized_input required strategic fields
        - strategic_core required fields
        - directions with distinction rationale and screen prompt requirements
        - build_recommendation signals
        - prompt text manifest and image generation collection fields
      excludes:
        - /ow:tune refined prompt pack schema work
        - generated /ow:proto protocol wording
        - generated images or HTML prototypes
    owned_paths:
      - packages/core/src/artifacts/registry.ts
      - schemas/proto-prompt-pack.schema.json
      - schemas/prototype-evidence.schema.json
      - packages/core/src/workflow/summaryHealth.ts
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - .openworkflow/audit/ARTIFACT_CONTRACTS.yaml
    dependencies:
      - C001
    unlocks:
      - C003
      - C004
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js sync --root . --json
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Artifacts can record whether vision and validation quality are sufficient for high-quality prototype prompts.
      - Artifacts can represent askUserQuestion for missing strategic direction count and default to 3 when the user delegates to the agent.
      - Prompt-pack artifacts cannot declare ephemeral vision_only validation.
      - Prompt-pack artifacts separate prompt text readiness from image generation and collection status.
      - Templates expose normalized input, strategic core, directions, build recommendation, constraints, and review plan.
      - Validators catch thin strategic prompt packs.
      - Summary health reports missing strategy and direction fields.
    selection:
      selected_change_id: C002-strategic-prompt-pack-artifacts
      reason: >
        Select C002 directly within M86 because C001 is complete and C002
        encodes the source behavior requirements into artifact schema,
        templates, validators, and summary quality.
      selected_at: 2026-05-22
    completion:
      completed_change_id: C002-strategic-prompt-pack-artifacts
      completed_at: 2026-05-22
      commit: b00a12b
      evidence:
        - changes/M86-proto-strategy-prompt-compiler/C002-strategic-prompt-pack-artifacts/LOCAL_COMMIT_EVIDENCE.yaml
  - id: C003
    status: done
    title: Upgrade generated /ow:proto protocol for strategy-to-prompt compilation
    purpose: >
      Make generated /ow:proto guidance and context packets consume the
      strengthened native build-prototype behavior and prompt-pack artifact
      shape.
    scope:
      includes:
        - command registry protocol updates
        - generated ow-proto skill guidance through sync
        - context packet drift checks
        - verification for validation consumption and strategic directions
        - askUserQuestion behavior for missing strategic direction count
        - batch image generation and evidence collection after prompt text is ready
      excludes:
        - artifact schema changes
        - tune behavior
        - external image API integration
        - HTML or proto2html generation
    owned_paths:
      - packages/core/src/commands/registry.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - .agents/skills/ow-proto/SKILL.md
      - .openworkflow/audit/COMMAND_AUDIT_INDEX.yaml
      - .openworkflow/audit/CONTEXT_PACKETS.yaml
    dependencies:
      - C001
      - C002
    unlocks:
