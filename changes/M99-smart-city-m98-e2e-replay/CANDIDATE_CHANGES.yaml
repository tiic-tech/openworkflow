title: Candidate changes for smart city M98 E2E replay
status: active
source:
  kind: mixed
  refs:
    - user_direction:2026-05-22-create-e2e-branch-before-smart-city-copilot-test
    - changes/M98-dailin-grade-vision2prompt-pipeline/SUMMARY.yaml
    - changes/M98-dailin-grade-vision2prompt-pipeline/C006-smart-city-replay/LOCAL_CHANGE_EVIDENCE.yaml
