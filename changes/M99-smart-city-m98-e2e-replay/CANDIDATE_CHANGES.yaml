  summary: >
    M98 C006 proved prompt-pack source completeness with a stored smart city
    replay fixture. This queue owns the next clean E2E step: use the actual
    smart_city_copilot repository to replay the M98 contract through the real
    workflow surface before starting visual reference parity work.
queue_policy:
  branch_boundary: codex/m99-smart-city-m98-e2e-replay
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select the first dependency-free candidate that creates the cleanest real
    target-repo replay path without broadening into provider image generation,
    visual review, proto2html, or motion/storyboard modeling.
  high_risk_rule: >
    If a candidate would mutate remote repositories, publish artifacts, call
    external image providers, delete target evidence, or change production
    workflow semantics beyond replay validation, stop and write
    HIGH_RISK_DECISION_REPORT.md before selection.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Clean target-repo E2E replay of the M98 prompt-pack contract in
    smart_city_copilot, limited to source-completeness verification before image
    generation.
  boundary_type: workflow_slice
  in_scope_rule: >
    Include only branch setup, target-repo replay execution, replay evidence,
    prompt-pack source comparison, and go/no-go recommendation for later visual
    parity work.
  out_of_scope_rule: >
    Do not implement provider-backed image generation, human visual review,
    proto2html, storyboard/motion modeling, production GIS integration, or
    visual reference parity scoring in this queue.
  deferred_features:
    - title: Visual reference parity gate
      reason: >
        Needs a separate artifact contract and visual review method after real
        target-repo prompt-pack source completeness is confirmed.
      suggested_plan_id: M100-prototype-visual-reference-parity-gate
    - title: Storyboard and motion modeling
      reason: >
        The dashboard reference is a state progression and should not be folded
        into prompt-pack source replay.
      suggested_plan_id: M101-prototype-storyboard-motion-model
    - title: Provider-backed image generation benchmark
      reason: >
        External image calls must be a separate explicitly selected benchmark
        after prompt-pack source quality is proven in the target repo.
      suggested_plan_id: M102-provider-image-generation-benchmark
next_recommended_candidate_id: null
