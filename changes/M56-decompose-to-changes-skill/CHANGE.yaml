summary: >
  Add the repo-local decompose-to-changes source skill so broad planning input
  can be transformed into focused candidate change queues before selection or
  implementation begins.
problem: >
  OpenWorkflow self-development needs a repeatable way to split discussion,
  roadmap text, or explicit source artifacts into durable candidate changes
  without crossing into implementation or generated runtime surfaces.
goals:
  - Add `skills/decompose-to-changes/SKILL.md`.
  - Add decomposition reference guidance for source normalization, sizing, ids,
    statuses, and outputs.
  - Dogfood the skill against the current `/ow:proto` redesign discussion.
  - Update M54 candidate status with completion evidence.
non_goals:
  - Do not implement select-change.
  - Do not expose new `/ow:*` runtime commands.
  - Do not implement the `/ow:proto` redesign.
  - Do not edit generated `.agents` or `.openworkflow` surfaces.
