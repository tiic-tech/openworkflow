schema_version: 0.1.0
contract_id: change:M22-project-clean-command
contract_type: change
title: M22 Project clean command
status: completed
source_artifacts:
  - changes/M21-npm-package-release-readiness/CHANGE.yaml
depends_on:
  - change:M21-npm-package-release-readiness
produces:
  - work_items:M22-project-clean-command
summary: >
  Add a project-level cleanup command named openworkflow clean so users can
  remove OpenWorkflow-generated project files without confusing npm package
  uninstall with repository cleanup.
problem: >
  npm install and uninstall correctly add or remove the global openworkflow CLI,
  but there is no explicit project-level cleanup command for files created by
  openworkflow init or sync. Users need a safe way to remove .openworkflow and
  Codex adapter surfaces from a project without accidentally deleting unrelated
  user-authored files.
goals:
  - Add openworkflow clean as the project-level cleanup command.
  - Explain that npm uninstall removes the CLI package, while clean removes project files.
  - Remove .openworkflow and generated Codex adapter surfaces from the target project.
  - Protect user-authored files by relying on generated markers where possible.
  - Provide dry-run output before destructive deletion.
  - Support --root, --tools codex, --force, and --yes flags.
  - Add validation coverage for clean behavior.
non_goals:
  - Do not remove the npm package or global openworkflow binary.
  - Do not delete arbitrary .agents content that is not generated by OpenWorkflow.
  - Do not delete user-authored .codex files unless they contain the OpenWorkflow generated marker and --force permits removal.
  - Do not add aliases named remove or delete in M22.
decisions:
  - Use clean rather than uninstall, remove, or delete because this command cleans generated project surfaces and avoids npm uninstall confusion.
  - Default clean should be non-destructive dry-run unless --yes is provided.
  - .openworkflow is owned by OpenWorkflow and can be removed as a tree after confirmation.
  - .agents/openworkflow-adapter.yaml and .agents/skills/ow-* files should be removed only when generated-by markers match.
  - Empty OpenWorkflow-owned directories may be pruned after generated files are removed.
affected_paths:
  - package.json
  - README.md
  - packages/cli/src/
  - packages/adapters/codex/src/
  - packages/core/src/
  - changes/M22-project-clean-command/
acceptance:
  - openworkflow help lists clean and describes project-level cleanup.
  - openworkflow clean --root <folder> --tools codex defaults to dry-run output.
  - openworkflow clean --root <folder> --tools codex --yes removes .openworkflow.
  - clean removes generated .agents/openworkflow-adapter.yaml and generated .agents/skills/ow-* surfaces.
  - clean does not remove non-generated .agents files without --force.
  - clean reports planned targets, removed targets, skipped targets, and warnings clearly.
  - npm uninstall remains the documented way to remove the global CLI package.
  - Existing validation, runtime surface, workflow E2E, smoke, sync, doctor, CLI validation, and pack dry-run pass.
validation:
  - npm run build
  - npm run validate
  - npm run verify:runtime-surface
  - npm run verify:e2e-workflow
  - npm run verify:clean
  - npm run smoke:init
  - node dist/cli/src/index.js sync --root /tmp/openworkflow-m04-smoke --tools codex
  - node dist/cli/src/index.js doctor --root /tmp/openworkflow-m04-smoke --tools codex
  - npm run validate:cli
  - npm pack --dry-run
