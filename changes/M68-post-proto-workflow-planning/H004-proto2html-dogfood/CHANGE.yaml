summary: >
  Dogfood proto2html source behavior by reconstructing the accepted D02
  Prototype Discovery Flight Deck benchmark-style screen group into a single
  HTML artifact and fidelity report.
problem: >
  H003 runtime exposure is high risk without evidence that the source behavior
  and artifact contract can be consumed by an agent. A bounded dogfood fixture
  should prove the reconstruction handoff before command surfaces are exposed.
goals:
  - Create an accepted benchmark-style input fixture from M66 prototype evidence.
  - Draft a single-file HTML reconstruction inside the dogfood folder.
  - Record fidelity matches, gaps, known limits, and next recommendation.
non_goals:
  - Do not expose runtime command or adapter surfaces.
  - Do not create html2spec outputs.
  - Do not change product direction or generate new prototype images.
