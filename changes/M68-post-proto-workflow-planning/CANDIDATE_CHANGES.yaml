contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M68-post-proto-workflow-planning
title: Candidate changes for post-proto workflow closure
status: active
source:
  kind: mixed
  refs:
    - docs/OW_DEVELOP_PLAN.md
    - changes/M59-proto-redesign-planning-dogfood/SUMMARY.yaml
    - skills/decompose-to-changes/SKILL.md
    - skills/select-change/SKILL.md
queue_policy:
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable H-prefixed ids are assigned once and referenced by select-change.
  feat_boundary: This CANDIDATE_CHANGES queue is the top-level feat; each candidate is a commit-sized change inside this folder.
  selected_artifact_location: changes/M68-post-proto-workflow-planning/<candidate-id>-<slug>/
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - artifact contracts before source behavior
    - source behavior before runtime command exposure
    - one workflow boundary per change
    - HTML reconstruction only after accepted benchmark prototype evidence
    - focused owned paths with automated validation
  avoid:
    - mixing proto2html with html2spec or build planning
    - adding user-facing commands before contracts exist
    - turning proto or tune back into HTML implementation loops
    - broad autonomous runtime changes before production-stage contracts are clear
next_recommended_candidate_id: H003
changes:
  - id: H001
    status: done
    title: Define proto2html artifact contracts
    purpose: >
      Define the durable artifact vocabulary for converting an accepted
      benchmark prototype image into a single HTML reconstruction with fidelity
      evidence.
    scope:
      includes:
        - HTML prototype source-of-truth contract
        - fidelity report contract
        - accepted benchmark image input rules
        - explicit non-goals for product exploration, specs, and production build
      excludes:
        - source skill implementation
        - runtime command registry exposure
        - generated Codex adapter surfaces
        - html2spec or build planning contracts
    owned_paths:
      - references/proto2html-artifact-contracts.md
      - schemas/html-prototype.schema.json
      - packages/core/src/validators/validateRepositoryContracts.ts
      - changes/M68-post-proto-workflow-planning/H001-proto2html-artifact-contracts/
    dependencies: []
    unlocks:
      - H002
      - H003
      - H004
    risk: medium
    size: small
    validation:
      - npm run validate
    acceptance:
      - Proto2html artifacts require an accepted benchmark image or screen group input.
      - HTML output, screenshot evidence, fidelity gaps, and known limits are structured.
      - The contract states that proto2html reconstructs; it does not explore product direction or create specs.
    selection:
      selected_change_id: H001-proto2html-artifact-contracts
      reason: H001 is the root unblocker for the post-proto workflow and keeps runtime exposure out of scope.
      selected_at: 2026-05-21
    completion:
