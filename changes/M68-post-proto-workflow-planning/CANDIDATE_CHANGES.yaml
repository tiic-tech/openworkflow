  - id: H007
    status: candidate
    title: Design lifecycle transaction mechanism
    purpose: >
      Design a transaction layer that lets agents complete a workflow step
      without forgetting register, pointer, summary, and handoff maintenance.
    scope:
      includes:
        - transaction JSON effect model
        - register/update/summarize/handoff sequence contract
        - stop and rollback conditions
        - first-consumer recovery expectations
      excludes:
        - proto2html or html2spec command behavior
        - autonomous loop implementation
        - multi-platform adapter recovery
    owned_paths:
