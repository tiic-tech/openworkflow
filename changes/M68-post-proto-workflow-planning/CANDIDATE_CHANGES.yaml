    unlocks: []
    risk: medium
    size: medium
    validation:
      - npm run validate
    acceptance:
      - Transaction design names exact inputs, effects, blockers, and JSON output.
      - It reduces fragile manual maintenance after artifact creation.
      - It stays design-level and does not change command behavior yet.
