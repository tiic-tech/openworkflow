summary: >
  Define image-first proto artifact contracts before changing source prototype
  or tune behavior.
problem: >
  `/ow:proto` redesign needs stable contracts for strategic prototype prompt
  packs, tune/refined prompt packs, optional validation inputs, and review
  evidence before source skills or runtime surfaces can change safely.
goals:
  - Define proto prompt pack and tune prompt pack artifact shapes.
  - Define validation input behavior when validation artifacts are present or absent.
  - Define review evidence and decision handoff rules.
  - Keep HTML conversion and runtime exposure out of scope.
non_goals:
  - Do not implement source proto behavior.
  - Do not implement tune behavior.
  - Do not remove `ow:validation`.
  - Do not expose runtime command or adapter surfaces.
