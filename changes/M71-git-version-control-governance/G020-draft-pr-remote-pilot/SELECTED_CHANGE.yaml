title: Pilot draft PR remote mutation
status: done
selection_reason: >
  G020 is the approved C step after G019: introduce a disabled-by-default draft
  PR pilot with dry-run payload preview, explicit allow flag, and rollback
  evidence while keeping push, merge, and Issue mutation out of scope.
scope:
  includes:
    - draft-pr pilot core
    - CLI draft-pr action
    - dry-run payload preview
    - explicit --write plus --allow-draft-pr mutation gate
    - managed PR body digest and rollback guidance
    - runtime coverage for preview and blocked write
  excludes:
    - pushing branches
    - PR merge
    - ready-for-review transition
    - Issue mutation
    - force-push, reset, rebase, or destructive branch deletion
owned_paths:
  - packages/core/src/git/draftPrPilot.ts
  - packages/core/src/git/remoteReadonlyPlanner.ts
  - packages/cli/src/commands/gitAutomation.ts
  - packages/cli/src/index.ts
  - packages/cli/src/dev/verifyRuntimeSurface.ts
  - packages/core/src/commands/registry.ts
  - references/git-automation-governance.md
  - .agents/skills/ow-git-automation/
  - .openworkflow/audit/COMMAND_AUDIT_INDEX.yaml
  - changes/M71-git-version-control-governance/G020-draft-pr-remote-pilot/
forbidden_paths:
  - packages/adapters/**
  - .openworkflow/runtime/**
acceptance:
  - Draft PR mutation is disabled by default and requires explicit config.
  - Dry-run output fully previews target repo, branch, base, title, body digest, and rollback.
  - The implementation records before and after evidence for every mutation.
  - Merge, Issue mutation, and destructive git operations remain impossible from this pilot.
validation:
  - npm run validate
  - git diff --check
  - npm run verify:runtime-surface
