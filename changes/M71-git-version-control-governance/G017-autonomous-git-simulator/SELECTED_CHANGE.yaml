source_candidate_id: G017
title: Build read-only autonomous git simulator
status: done
selection_reason: >
  G017 is the approved Option C follow-up after the G016 autonomous contract.
  It proves autonomous push, PR, conflict, merge, evidence, and rollback
  planning without performing remote mutation.
scope:
  includes:
    - read-only autonomous simulator core
    - CLI simulate action
    - ordered local commit analysis
    - queue commit evidence and validation evidence analysis
    - PR-ready summary and rollback plan checks
    - runtime-surface coverage for simulator blockers and no-mutation output
  excludes:
    - pushing branches
    - creating or updating PRs
    - merging PRs
    - mutating GitHub Issues
    - resolving conflicts automatically
owned_paths:
  - packages/core/src/git/autonomousSimulator.ts
  - packages/cli/src/commands/gitAutomation.ts
  - packages/cli/src/index.ts
  - packages/cli/src/dev/verifyRuntimeSurface.ts
  - packages/core/src/commands/registry.ts
  - references/git-automation-governance.md
  - .agents/skills/ow-git-automation/
  - .openworkflow/audit/COMMAND_AUDIT_INDEX.yaml
  - changes/M71-git-version-control-governance/G017-autonomous-git-simulator/
forbidden_paths:
  - packages/adapters/**
  - .openworkflow/runtime/**
  - .openworkflow/changes/**
acceptance:
  - Simulator produces a complete autonomous operation plan without mutation.
  - Simulator handles large local commit ranges through ordered commit evidence.
  - Simulator reports merge blockers, conflict risk, missing validation, and rollback plan gaps.
  - Remote mutation remains impossible from simulator mode.
validation:
  - npm run validate
  - git diff --check
  - npm run verify:runtime-surface
