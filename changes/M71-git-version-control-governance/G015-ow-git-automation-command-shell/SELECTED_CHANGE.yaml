source_plan_id: M71-git-version-control-governance
source_candidate_id: G015
title: Add ow:git-automation command shell with remote approval gates
status: done
selection_reason: >
  G015 is the next high-risk candidate after G014. The user approved the
  managed command shell: local branch, commit, and PR-ready summary automation
  are available, while remote operations produce a plan and remain approval
  gated.
approved_option:
  decided_at: 2026-05-21
  mode: managed_command_shell
  guardrails:
    - managed mode can automate local branch, local commit, and local PR-ready summary actions
    - remote push, PR, Issue, and merge operations require explicit user approval
    - remote handoff must include ordered local commits and operation sequence
    - autonomous mode becomes a separate high-risk follow-up candidate
scope:
  includes:
    - CLI git-automation command shell
    - /ow:git-automation generated skill surface
    - managed vs autonomous governance reference
    - managed remote operation planning without execution
    - runtime-surface coverage for remote refusal and ordered commit handoff
  excludes:
    - autonomous git automation execution
    - pushing branches
    - creating or editing remote PRs
    - merging PRs
    - mutating GitHub Issues
