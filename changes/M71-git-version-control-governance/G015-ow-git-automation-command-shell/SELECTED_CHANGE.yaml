  - .openworkflow/changes/**
acceptance:
  - A command surface exists for approved managed git automation.
  - Generated /ow:git-automation skill and manifest surfaces are in sync.
  - Local branch, commit, and summary actions are exposed through dry-run-first CLI modes.
  - Managed remote mode refuses execution but returns an ordered operation plan.
  - Managed remote handoff includes ordered local commits from a base ref or queue commit evidence.
  - Autonomous mode is refused and deferred to a separate high-risk candidate.
validation:
  - npm run validate
  - git diff --check
  - npm run verify:runtime-surface
