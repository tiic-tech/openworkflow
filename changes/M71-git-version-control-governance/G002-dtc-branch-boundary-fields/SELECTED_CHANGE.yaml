  - candidate_ref: G003
    reason: select-change branch enforcement should consume branch fields created by decompose-to-changes.
  - candidate_ref: G005
    reason: PR-ready summaries should follow the branch boundary contract.
  - candidate_ref: G009
    reason: gh risk boundaries can wait until local branch governance is reflected in DTC.
scope:
  includes:
    - branch naming guidance for new candidate queues
    - queue_policy.branch_boundary guidance
