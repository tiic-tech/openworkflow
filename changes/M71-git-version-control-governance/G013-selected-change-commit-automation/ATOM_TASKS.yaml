    title: Update governance contract
    status: done
    type: document
    owned_paths:
      - references/git-version-control-governance.md
    done_when:
      - The contract says selected changes require at least one local commit.
      - The contract allows follow-up evidence commits without amend.
      - Remote mutation remains outside the local boundary.
  - task_id: T004
    title: Record queue evidence
    status: done
    type: document
    owned_paths:
      - changes/M71-git-version-control-governance/
