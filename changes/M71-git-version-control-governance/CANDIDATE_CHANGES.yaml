schema_version: 0.1.0
contract_id: candidate_changes:M71-git-version-control-governance
contract_type: planning
planning_artifact_type: candidate_changes
plan_id: M71-git-version-control-governance
title: Candidate changes for OpenWorkflow git version control governance
status: active
source:
  kind: planning_discussion
  refs:
    - "user_request: use decompose-to-changes to create a candidate queue for commit, feat, branch, and PR governance"
    - "user_request: consider whether Issues should be included in git governance, whether authorized gh operations should be covered, and whether an analyze-changes skill is needed for cross-queue priority analysis"
    - "discussion: atom task -> implementation checklist; selected change -> commit; CANDIDATE_CHANGES -> feat; feat -> branch; branch -> PR; PR -> merge/release boundary"
    - references/planning-artifact-contracts.md
    - skills/decompose-to-changes/SKILL.md
    - skills/decompose-to-changes/references/decomposition-protocol.md
    - skills/select-change/SKILL.md
    - skills/select-change/references/selection-protocol.md
queue_policy:
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable G-prefixed ids are assigned once and referenced by select-change, completion records, commits, and PR summaries.
  feat_boundary: This CANDIDATE_CHANGES queue is the top-level feat for git version control governance.
  branch_boundary: The owning branch for this feat is codex/m71-git-version-governance.
  selected_artifact_location: changes/M71-git-version-control-governance/<candidate-id>-<slug>/
  commit_policy: Each selected candidate should complete with one coherent git commit whose message references the plan id and candidate id.
  pr_policy: A PR should represent the feat branch, summarize all completed and deferred candidates, and link validation evidence.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - artifact contracts before source skill behavior changes
    - issue source-of-truth rules before gh mutation behavior
    - branch and dirty-tree guards before PR handoff automation
    - cross-queue analysis before selecting across multiple active candidate queues
    - validation before relying on git governance in dogfood mode
    - design-only or report-only treatment for high-risk git automation
  avoid:
    - selecting candidates while a previous selected change has uncommitted implementation work
    - mixing multiple feat queues on one branch without an explicit exception
    - adding destructive git operations to skills
    - creating PR or remote-push automation before branch and commit invariants are validated
    - treating remote GitHub Issues as local files when gh is configured as the source of truth
next_recommended_candidate_id: G010
changes:
  - id: G001
    status: done
    title: Formalize git governance hierarchy in planning contracts
    purpose: >
      Define the canonical relationship between atom tasks, selected changes,
      commits, candidate queues, feats, branches, PRs, and merge boundaries so
      later skill behavior has one shared contract.
    scope:
      includes:
        - version control hierarchy and naming conventions
        - commit message expectations for selected candidates
        - branch ownership expectations for each candidate queue
        - PR scope and summary expectations for completed feat queues
        - explicit non-destructive git operation policy
      excludes:
        - changing decompose-to-changes behavior
        - changing select-change behavior
        - adding runtime git automation
        - creating PRs
    owned_paths:
      - references/planning-artifact-contracts.md
      - references/git-version-control-governance.md
      - changes/M71-git-version-control-governance/G001-git-governance-contract/
    dependencies: []
    unlocks:
      - G002
      - G003
      - G004
      - G005
      - G008
      - G010
    risk: low
    size: small
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - A durable reference defines selected change as commit-sized work.
      - The planning contracts define CANDIDATE_CHANGES as a feat boundary.
      - The contracts state that a feat should have an owning branch.
      - The contracts state that PRs summarize feat branches, not individual atom tasks.
      - The contracts prohibit destructive git operations unless the user explicitly requests them.
    selection:
      selected_change_id: G001-git-governance-contract
      reason: >
        G001 is the next recommended candidate and creates the shared
        version-control contract needed before source skills, Issue governance,
        gh boundaries, or validation can enforce git behavior.
      selected_at: 2026-05-21
    completion:
      completed_by_change_id: G001-git-governance-contract
      completed_at: 2026-05-21
      evidence:
        - references/planning-artifact-contracts.md
        - references/git-version-control-governance.md
        - changes/M71-git-version-control-governance/G001-git-governance-contract/SELECTED_CHANGE.yaml
        - changes/M71-git-version-control-governance/G001-git-governance-contract/ATOM_TASKS.yaml
        - "validation: npm run validate"
        - "validation: git diff --check"
  - id: G002
    status: ready
    title: Add branch boundary fields to decompose-to-changes outputs
    purpose: >
      Teach decompose-to-changes to record branch ownership when it creates a
      new feat queue, making the branch boundary explicit in YAML, Markdown,
      and summary artifacts.
    scope:
      includes:
        - branch naming guidance for new candidate queues
        - queue_policy.branch_boundary guidance
        - summary output for the owning branch
        - dirty-tree note behavior before creating a new queue
        - non-automatic branch creation guidance unless already performed by the agent
      excludes:
        - select-change branch enforcement
        - automatic git checkout or branch creation inside skill instructions
        - PR creation behavior
    owned_paths:
      - skills/decompose-to-changes/SKILL.md
      - skills/decompose-to-changes/references/decomposition-protocol.md
      - changes/M71-git-version-control-governance/G002-dtc-branch-boundary-fields/
    dependencies:
      - G001
    unlocks:
      - G004
      - G006
    risk: medium
    size: medium
    validation:
      - python3 /Users/archy/.codex/skills/.system/skill-creator/scripts/quick_validate.py skills/decompose-to-changes
      - npm run validate
      - git diff --check
    acceptance:
      - decompose-to-changes tells agents to capture the feat branch in queue policy.
      - decompose-to-changes distinguishes new feat queue creation from queue maintenance on an existing branch.
      - decompose-to-changes records dirty-tree observations without widening into implementation.
      - Markdown and SUMMARY expectations include the branch boundary.
  - id: G003
    status: ready
    title: Add branch and dirty-tree guards to select-change
    purpose: >
      Teach select-change to verify the current branch and working tree before
      selecting a candidate so one selected change does not blur into another
      uncommitted change or the wrong feat branch.
    scope:
      includes:
        - current branch check against queue_policy.branch_boundary
        - dirty-tree guard for uncommitted previous selected change work
        - explicit allowed exceptions for planning-only queue maintenance
        - completion expectation that the selected candidate lands as one commit
      excludes:
        - automatic commit creation
        - branch switching
        - PR creation
        - validator implementation
    owned_paths:
      - skills/select-change/SKILL.md
      - skills/select-change/references/selection-protocol.md
      - changes/M71-git-version-control-governance/G003-select-branch-dirty-guards/
    dependencies:
      - G001
    unlocks:
      - G004
      - G006
    risk: medium
    size: medium
    validation:
      - python3 /Users/archy/.codex/skills/.system/skill-creator/scripts/quick_validate.py skills/select-change
      - npm run validate
      - git diff --check
    acceptance:
      - select-change checks whether the current branch matches the queue branch boundary.
      - select-change stops or reports when an unrelated dirty tree would contaminate a new selected change.
      - select-change does not perform git mutations itself.
      - selection artifacts describe the expected commit boundary.
  - id: G004
    status: candidate
    title: Validate git governance fields and completion evidence
    purpose: >
      Extend repository validation so planning queues can enforce required git
      governance fields and completed candidates can carry commit evidence in a
      consistent shape.
    scope:
      includes:
        - validation for queue_policy.branch_boundary when present
        - validation for selected candidate completion commit evidence when done
        - negative runtime-surface coverage for malformed git governance fields
        - compatibility with existing queues that predate branch governance
      excludes:
        - forcing every historical queue to add branch fields immediately
        - git command execution
        - PR creation
    owned_paths:
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - changes/M71-git-version-control-governance/G004-git-governance-validation/
    dependencies:
      - G001
      - G002
      - G003
    unlocks:
      - G006
    risk: medium
    size: medium
    validation:
      - npm run validate
      - git diff --check
      - npm run verify:runtime-surface
    acceptance:
      - Repository validation accepts the new M71 queue shape.
      - Repository validation catches malformed branch boundary fields in generated fixtures.
      - Runtime-surface verification includes at least one negative case for git governance metadata.
      - Historical queues remain valid unless they opt into the new fields incorrectly.
  - id: G005
    status: ready
    title: Define feat completion and PR-ready summary artifact
    purpose: >
      Create a lightweight artifact contract for completing a candidate queue as
      a feat branch and preparing a PR summary without requiring the agent to
      open a PR automatically.
    scope:
      includes:
        - FEATURE_SUMMARY.md or PR_READY_SUMMARY.md contract
        - completed, deferred, blocked, and high-risk candidate summary fields
        - validation command evidence expectations
        - branch and commit list expectations
      excludes:
        - GitHub API usage
        - automatic PR creation
        - release automation
    owned_paths:
      - references/planning-artifact-contracts.md
      - references/git-version-control-governance.md
      - changes/M71-git-version-control-governance/G005-pr-ready-summary-contract/
    dependencies:
      - G001
    unlocks:
      - G006
      - G007
    risk: low
    size: small
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - A PR-ready summary contract exists and is linked from planning contracts.
      - The contract explains how to summarize candidate completion status.
      - The contract records branch name, commit evidence, validation evidence, and unresolved risks.
      - The contract does not require automatic PR creation.
  - id: G006
    status: candidate
    title: Add dogfood fixtures for branch-per-feat workflow
    purpose: >
      Add focused dogfood fixtures and examples that show a clean feat branch,
      selected change commit, completion evidence, and PR-ready summary flow.
    scope:
      includes:
        - example queue metadata with branch boundary
        - example completed candidate with commit evidence
        - example PR-ready summary or summary linkage
        - validation fixtures that protect against stale or contradictory metadata
      excludes:
        - changing actual git history
        - opening PRs
        - broad generated-surface regeneration
    owned_paths:
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - changes/M71-git-version-control-governance/G006-branch-per-feat-dogfood-fixtures/
    dependencies:
      - G002
      - G003
      - G004
      - G005
    unlocks: []
    risk: medium
    size: medium
    validation:
      - npm run validate
      - git diff --check
      - npm run verify:runtime-surface
    acceptance:
      - Runtime-surface verification exercises branch-per-feat metadata.
      - Fixtures prove a completed selected change can be audited back to a commit.
      - Fixtures prove a feat summary can be audited back to the candidate queue.
      - The fixture scope remains planning-only and does not mutate git history.
  - id: G007
    status: candidate
    title: Decide whether OW should automate git and gh mutation operations
    purpose: >
      Produce a high-risk decision packet for any future move from planning
      guidance into automated git or GitHub mutations, including branch
      creation, commits, pushes, issue edits, issue closure, and PR creation.
    scope:
      includes:
        - trust and safety risks for automated local git mutations
        - trust and safety risks for authenticated gh remote mutations
        - user approval models for branch creation, commit, push, issue edits, issue closure, and PR creation
        - recommended default of report-first or explicit-approval-only behavior
        - guardrails for destructive or remote operations
      excludes:
        - implementing git or gh automation
        - invoking GitHub APIs
        - pushing branches
        - editing or closing GitHub Issues
        - opening PRs
    owned_paths:
      - changes/M71-git-version-control-governance/HIGH_RISK_DECISION_REPORT.md
      - changes/M71-git-version-control-governance/G007-git-automation-high-risk-decision/
    dependencies:
      - G001
      - G005
      - G009
    unlocks: []
    risk: high
    size: medium
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - A high-risk decision report exists before any git or gh mutation automation is selected.
      - The report separates branch creation, local commit, push, issue mutation, and PR creation decisions.
      - The report defines explicit user approval conditions and stop criteria.
      - No automated git or gh mutation implementation is performed by this candidate.
  - id: G008
    status: done
    title: Formalize Issue governance and source-of-truth rules
    purpose: >
      Define how OW relates external Issues to local planning queues, including
      when local issue artifacts are git-tracked and when GitHub Issues should
      remain the remote source of truth.
    scope:
      includes:
        - Issue to CANDIDATE_CHANGES relationship model
        - local issue backlog policy when gh is absent or unauthorized
        - GitHub Issue source-of-truth policy when gh is configured
        - linkage fields from issues to plan ids, candidate ids, commits, branches, and PRs
        - drift prevention rules for remote issue bodies and local audit artifacts
      excludes:
        - implementing gh commands
        - creating or editing issues
        - changing select-change behavior
        - changing validator implementation
    owned_paths:
      - references/planning-artifact-contracts.md
      - references/git-version-control-governance.md
      - references/issue-governance.md
      - changes/M71-git-version-control-governance/G008-issue-governance-source-of-truth/
    dependencies:
      - G001
    unlocks:
      - G009
      - G010
    risk: low
    size: small
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - Issue is defined as an intent or problem source, not as a direct selected change.
      - The contract defines when local issue artifacts are tracked in git.
      - The contract defines GitHub Issues as the source of truth when gh is authorized and configured.
      - The contract defines local linkage artifacts that can audit decomposition without duplicating remote issue bodies.
    selection:
      selected_change_id: G008-issue-governance-source-of-truth
      reason: >
        G008 is ready after G001 and defines the Issue source-of-truth model
        needed before gh risk boundaries or cross-queue analysis can depend on
        Issue metadata without creating local/remote drift.
      selected_at: 2026-05-21
    completion:
      completed_by_change_id: G008-issue-governance-source-of-truth
      completed_at: 2026-05-21
      evidence:
        - references/planning-artifact-contracts.md
        - references/git-version-control-governance.md
        - references/issue-governance.md
        - changes/M71-git-version-control-governance/G008-issue-governance-source-of-truth/SELECTED_CHANGE.yaml
        - changes/M71-git-version-control-governance/G008-issue-governance-source-of-truth/ATOM_TASKS.yaml
        - "validation: npm run validate"
        - "validation: git diff --check"
  - id: G009
    status: ready
    title: Define gh issue and PR operation risk boundaries
    purpose: >
      Define which gh operations OW may treat as read-only, evidence-writing,
      or high-risk mutation so future GitHub integration can be governed before
      implementation.
    scope:
      includes:
        - read-only gh operations for issues and PRs
        - medium-risk evidence operations such as comments, labels, or PR body suggestions
        - high-risk mutation operations such as issue creation, body edits, closure, push, PR creation, and merge
        - explicit authorization and configuration prerequisites
        - local audit expectations for every remote mutation
      excludes:
        - implementing gh commands
        - opening PRs
        - creating, editing, or closing issues
        - replacing the high-risk report gate for mutation automation
    owned_paths:
      - references/git-version-control-governance.md
      - references/issue-governance.md
      - references/gh-operation-governance.md
      - changes/M71-git-version-control-governance/G009-gh-operation-risk-boundaries/
    dependencies:
      - G001
      - G008
    unlocks:
      - G007
    risk: medium
    size: medium
    validation:
      - npm run validate
      - git diff --check
    acceptance:
      - gh operations are classified into read-only, evidence-writing, and mutation tiers.
      - The contract requires user authorization and configured gh before any gh-dependent workflow.
      - High-risk remote mutations remain behind HIGH_RISK_DECISION_REPORT.md and explicit approval.
      - Local audit artifacts remain the OW-owned record even when GitHub is the remote source of truth.
  - id: G010
    status: ready
    title: Create analyze-changes skill for cross-queue priority analysis
    purpose: >
      Add a read-only planning skill that compares multiple active
      CANDIDATE_CHANGES queues and recommends the next plan id and candidate id
      without selecting or implementing it.
    scope:
      includes:
        - skill boundary between decompose-to-changes, analyze-changes, and select-change
        - cross-queue readiness, dependency, risk, branch, dirty-tree, and unlock analysis
        - CHANGE_ANALYSIS.yaml and CHANGE_ANALYSIS.md artifact expectations
        - handoff shape that select-change can consume
        - high-risk stop reporting when the best next candidate is high risk
      excludes:
        - implementing selected changes
        - mutating candidate queues except for optional analysis evidence links
        - performing git or gh mutations
        - replacing select-change selection artifacts
    owned_paths:
      - skills/analyze-changes/SKILL.md
      - skills/analyze-changes/references/analysis-protocol.md
      - references/planning-artifact-contracts.md
      - changes/M71-git-version-control-governance/G010-analyze-changes-skill/
    dependencies:
      - G001
      - G008
    unlocks: []
    risk: medium
    size: medium
    validation:
      - python3 /Users/archy/.codex/skills/.system/skill-creator/scripts/quick_validate.py skills/analyze-changes
      - npm run validate
      - git diff --check
    acceptance:
      - analyze-changes is defined as read-only priority analysis across one or more candidate queues.
      - The skill outputs a recommended target_plan_id and target_candidate_id with rejected alternatives.
      - The skill reports branch and dirty-tree constraints before recommending implementation.
      - The skill hands off to select-change without creating SELECTED_CHANGE.yaml itself.
