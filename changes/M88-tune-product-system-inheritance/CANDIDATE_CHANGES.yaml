  - id: C003
    status: selected
    title: Add refined prompt pack validator stress fixtures
    purpose: >
      Pressure-test /ow:tune artifacts so validators reject product-system drift,
      missing baseline audits, orphan screen prompts, and unbound target screens.
    scope:
      includes:
        - valid refined prompt-pack fixture
        - missing baseline audit fixture
        - orphan target screen fixture
        - missing MUST_INHERIT or MUST_REMOVE fixture
        - validator messages useful for repair
      excludes:
        - generated prototype images
        - browser visual review
        - async agent execution
        - production design/spec artifacts
    owned_paths:
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - changes/M88-tune-product-system-inheritance/
    dependencies:
      - C001
      - C002
    unlocks:
      - C004
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Tests pass a complete refined prompt pack with baseline audit, product system, delta rules, and screen-bound prompts.
      - Tests reject refined prompt packs without baseline_screen_audit.
      - Tests reject target screen prompts not represented in screen_manifest.
      - Tests reject tune artifacts that omit required inheritance or removal rules when changes are requested.
      - Failure output points back to the missing tune repair artifact section.
    selection:
      selected_change_id: C003-refined-prompt-pack-validator-fixtures
      reason: >
        Select C003 through ow-select-change single-queue ranking. C001 and
        C002 are complete, C003 is the next ready candidate, and validator
        stress fixtures are required before multi-round tune inheritance work.
      selected_at: 2026-05-22
  - id: C004
    status: candidate
    title: Support multi-round tune baseline inheritance
    purpose: >
      Make /ow:tune preserve the latest approved prototype group and locked
      elements across repeated tune passes without silently reverting to stale
      source screens.
    scope:
      includes:
        - latest baseline resolution guidance
        - locked element carry-forward fields
        - accepted improvement preservation
        - cumulative drift guard
        - generated-surface verification for multi-round tune behavior
      excludes:
        - async subagent runtime
        - image generation execution
        - visual diff tooling
        - production design/spec work
    owned_paths:
      - packages/core/src/artifacts/registry.ts
      - packages/core/src/commands/registry.ts
      - packages/cli/src/dev/verifyWorkflowE2E.ts
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - changes/M88-tune-product-system-inheritance/
    dependencies:
      - C001
      - C002
      - C003
    unlocks:
      - M89-built-in-agent-team-internal-stages
      - M90-discovery-loop-e2e-dogfood
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - npm run verify:e2e-workflow
      - npm run verify:runtime-surface
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Tune artifacts can identify the latest approved baseline group.
      - Locked screens or elements carry forward unless explicitly unlocked.
      - Accepted improvements from prior tune passes are preserved.
      - Multi-round tune guidance forbids cumulative product drift.
      - Generated /ow:tune surfaces expose the latest-baseline rule.
