queue_policy:
  branch_boundary: codex/m73-workflow-blueprint-runtime-alignment
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  prefer:
    - makes /ow:tune preserve product-system continuity across prototype refinement
    - absorbs prototype_tune_to_refined_prompt as native OW contracts and protocol
    - keeps refined prompt output text-first and screen-bound
    - records inheritance and delta rules for downstream generation agents
    - preserves internal decision audit behavior
  avoid:
    - generating prototype images or calling external generation APIs
    - changing /ow:proto strategic prompt generation
    - adding async subagent execution
    - creating proto2html, html2spec, or production implementation artifacts
    - broadening into full discovery-loop E2E dogfood
scope_control:
  current_boundary: >
    Align /ow:tune around product-system inheritance and screen-bound refined
    prompt packs after prototype image or prompt-pack evidence exists.
  boundary_type: command_surface
  in_scope_rule: >
    Include only candidates needed for /ow:tune to normalize tune inputs, audit
    baseline screens, extract product-system constants, express inheritance and
    delta rules, bind refined prompts to target screens, and verify that
    product drift is caught before downstream generation.
  out_of_scope_rule: >
    Record async built-in agent team execution, proto2html, html2spec,
    production design/spec work, and full discovery-loop E2E dogfood as
    deferred refs. Do not include them in M88.
  deferred_features:
    - title: Map internal commands to built-in subagents
      reason: >
        Async subagent execution should wait until synchronous discovery-loop
        command contracts are stable.
      suggested_plan_id: M89-built-in-agent-team-internal-stages
    - title: Create discovery-loop E2E dogfood fixture
      reason: >
        Full dogfood should wait until tune inheritance contracts and validators
        are stable.
      suggested_plan_id: M90-discovery-loop-e2e-dogfood
    - title: Rebuild proto2html around benchmark prototype input
      reason: >
        Proto2html should consume the selected benchmark prototype after proto
        and tune evidence are reliable.
      suggested_plan_id: M91-proto2html-benchmark-input
next_recommended_candidate_id: null
changes:
  - id: C001
    status: done
    title: Define refined prompt pack inheritance contract
    purpose: >
      Encode the native /ow:tune artifact contract for baseline screen audit,
      product-system extraction, inheritance and delta rules, screen mapping,
      refined prompt manifest, generation order, and acceptance checklist.
    scope:
      includes:
        - refined prompt pack template fields
        - baseline input normalization fields
        - product_system stable constants and adaptable variables
        - MUST_INHERIT, MUST_ADD, MUST_REMOVE, and FLEXIBLE_CHANGE rules
        - screen-level source-to-target mapping
        - screen-bound refined prompt fields and acceptance criteria
      excludes:
        - generated /ow:tune skill updates
        - validator stress fixtures
        - image generation
        - multi-round latest-baseline resolution
    owned_paths:
      - packages/core/src/artifacts/registry.ts
      - schemas/proto-prompt-pack.schema.json
      - schemas/prototype-evidence.schema.json
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
      - changes/M88-tune-product-system-inheritance/
    dependencies: []
    unlocks:
      - C002
      - C003
      - C004
    risk: medium
    size: medium
    validation:
      - npm run build
      - npm run validate
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - Refined prompt-pack artifacts can record normalized tuning input and baseline source references.
      - Refined prompt-pack artifacts can record baseline_screen_audit for every source screen.
      - Refined prompt-pack artifacts can record product_system constants and adaptable variables.
      - Delta rules include MUST_INHERIT, MUST_ADD, MUST_REMOVE, and FLEXIBLE_CHANGE buckets.
      - Screen prompts are bound to target_screen_id and source_screen_ids with acceptance criteria.
    selection:
      selected_change_id: C001-refined-prompt-pack-inheritance-contract
      reason: >
        Select C001 through ow-select-change single-queue ranking. It is the
        next recommended ready candidate, has no dependencies, and defines the
        artifact contract required before generated /ow:tune protocol and
        validator fixture work.
      selected_at: 2026-05-22
    completion:
      completed_change_id: C001-refined-prompt-pack-inheritance-contract
      completed_at: 2026-05-22
      commit: 9b8ac08
      evidence:
