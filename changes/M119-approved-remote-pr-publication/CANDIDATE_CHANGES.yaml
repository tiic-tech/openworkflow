changes:
  - id: C001
    status: done
    title: Refresh remote publication preflight and choose the first pilot
    purpose: >
      Convert the M118 read-only remote publication plan into a current, exact preflight packet for
      the first branch that can safely be pushed and opened as a draft PR after explicit approval.
    scope:
      includes:
        - verify the working tree and current branch state before any remote operation planning
        - refresh remote visibility for origin/main and candidate branch refs
        - verify gh authentication and repository target
        - rerun git-automation remote-plan for the candidate queues under consideration
        - record the first pilot branch, target base, blockers, and exact operation approval text
      excludes:
        - pushing branches
        - creating, editing, or merging PRs
        - mutating GitHub Issues
        - moving branch pointers or rewriting history
    owned_paths:
      - changes/M119-approved-remote-pr-publication/
      - changes/M102-selected-change-commit-gate/PR_READY_SUMMARY.md
      - changes/M117-git-automation-remote-readiness/PR_READY_SUMMARY.md
    dependencies:
      []
    unlocks:
      - C002
      - C003
      - C004
    risk: medium
    size: small
    validation:
      - git status --short --branch
      - git remote -v
      - gh auth status
      - node dist/cli/src/index.js git-automation remote-plan --root . --queue <target-queue> --base origin/main --remote origin --target-base main --json
      - git diff --check
    acceptance:
      - A current preflight packet names one first pilot branch or records why no branch is ready.
      - Every blocker is specific enough to resolve before push or draft PR creation.
      - The packet names exact commands that still require user approval.
      - No remote or destructive git mutation occurs.
    selection:
      selected_change_id: M119-C001-refresh-remote-publication-preflight
      selected_at: 2026-05-23
      reason: >
        Selected first because M119 must refresh current remote, branch, gh authentication, and
        remote-plan evidence before any high-risk push or draft PR candidate can be considered.
      artifacts:
        selected_change: changes/M119-approved-remote-pr-publication/C001-refresh-remote-publication-preflight/SELECTED_CHANGE.yaml
        atom_tasks: changes/M119-approved-remote-pr-publication/C001-refresh-remote-publication-preflight/ATOM_TASKS.yaml
        implementation_brief: changes/M119-approved-remote-pr-publication/C001-refresh-remote-publication-preflight/IMPLEMENTATION_BRIEF.md
    completion:
