queue_policy:
  branch_boundary: codex/m119-approved-remote-pr-publication
  branch_note: >
    Proposed by DTC, then created locally before selecting C001. The branch has not been pushed.
    Queue creation happened while the repository was on codex/m118-repo-branch-pr-governance with
    a clean working tree after local commit 34708e0.
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  selected_change_commit_gate: strict
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select C001 first. Before any push or remote PR command is allowed, M119 needs a fresh
    read-only publication preflight that confirms current branch state, remote base visibility,
    branch presence, gh authentication, simulator evidence, and the first publication pilot.
  high_risk_rule: >
    C002 and C003 are high-risk remote mutation candidates. They must not be selected or executed
    until C001 produces a green preflight packet, a HIGH_RISK_DECISION_REPORT.md exists for the
    exact operation boundary, and the user explicitly approves the concrete push or draft PR command.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Remote publication governance for the first reviewable OpenWorkflow feat branches after M118.
  boundary_type: gh_remote_publication_workflow_slice
  in_scope_rule: >
    Include read-only remote readiness refresh, first-pilot ordering, exact push and draft PR
    operation gates, local audit evidence requirements, rollback notes, and post-publication local
    reporting.
  out_of_scope_rule: >
    Do not push, create or edit GitHub PRs, mutate Issues, merge, rebase, reset, force-push, delete
    branches, or rewrite historical commits during DTC queue creation. Historical branch surgery
    remains a separate queue.
  deferred_features:
    - title: Historical branch rewrite or cherry-pick repair
      reason: >
        Splitting old stacked branches can change collaboration semantics and needs a dedicated
        high-risk branch repair queue.
      suggested_plan_id: M120-historical-branch-repair
