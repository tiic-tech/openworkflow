schema_version: 0.1.0
contract_id: selected_change:M119-C003-create-approved-draft-pr
contract_type: planning
planning_artifact_type: selected_change
selected_change_id: M119-C003-create-approved-draft-pr
source_plan_id: M119-approved-remote-pr-publication
source_candidate_id: C003
title: Create an explicitly approved draft PR for the pushed pilot branch
status: selected
selection_reason: >
  C003 was selected after C002 pushed and verified the approved M102 pilot branch, no matching PR
  existed, and the user explicitly approved the concrete draft PR creation command.
approved_operation:
  approved_at: 2026-05-23
  approval_source: user_input:2026-05-23-approved-exact-draft-pr-command
  command: gh pr create --draft --repo tiic-tech/openworkflow --base main --head codex/m102-selected-change-commit-gate --title "OpenWorkflow M102-selected-change-commit-gate" --body-file changes/M102-selected-change-commit-gate/PR_READY_SUMMARY.md
  repo: tiic-tech/openworkflow
  base: main
  head: codex/m102-selected-change-commit-gate
  body_file: changes/M102-selected-change-commit-gate/PR_READY_SUMMARY.md
scope:
  includes:
    - verify the pushed remote branch exists
    - verify no matching head/base PR exists before creation
    - use the matching local PR_READY_SUMMARY.md as the PR body source
    - execute one approved gh pr create --draft command
    - record the PR URL, base branch, head branch, body source, approval source, and rollback notes
  excludes:
    - marking the PR ready for review
    - editing unrelated PRs
    - merging or closing PRs
    - mutating Issues or labels
owned_paths:
  - changes/M119-approved-remote-pr-publication/
  - changes/M102-selected-change-commit-gate/PR_READY_SUMMARY.md
forbidden_paths:
  - .git/
  - .openworkflow/**
  - .agents/**
  - package.json
  - src/**
  - tests/**
acceptance:
  - Exactly one draft PR is created from the approved pushed branch.
  - Local audit evidence records the PR URL and body source.
  - No merge, ready-for-review transition, Issue mutation, or broad PR edit occurs.
validation:
  - git status --short --branch
  - git ls-remote --heads origin main codex/m102-selected-change-commit-gate
  - gh pr list --repo tiic-tech/openworkflow --head codex/m102-selected-change-commit-gate --base main --json number,url,state,isDraft,title,headRefName,baseRefName
  - gh pr create --draft --repo tiic-tech/openworkflow --base main --head codex/m102-selected-change-commit-gate --title "OpenWorkflow M102-selected-change-commit-gate" --body-file changes/M102-selected-change-commit-gate/PR_READY_SUMMARY.md
  - gh pr view https://github.com/tiic-tech/openworkflow/pull/4 --json url,state,isDraft,baseRefName,headRefName,title,number
rejected_alternatives:
  - id: ready_pr
    reason: C003 approval covered draft PR creation only, not ready-for-review transition.
  - id: pr_edit_or_merge
    reason: Editing, merging, closing, or marking ready remains out of scope.
