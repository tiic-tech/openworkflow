changes:
  - id: C001
    status: ready
    title: Refresh M71 remote publication preflight
    purpose: >
      Produce a current read-only preflight packet for publishing the M71 historical branch,
      including local branch head, base ancestry, ahead count, conflict probe, remote branch
      presence, existing PRs, and recommended execution model.
    scope:
      includes:
        - verify M71 local branch and PR_READY_SUMMARY.md
        - verify origin/main ancestry and ahead count
        - verify remote target branch absence or head
        - verify existing PRs for the M71 head branch
        - recommend whether M71 can proceed to a high-risk push decision
      excludes:
        - push
        - draft PR creation
        - PR ready-for-review transition
        - merge, PR edit, PR close, Issue mutation, rebase, reset, force-push, or branch deletion
    owned_paths:
      - changes/M122-m71-historical-stack-publication/
    dependencies: []
    unlocks:
      - C002
      - C005
    risk: medium
    size: small
    validation:
      - git status --short --branch
      - git rev-parse origin/main codex/m71-git-version-governance
      - git merge-base origin/main codex/m71-git-version-governance
      - git rev-list --count origin/main..codex/m71-git-version-governance
      - git merge-base --is-ancestor origin/main codex/m71-git-version-governance
      - git merge-tree origin/main codex/m71-git-version-governance
      - git ls-remote --heads origin codex/m71-git-version-governance
      - gh pr list --repo tiic-tech/openworkflow --head codex/m71-git-version-governance --state all --json number,url,state,isDraft,title,headRefName,baseRefName,headRefOid,baseRefOid
      - git diff --check
    acceptance:
      - A durable preflight packet names current M71 publication facts.
      - The packet states whether M71 can proceed to an exact high-risk push decision.
      - No remote or destructive git mutation occurs.
  - id: C002
    status: candidate
    title: Prepare M71 push decision and isolated execution preflight
    purpose: >
      Convert C001 facts into a high-risk decision report for pushing the M71 branch and, if needed,
      an isolated worktree preflight that can safely execute the exact target-branch push after
      approval.
    scope:
      includes:
        - exact push command for codex/m71-git-version-governance
        - current local and remote refs
        - historical-stack acceptance rationale
        - stop criteria and rollback guidance
        - isolated worktree or equivalent execution model if branch identity differs
      excludes:
        - executing push
        - draft PR creation
        - merge, PR edit, PR close, Issue mutation, rebase, reset, force-push, or branch deletion
    owned_paths:
      - changes/M122-m71-historical-stack-publication/
      - changes/M122-m71-historical-stack-publication/HIGH_RISK_DECISION_REPORT.md
    dependencies:
      - C001
    unlocks:
      - C003
      - C005
    risk: high
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The decision packet names exactly one M71 push command.
      - The packet states that it is evidence, not approval.
      - The packet blocks execution until exact user approval is received.
