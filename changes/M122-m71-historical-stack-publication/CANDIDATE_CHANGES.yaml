    Select C001 first. M122 must refresh current M71 remote publication facts before creating any
    push or draft PR approval packet.
  high_risk_rule: >
    C002, C003, and C004 contain or prepare high-risk remote mutation boundaries. Exact push and
    draft PR commands must be captured in a high-risk decision report and approved explicitly before
    execution.
scope_control:
  current_boundary: >
    Approval-gated publication of the existing M71 branch as one historical stack review branch.
  boundary_type: git_remote_publication_workflow_slice
  in_scope_rule: >
    Include read-only publication preflight, high-risk decision packets, approved push of only the
    M71 target branch, approved draft PR creation, and local audit evidence.
  out_of_scope_rule: >
    Do not merge PRs, mark PRs ready for review, edit or close existing PRs, mutate Issues, publish
    M101-derived shared branches, force-push, delete remote branches, rebase, reset, cherry-pick,
    split M71 history, or change product source in this queue.
  deferred_features:
    - title: PR #4 M102-specific readiness governance
      reason: PR #4 was deferred by M123 and belongs to an older M102 flow.
      suggested_plan_id: M125-m102-pr4-readiness-governance
    - title: Shared M101-derived branch publication strategy
      reason: M105, M106, and M115 need a separate shared-stack or split decision before publication.
      suggested_plan_id: M124-shared-branch-publication-strategy
