      summary: >
        Added branch identity assessment for plan-token ownership, made resume
        report feat ownership separately from branch equality, made
        git-automation commit refuse stale branch ownership without an explicit
        temporary continuation exception, documented the policy, and added
        RED/GREEN runtime coverage.
      validation:
