        atom_tasks: changes/M114-engineering-quality-foundation/C008-enforce-feat-scoped-branch-identity/ATOM_TASKS.yaml
        implementation_brief: changes/M114-engineering-quality-foundation/C008-enforce-feat-scoped-branch-identity/IMPLEMENTATION_BRIEF.md
    completion:
      completed_at: 2026-05-23
      implementation_changed_files: true
      evidence:
