selection_policy:
  next_selection_rule: >
    M114 has resumed after M115 internal coder quality governance completed.
    Select and complete C002 because C001 has completed the trust-domain
    taxonomy needed before changing validation behavior, path safety helpers,
    verifier structure, or typed protocol ownership.
  high_risk_rule: >
    Candidates that change public CLI JSON semantics, generated adapter output,
    broad validation pass/fail behavior, or release gate policy become high
    risk and require a decision report before selection.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Engineering-quality foundation for trust-gate coherence and validation
    domain separation.
  boundary_type: repository_quality_foundation
  in_scope_rule: >
    Include only quality governance changes that reduce false trust, contract
    duplication, unsafe mutation, validation ambiguity, oversized-validator
    risk, brittle verifier assertions, or entry-command scan opacity.
  out_of_scope_rule: >
    Do not advance product-stage features, rename/productization work,
    provider-backed generation, SOUL/MEMORY implementation, adapter expansion,
    or broad aesthetic cleanup in this queue.
  deferred_features:
    - title: Product-stage feature expansion
      reason: >
        M107-M111 and M70 remain valuable, but current repo quality governance
        outranks them until trust-domain coherence is under control.
      suggested_plan_id: M107-through-M111-after-quality-foundation
    - title: Full typed command and artifact model migration
      reason: >
        C006 should start with one family; a full migration across all command
        and artifact contracts requires a later queue after the first model is
        proven.
      suggested_plan_id: M115-typed-contract-model-migration
    - title: Complete god-file decomposition
      reason: >
        C004 should extract one high-churn validation domain first; splitting
        all large files is too broad for a single queue.
      suggested_plan_id: M116-validator-and-verifier-decomposition
next_recommended_candidate_id: C003
quality_baseline:
  trust_commands:
    - command: node dist/cli/src/index.js handoff --root . --json
      status: pass
    - command: node dist/cli/src/index.js inspect --root . --strict --json
      status: pass
    - command: npm run validate
      status: fail
      failure_domains:
        - historical planning artifacts
        - malformed YAML
        - selected-change atom task shape
        - commit evidence artifacts
        - high-risk report sections
        - example prompt-pack shape
  quality_snapshot:
    command: node /Users/archy/.codex/skills/ow-code-quality-governor/scripts/ow_quality_snapshot.mjs /Users/archy/Projects/StartUp/openworkflow
    giant_source_files:
      - packages/cli/src/dev/verifyRuntimeSurface.ts
      - packages/core/src/validators/validateRepositoryContracts.ts
      - packages/core/src/validators/validateOpenWorkflow.ts
      - packages/core/src/commands/registry.ts
      - packages/core/src/artifacts/registry.ts
      - packages/core/src/workflow/summaryHealth.ts
    risk_patterns:
      - type escapes
      - synchronous filesystem checks inside validators
      - raw path-prefix checks
      - substring-heavy structural assertions
changes:
  - id: C001
    status: done
    title: Define validation trust domains and report taxonomy
    purpose: >
      Establish the domain model that explains why handoff and inspect can be
      green while broader repository validation is red, and define how every
      trust command should disclose its validation scope before implementation
      changes alter pass/fail behavior.
    scope:
      includes:
        - define trust domains for entry commands, strict handoff, summary health, source contract validation, generated adapter parity, active queue health, historical archive health, fixture corpus, and release readiness
        - define report taxonomy for failures, warnings, residual historical debt, and newly introduced defects
        - map current commands to their intended domains and non-domains
        - document how Agents should interpret narrower green signals when broader domains are red
        - record the current npm validate red classes as baseline, not as accepted health
      excludes:
        - changing public CLI JSON shape
        - changing validate pass/fail behavior
        - refactoring validators
        - editing generated surfaces
        - fixing historical planning artifacts directly
    owned_paths:
      - docs/OW_ENGINEERING_QUALITY_CC_BASIS.md
      - references/validation-trust-domains.md
      - changes/M114-engineering-quality-foundation/
    dependencies: []
    unlocks:
      - C002
      - C003
      - C004
      - C005
      - C006
      - C007
    risk: medium
    size: small
    validation:
      - npm run build
      - node dist/cli/src/index.js handoff --root . --json
      - node dist/cli/src/index.js inspect --root . --strict --json
      - node dist/cli/src/index.js summaries --root . --strict --json
      - "npm run validate (expected fail: baseline repository quality debt only; no M114 errors)"
      - git diff --check
    acceptance:
      - The taxonomy names each validation and trust domain.
      - Each Agent-facing trust command has an explicit intended domain and non-domain.
      - The current npm validate red classes are recorded as baseline historical/release-readiness debt, not hidden.
      - The taxonomy defines how future commands should expose narrower green signals when broader validation domains are red.
      - No runtime behavior, generated surface, or validator pass/fail behavior changes.
    selection:
      selected_change_id: M114-C001-define-validation-trust-domains-and-report-taxonomy
      selected_at: 2026-05-23
      reason: >
        Selected first because trust-domain taxonomy is the prerequisite for
