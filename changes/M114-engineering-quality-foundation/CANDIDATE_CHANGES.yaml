    mode: temporary_continuation_branch
    approved: true
    allowed_operations:
      - resume
      - commit
    reason: >
      M114 was intentionally created on the already-active M101 continuation
      branch before feat-scoped branch identity was enforceable. This exception
      permits the current governance repair to finish locally while making the
      mismatch explicit in resume and git-automation output.
  source_of_truth: CANDIDATE_CHANGES.yaml
