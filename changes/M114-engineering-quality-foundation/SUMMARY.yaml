risks:
  - id: R001
    level: high
    description: Quality governance could become unbounded cleanup instead of commit-sized contract work.
    mitigation: Keep every candidate tied to one quality defect and one verification story.
  - id: R002
    level: high
    description: Trust-command behavior could change in a way that breaks Agent expectations.
    mitigation: Start with taxonomy; require explicit contract changes before changing public CLI JSON or pass/fail semantics.
  - id: R003
    level: medium
    description: Historical validation debt can obscure regressions introduced by new work.
    mitigation: Classify baseline red domains and prove each candidate with targeted checks.
  - id: R004
    level: medium
    description: Queue branch boundaries can preserve stale continuation branches and allow later selected-change commits on the wrong feat branch.
    mitigation: C008 now makes git-automation fail closed by default and makes resume report feat ownership separately from current branch equality.
