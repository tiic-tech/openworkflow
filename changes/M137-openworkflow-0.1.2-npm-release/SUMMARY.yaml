    - npm run validate
    - npm pack --dry-run --json
    - npm publish --access public
    - npm run verify:e2e-workflow
    - npm run verify:clean
    - openworkflow sync --root . --tools codex --json
    - npm install -g .
    - openworkflow --help
    - openworkflow resume --root . --json
    - npm list -g @tiic-tech/openworkflow --depth=0
  result: >
    Release checks pass and local CLI is updated. Public npm upload is externally blocked.
