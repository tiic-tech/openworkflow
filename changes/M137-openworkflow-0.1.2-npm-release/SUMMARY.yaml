    level: high
    description: npm registry upload requires an authenticated npm identity with publish rights for the @tiic-tech scope.
    mitigation: Authenticate npm or provide an npm publish token, then rerun npm publish --access public from this branch.
  - id: R002
    level: medium
    description: Local system CLI is linked to the repository rather than installed from the unpublished npm artifact.
    mitigation: Reinstall from npm after public 0.1.2 is published.
validation:
