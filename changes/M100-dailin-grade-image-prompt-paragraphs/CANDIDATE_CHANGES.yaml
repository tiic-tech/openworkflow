    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select the first dependency-free candidate that most directly turns the
    qualitative dailin benchmark into enforceable OpenWorkflow prompt-generation
    behavior. Do not start provider image generation or visual review in this
    queue.
  high_risk_rule: >
    If a candidate expands into provider-backed generation, visual scoring,
    proto2html, or broad workflow redesign outside /ow:vision2prompt prompt
    text quality, stop and write HIGH_RISK_DECISION_REPORT.md before selection.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Upgrade only the image-generation prompt paragraphs produced by
    /ow:vision2prompt, especially direction-level prototype prompts and
    screen_prompts[].prompt, so they become dailin-grade high-fidelity prototype
    prompts rather than terse screen-state image instructions.
  boundary_type: workflow_slice
  in_scope_rule: >
    Include prompt paragraph quality contract, schema/validator gates,
    generated /ow:vision2prompt protocol guidance, runtime fixtures, and
    smart_city_copilot replay evidence needed to prove the generated prompt
    text quality.
  out_of_scope_rule: >
    Do not run provider-backed image generation, human visual review,
    visual-reference parity scoring, proto2html, storyboard/motion modeling, or
    unrelated OpenWorkflow source changes in this queue.
  deferred_features:
    - title: Provider-backed image quality benchmark
      reason: >
        This queue stops at prompt text quality. Provider output quality needs a
        later queue after prompt paragraphs are strong enough to test.
      suggested_plan_id: M101-provider-image-generation-benchmark
    - title: Visual reference parity gate
      reason: >
        Reference parity requires generated images or rendered prototypes and a
        visual review method, not just prompt text.
      suggested_plan_id: M102-prototype-visual-reference-parity-gate
    - title: Storyboard and motion progression
      reason: >
        Dailin-level static prompt quality is necessary first, but video-like
        state progression should remain a separate artifact family.
      suggested_plan_id: M103-prototype-storyboard-motion-model
