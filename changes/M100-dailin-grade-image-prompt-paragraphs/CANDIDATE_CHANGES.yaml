    co-founder perspective and design philosophy of a top product manager, not a
    checklist to mechanically fill.
queue_policy:
  branch_boundary: codex/m100-dailin-grade-image-prompt-paragraphs
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
