  summary: >
    M98 and M99 repaired prompt-pack source completeness, but direct comparison
    against dailin OUTPUT_PROMPT shows the actual image-generation prompt
    paragraphs remain too short and state-like. This queue upgrades
    /ow:vision2prompt so generated prompt text itself matches or exceeds dailin's
