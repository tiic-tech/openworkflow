  - Downstream visual parity work is allowed only as a later queue with explicit provider or visual-review authorization.
  - No image-generation or visual-review claims are made in M100.
validation:
  - node dist/cli/src/index.js validate --root . --json
  - node dist/cli/src/index.js summaries --root . --strict --json
  - git diff --check
rejected_alternatives:
