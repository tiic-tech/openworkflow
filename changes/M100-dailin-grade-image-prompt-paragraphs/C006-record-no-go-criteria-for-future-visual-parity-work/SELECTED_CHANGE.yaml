    - visual parity go/no-go facts
    - M97 synthesis update distinguishing prompt text quality from image output quality
    - queue completion state
  excludes:
    - provider-backed image generation
    - human visual review
    - visual reference parity scoring
    - proto2html
    - storyboard or motion modeling
owned_paths:
