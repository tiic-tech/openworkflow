title: Inject senior product-manager philosophy engine into vision2prompt
status: selected
selection_reason: >
  C007 is the queue's next recommended candidate after the user's clarification
  that dailin OUTPUT_PROMPT quality came from a co-founder and senior
  product-manager perspective, with the distilled references serving as tools.
  It is the necessary prerequisite before C003 wires generated guidance, because
  otherwise /ow:vision2prompt can become structurally complete but strategically
  empty.
scope:
  includes:
    - explicit Step 0 perspective engine for /ow:vision2prompt before reference execution
    - guidance that dailin-derived references are tools used by the senior PM perspective, not the source of taste by themselves
    - product thesis, strategic hypothesis, user transformation, differentiated product form, and reason-to-exist requirements for each prototype direction
    - anti-default rules against dashboard/SaaS/screen-inventory outputs when the vision calls for a different form
    - quality rubric language that fails complete-but-soulless prompt paragraphs
    - runtime-surface assertions that generated guidance names the perspective engine before paragraph anatomy
  excludes:
    - provider image execution
    - generated image review
    - proto2html
    - broad product-management framework redesign outside /ow:vision2prompt prompt text quality
owned_paths:
  - packages/core/src/commands/registry.ts
  - skills/build-prototype/SKILL.md
  - skills/build-prototype/references/strategic-prompt-pack-protocol.md
