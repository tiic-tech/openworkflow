acceptance:
  - Generated ow-vision2prompt guidance starts from a co-founder plus senior product-manager perspective before executing reference steps.
  - The protocol states that dailin-derived references are tools of the perspective engine, not a checklist whose completion alone proves quality.
  - Each generated prototype direction must carry a product thesis, target user transformation, distinct product form, and reason it should exist.
  - The rubric rejects prompt paragraphs that satisfy structural dimensions but lack strategic judgment, differentiated imagination, or design philosophy.
  - C003 remains blocked behind this candidate so paragraph wiring cannot proceed without the perspective engine.
validation:
  - npm run build
  - node dist/cli/src/index.js sync --root . --json
  - npm run verify:runtime-surface
  - node dist/cli/src/index.js validate --root . --json
  - node dist/cli/src/index.js summaries --root . --strict --json
  - git diff --check
rejected_alternatives:
