summary: >
  Promote the proven image-first proto and tune behavior into runtime command
  surfaces, artifact contracts, schemas, generated Codex skills, and regression
  verification.
problem: >
  The source skills can now produce strategic and refined prototype prompt packs,
  but the installed OpenWorkflow runtime still exposes the older runnable
  prototype and HTML review contract. Agents using `/ow:proto` or `/ow:tune`
  need the generated surfaces to match the accepted dogfood behavior.
goals:
  - Expose image-first strategic prompt pack behavior through `/ow:proto`.
  - Expose screen-bound refined prompt behavior through `/ow:tune`.
  - Update prototype evidence contracts and summaries for prompt-pack artifacts.
  - Regenerate adapter-managed surfaces through the sync path.
  - Verify runtime, workflow, agent, clean, and repository validation behavior.
non_goals:
  - Do not redesign source skill behavior.
  - Do not remove `/ow:validation`.
  - Do not add automatic validation triggers.
  - Do not add HTML conversion or production implementation behavior.
affected_paths:
  - packages/core/src/commands/registry.ts
  - packages/core/src/artifacts/registry.ts
  - packages/core/src/artifacts/readiness.ts
  - packages/core/src/validators/
