  - changes/M59-proto-redesign-planning-dogfood/
acceptance:
  - Runtime surfaces expose the accepted proto redesign behavior.
  - Generated adapter output is produced through generation paths.
  - Existing init, sync, handoff, check, and context behavior remains healthy.
validation:
