  User asked to advance C001. C001 is the next recommended candidate, has no
  dependencies, is medium risk, and must refresh read-only merge-readiness
  evidence before any merge target sequencing or approval packet can proceed.
source_candidate:
  title: Refresh ready PR merge-readiness inventory
  risk: medium
  size: small
scope:
  includes:
    - inspect PR state, draft flag, head/base refs, OIDs, mergeability, review decision, and status checks
    - verify each remote head branch still exists at the PR head OID
    - inspect base ancestry or merge-tree conflict signal without mutating the worktree
    - record whether any PR has a current blocker for sequencing
  excludes:
    - gh pr merge
    - PR edit, close, retarget, review request, or comment mutation
    - Issue mutation, push, force-push, branch deletion, rebase, reset, split/surgery, or product source changes
