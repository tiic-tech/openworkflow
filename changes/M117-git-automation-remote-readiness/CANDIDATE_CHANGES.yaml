  summary: >
    The user confirmed the governing decision for git automation: complete local automation first,
    do not silently push or merge, but preserve a clear path for future fully managed git operation
    where an Agent can order local commits, branch publication, PR creation or update, checks,
    conflict handling, merge, and rollback evidence. A review found that local branch and commit
    automation is mostly in place, while remote readiness still has gaps: PR summary and remote plan
    do not consume LOCAL_COMMIT_EVIDENCE.yaml, branch identity is not enforced across all
    git-automation modes, draft PR mutation has weak approval and audit binding, and merge conflict
    handling is only prose rather than a structured checkpoint.
queue_policy:
  branch_boundary: codex/m117-git-automation-remote-readiness
  branch_note: >
    Queue created while the repo is on codex/m101-build-proto-prompt-command-split. Before selecting
    implementation candidates, use git-automation branch or an explicit user-approved continuation
    exception so work does not continue on a stale feat branch by accident.
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  selected_change_commit_gate: strict
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select C001 first. Remote readiness depends on one shared evidence reader that can resolve
    LOCAL_COMMIT_EVIDENCE.yaml, primary implementation commits, evidence commits, validation
    evidence, and selected-change provenance before PR summaries, remote plans, simulators, or draft
    PR pilots can be trusted.
  high_risk_rule: >
    C003 and C004 are high-risk because they touch remote PR mutation approval or future merge
    conflict policy. They require an explicit high-risk decision report before selection. No
    candidate in this queue may push, merge, or mutate Issues unless a later approved queue
    explicitly enables that mode.
  recommended_first_candidate_id: C001
high_risk_decision:
  status: approved
  report_path: changes/M117-git-automation-remote-readiness/HIGH_RISK_DECISION_REPORT.md
  approved_option: Option D
  approved_at: 2026-05-23
  approved_by: user
  approval_summary: >
    Approve C003 then C004 as local/read-only hardening only. Do not authorize
    push, PR mutation, Issue mutation, merge, rebase, reset, force-push, or
    working-tree conflict resolution.
  applies_to:
    - C003
    - C004
  approval_required_before_selection: true
  remote_mutation_authorized: false
scope_control:
  current_boundary: >
    Git-automation remote readiness: make local evidence, branch identity, remote PR planning, draft
    PR gating, and merge-conflict checkpoints coherent enough for future fully managed git operation
    without enabling push or merge in this queue.
  boundary_type: git_automation_command_surface
  in_scope_rule: >
    Include only changes that strengthen git-automation evidence consumption, branch/remote target
    identity, explicit approval gates, read-only remote planning, draft PR pilot auditability, and
    structured merge conflict checkpoints.
  out_of_scope_rule: >
    Do not enable autonomous push, ready-for-review PR mutation, issue mutation, gh pr merge, git
    merge, force-push, rebase, or broad GitHub integration.
  deferred_features:
    - title: Fully autonomous remote push and merge execution
      reason: >
        This queue prepares machine-readable prerequisites but does not approve remote mutation or
        merge execution.
      suggested_plan_id: M118-autonomous-git-remote-execution
    - title: GitHub Issue source-of-truth mutation
      reason: >
        Issue mutation has separate governance and should not be bundled with git branch, PR, and
        merge readiness.
      suggested_plan_id: M119-gh-issue-source-of-truth-operations
next_recommended_candidate_id: C003
