source_plan_id: M117-git-automation-remote-readiness
source_candidate_id: C002
title: Apply branch identity governance across git-automation modes
status: completed
selected_at: 2026-05-23
selection_reason: >
  Select C002 after C001 because remote readiness now consumes modern local
  evidence, but every queue-bound git-automation mode must also know whether
  the current branch merely matches the queue boundary or actually owns the
  plan token. This prevents stale continuation branches from becoming false
  remote-readiness signals.
risk_decision:
  risk: medium
  selected_option: >
    Reuse M114's branch identity assessment in branch, remote-plan, simulate,
    and draft-pr reporting. Fail closed for mismatched branch identities unless
    a scoped temporary continuation exception explicitly allows that operation.
    Do not change remote mutation permissions.
scope:
  includes:
    - apply assessBranchIdentity or an equivalent shared gate to branch, remote-plan, simulate, and draft-pr
    - surface branch_matches_current separately from branch_owns_plan in remote readiness reports
    - support explicit temporary continuation exceptions only for scoped operations
    - add runtime verifier coverage for stale branch identity in remote planning modes
  excludes:
    - creating or switching branches automatically during decompose or select-change
    - changing remote mutation permissions
    - migrating historical queues
owned_paths:
  - packages/core/src/git/branchIdentity.ts
  - packages/core/src/git/localGitAutomation.ts
  - packages/core/src/git/remoteReadonlyPlanner.ts
  - packages/core/src/git/autonomousSimulator.ts
  - packages/core/src/git/draftPrPilot.ts
  - packages/cli/src/commands/gitAutomation.ts
  - packages/cli/src/dev/verifyRuntimeSurface.ts
  - changes/M117-git-automation-remote-readiness/
forbidden_paths:
  - .agents/**
  - .openworkflow/**
  - packages/adapters/**
acceptance:
  - Every git-automation mode that reads a queue branch boundary reports whether the boundary owns the plan.
  - Stale branch identities fail closed unless a scoped explicit exception applies.
  - Existing C008 commit behavior remains green.
validation:
  - npm run build
  - targeted branch-identity remote-plan fixture
  - npm run verify:runtime-surface
  - node dist/cli/src/index.js resume --root . --json
  - git diff --check
