  Selected after the user approved high-risk Option D. C003 closes the immediate
  draft PR write-mode approval gap before future remote PR automation can rely
  on the pilot.
risk_decision:
  risk: high
  approved_option: Option D
  approval_source: user_input:2026-05-23-approve-option-d
  report_path: changes/M117-git-automation-remote-readiness/HIGH_RISK_DECISION_REPORT.md
  selected_option: >
    Implement local/read-only hardening only: require explicit approval evidence
    for any write-mode draft PR pilot path, write local audit evidence only when
    a future approved write path is used, and keep preview mode non-mutating.
scope:
  includes:
    - require explicit high-risk approval evidence for write-mode draft PR create or edit
    - record operation kind, target PR URL or number, branch, base, body digest, approval source, timestamp, and rollback guidance locally
    - keep preview mode non-mutating and useful without approval
    - distinguish create, edit, and no-op outcomes in JSON
  excludes:
    - ready-for-review PR mutation
    - PR merge
    - issue mutation
    - pushing branches
    - real gh pr create or gh pr edit execution in this candidate
