key_dependencies:
  - C001 is complete; PR summaries, remote-plan, and simulator now share modern LOCAL_COMMIT_EVIDENCE.yaml reader coverage.
  - C002 is complete; branch identity reports are now attached to branch, remote-plan, simulate, and draft-pr readiness packets.
  - C003 is complete; draft-pr write mode now requires explicit approval evidence and writes local audit evidence on approved fake-gh write coverage.
  - C004 is complete; remote-plan and simulator now expose structured merge-readiness checkpoints with conflict stop evidence.
  - C005 is complete; the integrated verifier now proves the full non-mutating remote-readiness story.
  - M117 has no remaining candidates.
risks:
  - id: R001
    level: high
    description: Draft PR pilot can mutate GitHub state if write mode is approved too loosely.
    mitigation: C003 requires explicit high-risk approval evidence and local operation evidence before any write-mode draft PR mutation.
  - id: R002
    level: high
    description: Merge conflict handling could become unsafe if future automation treats prose guidance as executable policy.
    mitigation: C004 creates a structured read-only conflict checkpoint before any future merge execution queue.
  - id: R003
    level: medium
    description: Remote readiness can report false confidence if it misses LOCAL_COMMIT_EVIDENCE.yaml records.
    mitigation: C001 makes modern local commit evidence the shared source for PR summaries, remote plans, and simulators.
  - id: R004
    level: medium
    description: The queue was created on the existing M101 continuation branch.
    mitigation: Branch boundary is recorded as codex/m117-git-automation-remote-readiness; branch automation or explicit continuation approval is required before implementation.
unresolved_questions:
  - Should merge conflict probes use `git merge-tree`, an isolated temporary worktree, or both?
  - Should future autonomous execution be one queue after C005, or split into push/PR/merge queues?
deferred_features:
  - M118-autonomous-git-remote-execution
  - M119-gh-issue-source-of-truth-operations
validation:
  commands_run:
    - node dist/cli/src/index.js resume --root . --json
    - git status --short --branch
    - npm run build
    - node dist/cli/src/dev/verifyRuntimeSurface.js
    - npm run verify:runtime-surface
    - node dist/cli/src/index.js validate --root . --json
    - node dist/cli/src/index.js summaries --root . --strict --json
    - git diff --check
  notes:
    - C003 runtime-surface coverage uses fake gh and does not execute real remote PR creation or editing.
    - C004 conflict checkpoint coverage uses temporary repositories and does not run git merge against the user's working tree.
    - C005 integrated coverage uses temporary local repositories and a bare remote; no real GitHub network mutation or user repository remote mutation was performed.
    - No generated .agents surface, .openworkflow surface, git push, real PR mutation, Issue mutation, or merge was performed.
