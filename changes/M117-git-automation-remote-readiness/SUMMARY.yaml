title: Summary for git automation remote readiness governance
status: completed
source:
  kind: discussion_and_repo_audit
  summary: >
    This queue captures the follow-up CC requested after reviewing
    git-automation against the prior governance decision: complete local
    automation first, avoid silent push or merge, but make the future fully
    managed git path explicit enough for Agents to publish branches, open or
    update PRs, handle checks and conflicts, merge only after approval, and
    record rollback evidence. The audit found that local branch and commit
    automation is mostly established, while remote readiness still needs shared
    LOCAL_COMMIT_EVIDENCE.yaml readers, branch identity propagation, draft PR
    approval/audit hardening, and structured merge-conflict checkpoints.
  refs:
    - references/git-version-control-governance.md
    - references/gh-operation-governance.md
    - packages/cli/src/commands/gitAutomation.ts
    - packages/core/src/git/localGitAutomation.ts
    - packages/core/src/git/remoteReadonlyPlanner.ts
    - packages/core/src/git/autonomousSimulator.ts
    - packages/core/src/git/draftPrPilot.ts
    - packages/core/src/git/prReadySummary.ts
scope_boundary: >
  Git-automation remote readiness only. The queue strengthens evidence,
  branch identity, read-only remote planning, draft PR gating, conflict
  checkpoints, and verifier coverage without enabling autonomous push, merge,
  rebase, force-push, ready-for-review PR mutation, or Issue mutation.
