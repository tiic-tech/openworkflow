selection_policy:
  next_selection_rule: >
    Select C001 first. The repository needs an auditable inventory of local commits, queue status,
    branch boundaries, PR-ready summaries, remote branch presence, and current blockers before any
    branch creation, branch repair, push, or PR operation can be trusted.
  high_risk_rule: >
    C004 is read-only planning. Any later command that pushes a branch, creates or edits a remote PR,
    mutates Issues, rebases, resets, force-pushes, deletes branches, or merges must stop for explicit
    operation-level user approval and a high-risk decision report.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Repo branch and PR governance recovery after M117: local commit ownership audit, feat-branch
    ownership plan, local PR-ready summaries, and remote push/PR execution plan.
  boundary_type: git_governance_recovery
  in_scope_rule: >
    Include only local planning, local evidence generation, read-only remote inspection, and
    operation plans needed to make existing commits and candidate queues reviewable by feat branch.
  out_of_scope_rule: >
    Do not push, create or edit GitHub PRs, mutate Issues, merge, rebase, reset, force-push, delete
    branches, or rewrite historical commits in this queue without a separate explicit approval gate.
  deferred_features:
    - title: Approved remote push and draft PR execution
      reason: >
        Remote mutation needs operation-level approval after local branch and PR-ready evidence is
        reviewed.
      suggested_plan_id: M119-approved-remote-pr-publication
    - title: Historical branch rewrite or cherry-pick repair
      reason: >
        Reassigning old commits across branches can change collaboration semantics and needs a
        separate high-risk branch surgery decision.
      suggested_plan_id: M120-historical-branch-repair
