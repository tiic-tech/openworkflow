  Select C001 through ow-select-change single-queue ranking. It is the next
  recommended ready candidate, has no dependencies, and defines the post-validate
  artifact contract required before evaluator or generated protocol work.
owned_paths:
  - packages/core/src/artifacts/registry.ts
  - schemas/proto-prompt-pack.schema.json
  - schemas/prototype-evidence.schema.json
