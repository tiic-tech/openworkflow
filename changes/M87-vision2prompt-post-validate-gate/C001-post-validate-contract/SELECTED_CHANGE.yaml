scope:
  includes:
    - post_validate prompt asset contract shape
    - strategic fingerprint dimensions
    - diversity threshold policy
    - bypass rule when resolved direction count is 1
    - failure routing back to /ow:vision2prompt
    - audit fields for pass, fail, and skipped outcomes
  excludes:
    - implementing the comparison algorithm
    - generated /ow:vision2prompt skill updates
    - image generation
    - tune behavior
forbidden_paths:
  - .agents/skills/ow-vision2prompt/SKILL.md
  - .agents/skills/ow-proto/SKILL.md
  - generated prototype image assets
  - /ow:tune command behavior
acceptance:
  - Prompt-pack artifacts can record post_validate.status as pass, fail, or skipped.
  - The contract defines fingerprint dimensions such as product form, trigger, interaction model, emotional driver, retention mechanism, metric, main risk, trust model, and privacy model.
  - The contract requires post_validate to be skipped when the user requested exactly one strategic direction.
  - The contract requires post_validate before /ow:prompt2proto when resolved direction count is 2 or more.
  - Failed diversity gates route back to /ow:vision2prompt instead of starting image generation.
validation:
  - npm run build
  - npm run validate
  - node dist/cli/src/index.js validate --root . --json
  - git diff --check
high_risk:
  approval_required: false
  reason: >
    C001 defines artifact contract shape and validator expectations only. It
    does not expose runtime commands, generate images, call external APIs, or
    alter tune behavior.
