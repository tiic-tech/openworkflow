title: Summary for vision2prompt post-validate gate
status: active
source:
  kind: mixed
  summary: >
    Tracks the bounded post-validate gate after M86. The gate should compare
    prompt assets by normalized strategic fingerprint before /ow:prompt2proto
    starts image generation, while skipping diversity validation when the user
    explicitly requested one strategic direction.
  refs:
    - changes/M86-proto-strategy-prompt-compiler/SUMMARY.yaml
    - docs/OW_DEVELOP_PLAN_Phase2.md
scope_boundary:
  current_boundary: >
    /ow:vision2prompt prompt asset post-validate gate only.
  boundary_type: workflow_slice
  note: >
    This queue handles the quality gate between prompt text generation and
    prototype image generation: fingerprint contract, deterministic comparison,
    generated command guidance, and stress fixtures.
deferred_feature_refs:
  - M88-tune-product-system-inheritance
  - M89-built-in-agent-team-internal-stages
  - M90-discovery-loop-e2e-dogfood
outputs:
  candidate_changes_yaml: changes/M87-vision2prompt-post-validate-gate/CANDIDATE_CHANGES.yaml
  candidate_changes_md: changes/M87-vision2prompt-post-validate-gate/CANDIDATE_CHANGES.md
