schema_version: 0.1.0
contract_id: change:M24-agent-context-state-and-summaries
contract_type: change
title: M24 Agent context state and summaries
status: completed
source_artifacts:
  - changes/M23-production-command-lazy-contracts/CHANGE.yaml
depends_on:
  - change:M23-production-command-lazy-contracts
produces:
  - work_items:M24-agent-context-state-and-summaries
summary: >
  Add the missing low-context agent intelligence layer: a current-state pointer,
  explicit artifact lifecycle status transitions, compact artifact summaries,
  and stronger project identity metadata.
problem: >
  OpenWorkflow now has richer production-stage command contracts, but first
  consumer agents still need to read too many files to determine the current
  workflow position, stale questions can survive after downstream stages are
  created, long artifacts can exceed the intended context budget, and initialized
  projects may have weak identity metadata such as project_title ".". These
  gaps reduce the quality of development intelligence available from a small
  context packet.
goals:
  - Generate or maintain .openworkflow/CURRENT_STATE.yaml with active_stage, current pointers, last decision outcome, next command, blockers, and read_this_first.
  - Define and enforce stage/artifact lifecycle states so stale current_question values and completed draft statuses are updated during stage progression.
  - Add compact SUMMARY.yaml or current_slice metadata for long artifacts so agents default to summaries and load full artifacts only when needed.
  - Improve project identity metadata generated by init, including robust project_slug and project_title defaults.
  - Add a root OpenWorkflow entrypoint such as OPENWORKFLOW.md or AGENT.md only if it can preserve the minimal init contract or is explicitly lazy-created.
  - Preserve M23's lazy-create rule: init must not eagerly create stage directories or stage artifacts.
non_goals:
  - Do not change the semantics of /ow:spec, /ow:change, or /ow:team beyond using the new state/summarization layer.
  - Do not implement automatic artifact authoring for every command as a CLI workflow engine.
  - Do not store raw conversation transcripts in summaries.
  - Do not reintroduce stage-local _templates during init.
decisions:
  - CURRENT_STATE.yaml is workflow/audit-level metadata, so it may be created during init without violating lazy stage artifact creation.
  - Summary artifacts should be derived compact context packets, not replacements for source-of-truth YAML artifacts.
  - Status transitions must be explicit and machine-readable rather than relying on free-text notes.
open_questions:
  - Root OPENWORKFLOW.md remains deferred to preserve the minimal init surface; CURRENT_STATE.yaml is the workflow-level entrypoint.
  - SUMMARY.yaml is represented as summary_policy metadata and is lazy-created with long artifacts, while short artifacts can use current_slice.
  - Lifecycle statuses now include reviewed, accepted, revise_requested, completed, superseded, active, draft, and archived.
affected_paths:
  - packages/core/src/workflow/initOpenWorkflow.ts
  - packages/core/src/artifacts/registry.ts
  - packages/core/src/commands/registry.ts
  - packages/core/src/validators/
  - packages/cli/src/dev/verifyRuntimeSurface.ts
  - packages/cli/src/dev/verifyWorkflowE2E.ts
  - schemas/
  - changes/M24-agent-context-state-and-summaries/
acceptance:
  - Initialized repositories include .openworkflow/CURRENT_STATE.yaml with active_stage, current_* pointers, last_decision, next_command, blocked_by, and read_this_first.
  - CURRENT_STATE.yaml remains workflow-level metadata and does not create stage directories or stage-local artifacts during init.
  - Artifact contracts or validators define lifecycle statuses beyond draft, including accepted, revise_requested, superseded, reviewed, and active where appropriate.
  - Generated command skills instruct agents to update stale current_question and lifecycle status when downstream stages are created or superseded.
  - Long-artifact read policies expose a summary/current_slice path or field, and generated skills load summaries before full artifacts.
  - Init produces stable project_slug/project_title from the target directory instead of ".".
  - Runtime surface and workflow E2E tests cover current-state generation, lifecycle state rules, summary metadata, and metadata quality.
validation:
  - npm run build
  - npm run validate
  - npm run verify:runtime-surface
  - npm run verify:e2e-workflow
  - npm run verify:clean
  - npm run smoke:init
  - npm run validate:cli
updated_at: 2026-05-20
