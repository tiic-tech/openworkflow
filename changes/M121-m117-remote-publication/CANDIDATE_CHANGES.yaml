  summary: >
    M120 ranked M117 as the cleanest next publication candidate after restoring branch-local
    PR-ready evidence. M121 owns the approval-gated publication workflow for that existing M117
    branch: refresh preflight in a cross-branch-safe way, prepare exact high-risk push approval,
    execute only if approved, optionally create a draft PR only after separate approval, and record
    post-publication audit evidence.
queue_policy:
  branch_boundary: codex/m121-m117-remote-publication
  branch_note: >
    Proposed by DTC while the repository was on codex/m120-historical-branch-repair after local
    commit 8a3d807. Branch creation was intentionally not performed during DTC queue creation.
    M121 is a governance branch for publication evidence; its remote publication target is the
    existing M117 feat branch, not the M121 governance branch.
  target_publication_branch: codex/m117-git-automation-remote-readiness
  target_base_branch: main
  target_remote: origin
  source_of_truth: CANDIDATE_CHANGES.yaml
  readable_view: CANDIDATE_CHANGES.md
  id_policy: Stable ids are assigned once and referenced by select-change.
  selected_change_commit_gate: strict
  status_values:
    - candidate
    - ready
    - selected
    - in_progress
    - done
    - blocked
    - deferred
    - superseded
selection_policy:
  next_selection_rule: >
    Select C001 first. M121 must refresh M117 publication facts from the M121 governance context and
    choose a safe execution model before any push or PR operation can be requested.
  high_risk_rule: >
    C002, C003, and C004 are high-risk remote publication boundaries. A HIGH_RISK_DECISION_REPORT.md
    must exist for the exact push or PR operation, and the user must approve the concrete command
    before any remote mutation is executed.
  recommended_first_candidate_id: C001
scope_control:
  current_boundary: >
    Approval-gated remote publication for the existing M117 git automation remote readiness branch.
  boundary_type: gh_remote_publication_workflow_slice
  in_scope_rule: >
    Include M117-specific read-only publication preflight, exact push approval packet, approved
    branch push evidence, optional approved draft PR creation, rollback guidance, and
    post-publication audit.
  out_of_scope_rule: >
    Do not publish M71, mark PR #4 ready for review, split the M101 shared branch group, rebase,
    reset, force-push, delete branches, merge PRs, mutate Issues, or change product source in this
    queue.
  deferred_features:
    - title: Publish M71 historical stack
      reason: >
        M71 is technically remote-ready but carries an older 66-commit historical stack that needs
        explicit acceptance as one coupled review branch.
      suggested_plan_id: M122-m71-historical-stack-publication
    - title: Mark PR #4 ready for review
      reason: >
        Ready-for-review mutates an existing GitHub PR and should remain separate from M117 branch
        publication.
      suggested_plan_id: M123-pr4-ready-review-governance
    - title: Decide M101 shared branch group strategy
      reason: >
        M105, M106, and M115 share a historical branch boundary and need a later shared-stack or
        split decision before publication.
      suggested_plan_id: M124-shared-branch-publication-strategy
observed_state:
  captured_at: 2026-05-23
  current_branch: codex/m120-historical-branch-repair
  working_tree_clean_before_queue_creation: true
  latest_local_commit: 8a3d807
  latest_local_commit_subject: M120-historical-branch-repair/C005 Record publication order
  m120_recommendation: M121-m117-remote-publication
  target_plan_id: M117-git-automation-remote-readiness
