      - simulator evidence is missing
    warnings:
      - remote branch head is absent or unreadable for origin/codex/m117-git-automation-remote-readiness
      - command was read-only and did not mutate remote state
  simulator_from_current_branch:
    ok: false
    blockers:
      - current branch codex/m120-historical-branch-repair does not match branch boundary codex/m117-git-automation-remote-readiness
    warnings:
      - remote branch head is unknown for origin/codex/m117-git-automation-remote-readiness
      - simulator was read-only and did not mutate remote state
  m120_branch_local_interpretation:
    remote_plan_missing_summary_blocker_cleared: true
    simulator_ok_on_target_branch_context: true
    remaining_remote_plan_blocker: simulator evidence is missing
    merge_readiness: fast_forward_clean
    existing_pr: none
  exact_push_command_unapproved: git push origin codex/m117-git-automation-remote-readiness:codex/m117-git-automation-remote-readiness
next_recommended_candidate_id: C001
changes:
  - id: C001
    status: ready
    title: Refresh M117 publication preflight and choose execution model
    purpose: >
      Produce a current, read-only preflight packet for publishing the existing M117 branch from the
      M121 governance queue, including whether the later approved push should use a checked-out M117
      branch, an isolated worktree, or an exact refspec push from the governance branch.
    scope:
      includes:
        - verify local M117 branch head and repaired PR-ready summary
        - verify origin/main and absence or presence of the M117 remote branch
        - verify existing PR state for the M117 head branch
        - rerun remote-plan and simulator checks and classify branch-context blockers
        - choose the exact non-mutating preflight-to-push execution model
      excludes:
        - git push
        - PR creation or edit
        - Issue mutation
        - merge, ready-for-review, rebase, reset, force-push, or branch deletion
    owned_paths:
      - changes/M121-m117-remote-publication/
    dependencies: []
    unlocks:
      - C002
      - C003
      - C004
      - C005
    risk: medium
    size: small
    validation:
      - git status --short --branch
      - git rev-parse codex/m117-git-automation-remote-readiness
      - git cat-file -e codex/m117-git-automation-remote-readiness:changes/M117-git-automation-remote-readiness/PR_READY_SUMMARY.md
      - git ls-remote --heads origin main codex/m117-git-automation-remote-readiness
      - gh pr list --repo tiic-tech/openworkflow --head codex/m117-git-automation-remote-readiness --base main --json number,url,state,isDraft,title,headRefName,baseRefName
      - node dist/cli/src/index.js git-automation remote-plan --root . --queue changes/M117-git-automation-remote-readiness/CANDIDATE_CHANGES.yaml --base origin/main --remote origin --target-base main --json
      - node dist/cli/src/index.js git-automation simulate --root . --queue changes/M117-git-automation-remote-readiness/CANDIDATE_CHANGES.yaml --base main --json
      - git diff --check
    acceptance:
      - A durable preflight packet names the target branch, base branch, remote state, PR state, and blockers.
      - The packet chooses an execution model for the later approved push.
      - Any current branch mismatch is classified instead of ignored.
      - No remote or destructive git mutation occurs.
  - id: C002
    status: candidate
    title: Prepare exact high-risk push decision report
    purpose: >
      Convert the C001 preflight into a HIGH_RISK_DECISION_REPORT.md for exactly one M117 branch
      push command, including approval text, rollback guidance, and stop conditions.
    scope:
      includes:
        - state the exact git push command or exact approved alternative
        - record prior remote ref state and rollback preference
        - require clean local state and fresh C001 preflight evidence
        - record user approval language required before execution
      excludes:
        - executing the push
        - draft PR creation
        - force-push or deleting remote refs
        - PR or Issue mutation
    owned_paths:
      - changes/M121-m117-remote-publication/HIGH_RISK_DECISION_REPORT.md
      - changes/M121-m117-remote-publication/
    dependencies:
      - C001
    unlocks:
      - C003
    risk: high
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - The report names exactly one push operation and target ref.
      - The report states that it is evidence, not approval.
      - The report blocks execution until exact user approval is received.
  - id: C003
    status: candidate
    title: Execute approved M117 branch push and record remote evidence
    purpose: >
      After C002 exists and the user approves the exact push command, push the M117 branch to origin
      and record local audit evidence for the remote ref and rollback guidance.
    scope:
      includes:
        - verify the approval text matches the C002 report
        - verify clean working tree and target branch head before push
        - execute one approved git push for codex/m117-git-automation-remote-readiness
        - record remote ref, local commit, timestamp, approval source, and rollback guidance
      excludes:
        - draft PR creation
        - pushing any other branch
        - force-push
        - PR edit, ready-for-review, merge, or Issue mutation
    owned_paths:
      - changes/M121-m117-remote-publication/
    dependencies:
      - C002
    unlocks:
      - C004
      - C005
    risk: high
    size: small
    validation:
      - git status --short --branch
      - git ls-remote --heads origin codex/m117-git-automation-remote-readiness
      - git diff --check
    acceptance:
      - The M117 remote branch exists at the expected commit.
      - Local audit evidence records approval, command, remote ref, and rollback guidance.
      - No PR, Issue, merge, force-push, or unrelated remote mutation occurs.
  - id: C004
    status: candidate
    title: Create approved M117 draft PR
    purpose: >
      After the M117 branch is pushed and the user separately approves PR creation, open one draft PR
      from M117 into main and record local PR evidence.
    scope:
      includes:
        - verify remote branch exists and matches C003 evidence
        - prepare PR title and body from M117 PR_READY_SUMMARY.md
        - create one draft PR only after exact approval
        - record PR URL, number, base/head refs, draft state, and rollback guidance
      excludes:
        - marking ready for review
        - editing PR #4
        - merging
        - Issue mutation
        - creating PRs for M71 or shared M101-derived branches
    owned_paths:
      - changes/M121-m117-remote-publication/
    dependencies:
      - C003
    unlocks:
      - C005
    risk: high
    size: small
    validation:
      - gh pr list --repo tiic-tech/openworkflow --head codex/m117-git-automation-remote-readiness --base main --json number,url,state,isDraft,title,headRefName,baseRefName
      - git diff --check
    acceptance:
      - Exactly one draft PR exists for M117 into main.
      - The PR remains draft unless separately approved for ready-for-review.
      - Local audit evidence records the PR URL and approval source.
  - id: C005
    status: candidate
    title: Record M117 publication audit and next governance handoff
    purpose: >
      Close the M121 publication queue with a local post-publication audit that captures what
      happened, what remained blocked, and which later queue should handle M71, PR #4, or the shared
      M101 branch group.
    scope:
      includes:
        - summarize completed push and PR evidence or explain why publication stopped
        - update M121 summary and readable queue view
        - record deferred next queues for M71, PR #4 ready-for-review, and shared branch strategy
        - confirm no unauthorized remote or destructive operations occurred
      excludes:
        - publishing M71
        - marking PR #4 or the M117 PR ready
        - merging
        - changing product source
    owned_paths:
      - changes/M121-m117-remote-publication/
    dependencies:
      - C001
    unlocks:
      - M122-m71-historical-stack-publication
      - M123-pr4-ready-review-governance
      - M124-shared-branch-publication-strategy
    risk: medium
    size: small
    validation:
      - node dist/cli/src/index.js validate --root . --json
      - git diff --check
    acceptance:
      - A local audit names each authorized and unauthorized operation boundary.
      - The next publication governance target is explicit.
      - M121 can be handed off without requiring raw session context.
