  target_branch_local_summary_present: true
  target_branch_summary_repair_commit: 898f0152a4e3e026ee5dcc78d4ef585c722a37b7
  target_remote_branch_present: false
  target_existing_prs: []
  target_base: main
  remote: origin
  remote_plan_from_current_branch:
    ok: false
    blockers:
