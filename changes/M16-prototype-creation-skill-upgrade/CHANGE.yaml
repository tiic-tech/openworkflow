acceptance:
  - Generated ow-proto skill starts with prototype-mode classification before implementation.
  - Visual-first prototype paths require a static high-fidelity concept pass using image generation unless the user explicitly asks to skip.
  - User-provided images, URLs, screenshots, or HTML/CSS sources trigger reference-pattern extraction before visual generation or HTML implementation.
  - ow-proto protocol distinguishes visual concept evidence from runnable implementation evidence.
  - ow-proto includes a design self-critique checkpoint with explicit dimensions and repair behavior before handoff.
  - Artifact contracts and templates can record static concept assets, reference analysis, browser screenshots, verification logs, and known limits.
  - Runtime surface verification checks generated ow-proto includes the new creative workflow guidance.
  - Existing OpenWorkflow validation, sync, doctor, and runtime surface checks pass.
