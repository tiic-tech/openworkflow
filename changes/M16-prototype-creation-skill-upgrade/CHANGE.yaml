summary: >
  Upgrade /ow:proto from a runnable-proof generator into a design-capable
  prototype creation workflow that can choose the right prototype mode,
  establish visual direction before implementation, use reference extraction
  and image-generation for high-fidelity first passes, and self-critique before
  handing evidence to users.
problem: >
  Current prototype creation can produce runnable HTML evidence, but its visual
  judgment, problem decomposition, and UX execution are inconsistent. It tends
  to jump into implementation before establishing a high-fidelity direction,
  especially for visual or product-experience prototypes. This creates long
  proto/decision loops, makes users carry too much art direction manually, and
  weakens downstream evidence.
goals:
  - Rewrite /ow:proto skill protocol around prototype-mode classification and design planning.
  - For visual-first prototypes, require a high-fidelity static image concept before HTML implementation unless the user explicitly skips it.
  - Use image generation as the default first visual pass for aesthetic direction, layout mood, and material/brand exploration.
  - Require reference-pattern extraction when the user provides a target image, URL, screenshot, or HTML/CSS source.
  - Introduce design-system and template-seed concepts so agents do not design every prototype from a blank page.
  - Add a self-critique loop covering philosophy, hierarchy, execution, specificity, restraint, accessibility, and responsive behavior.
  - Record visual concept evidence and implementation evidence distinctly in prototype artifacts.
  - Preserve scope discipline: do not turn prototypes into production apps, persistence, auth, or specs unless the validation question requires it.
non_goals:
  - Do not implement /ow:tune in this change.
  - Do not change vision/design conversation-first behavior from M15.
  - Do not add a full design-system registry or template marketplace in this change.
  - Do not require image generation for logic-only, data-flow, API, or technical feasibility prototypes.
  - Do not create production design specs from unaccepted prototype evidence.
decisions:
  - /ow:proto must first classify the prototype as visual, interaction, technical feasibility, 3D/material, workflow, or data/logic.
  - Visual and product-experience prototypes should normally produce a high-fidelity static concept before HTML.
  - Reference inputs are first-class evidence and should be analyzed before new visual work begins.
  - Image concepts, reference analyses, screenshots, runnable HTML, logs, and self-critique reports should be separate evidence entries.
  - Open Design's design-system, template-seed, checklist, and critique patterns are useful references, but M16 will adapt them to OpenWorkflow rather than copy Open Design's full daemon architecture.
affected_paths:
  - packages/core/src/artifacts/
  - packages/core/src/commands/
  - packages/core/src/workflow/
